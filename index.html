<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetaboAnálise</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6675; --border: #dde1e8;
  --accent: #2563eb; --accent-text: #ffffff; --accent-soft: #e8efff;
  --ok: #15803d; --warn: #b45309; --err: #b91c1c; --tip-bg: #1d2330; --tip-text: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --border: #2c3340;
    --accent: #60a5fa; --accent-text: #0b1220; --accent-soft: #1e2a40;
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --tip-bg: #e6e9ef; --tip-text: #12151b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.45;
       font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
             max-width: 1100px; margin: 0 auto; padding: 20px 16px 0; }
header.top h1 { margin: 0; font-size: 1.6rem; }
header.top p { margin: 4px 0 0; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
         margin-bottom: 16px; }
.panel h2 { margin: 0 0 4px; font-size: 1.2rem; }
.panel h3 { margin: 18px 0 6px; font-size: 1rem; }
.muted { color: var(--muted); }
.privacy { margin: 0 0 12px; font-size: 0.95rem; }
.stepper { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.stepper button { border: 1px solid var(--border); background: var(--panel); color: var(--text);
                  border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
.stepper button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.stepper button:disabled { opacity: 0.45; cursor: not-allowed; }
.field { display: grid; grid-template-columns: minmax(200px, 340px) 1fr; gap: 6px 16px; align-items: center;
         margin: 10px 0; }
.label { display: flex; align-items: center; gap: 8px; }
.control { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.control-row { display: flex; align-items: center; gap: 10px; }
.choice-help { font-size: 0.9rem; }
.help { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--muted);
        background: transparent; color: var(--muted); font: italic 700 12px/1 Georgia, serif; cursor: help;
        padding: 0; }
.help:hover, .help:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
#tooltip { position: fixed; z-index: 1000; max-width: min(340px, calc(100vw - 16px)); background: var(--tip-bg);
           color: var(--tip-text); padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; display: none;
           box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2); }
.checks { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
select, input[type=number] { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
                             background: var(--panel); color: var(--text); font: inherit; max-width: 100%; }
select[multiple] { width: 100%; min-height: 140px; }
input[type=range] { width: min(320px, 100%); }
.btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px;
       padding: 8px 16px; cursor: pointer; font: inherit; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.actions .spacer { flex: 1; }
.progress { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
.style-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 6px 0; }
.style-row .name { min-width: 120px; font-weight: 600; }
.style-row input[type=color] { width: 44px; height: 32px; border: 1px solid var(--border); border-radius: 6px;
                               background: var(--panel); padding: 2px; }
.results-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border); margin: 12px 0; }
.tab { border: none; border-bottom: 2px solid transparent; background: none; color: var(--muted);
       padding: 8px 12px; cursor: pointer; font: inherit; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab.has-error { color: var(--err); }
.tab-panel img { display: block; max-width: 100%; height: auto; background: #fff; border-radius: 6px; margin: 8px 0; }
.table-wrap { overflow: auto; max-height: 420px; border: 1px solid var(--border); border-radius: 6px; margin: 8px 0; }
table.table { border-collapse: collapse; font-size: 0.8rem; }
table.table th, table.table td { padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
                                 text-align: right; }
table.table th { position: sticky; top: 0; background: var(--panel); }
.error { color: var(--err); margin: 8px 0; }
.error pre { white-space: pre-wrap; font-size: 0.75rem; color: var(--muted); }
.ok { color: var(--ok); }
.hidden { display: none !important; }
footer { font-size: 0.8rem; margin: 24px 0 8px; }
@media (max-width: 640px) {
  header.top { flex-direction: column; }
  .field { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 data-i18n="app.title"></h1>
    <p class="muted" data-i18n="app.subtitle"></p>
  </div>
  <label class="label"><span data-i18n="lang.label"></span>
    <select id="lang"><option value="pt">Português</option><option value="en">English</option></select>
  </label>
</header>
<main>
  <p class="privacy" data-i18n="app.privacy"></p>
  <div id="boot" class="panel"><span id="boot-text"></span><div class="progress"><div id="boot-bar"></div></div></div>

  <nav class="stepper" id="stepper"></nav>

  <section class="panel step" data-step="1">
    <h2 data-i18n="step.1"></h2>
    <p class="muted" data-i18n="step.1.help"></p>
    <div class="field">
      <div class="label" data-help="data.file.help"><label for="csv-file" data-i18n="data.file"></label><button type="button" class="help" data-help="data.file.help">i</button></div>
      <div class="control"><input type="file" id="csv-file" accept=".csv,text/csv"></div>
    </div>
    <div class="field hidden" id="group-row-field">
      <div class="label" data-help="data.group_row.help"><label for="group-row" data-i18n="data.group_row"></label><button type="button" class="help" data-help="data.group_row.help">i</button></div>
      <div class="control"><select id="group-row"></select></div>
    </div>
    <div id="data-info"></div>
  </section>

  <section class="panel step hidden" data-step="2">
    <h2 data-i18n="step.2"></h2>
    <p class="muted" data-i18n="step.2.help"></p>
    <div class="field">
      <div class="label" data-help="pre.groups.help"><span data-i18n="pre.groups"></span><button type="button" class="help" data-help="pre.groups.help">i</button></div>
      <div class="control"><div class="checks" id="pre-groups"></div></div>
    </div>
    <div class="field">
      <div class="label" data-help="pre.exclude.help"><label for="pre-exclude" data-i18n="pre.exclude"></label><button type="button" class="help" data-help="pre.exclude.help">i</button></div>
      <div class="control"><select id="pre-exclude" multiple></select></div>
    </div>
    <div id="form-2"></div>
    <div class="actions">
      <button type="button" class="btn" id="apply-btn" data-i18n="btn.apply" disabled></button>
      <button type="button" class="help" data-help="btn.apply.help">i</button>
    </div>
  </section>

  <section class="panel step hidden" data-step="3">
    <h2 data-i18n="step.3"></h2>
    <p class="muted" data-i18n="step.3.help"></p>
    <div class="field">
      <div class="label" data-help="ana.groups.help"><span data-i18n="ana.groups"></span><button type="button" class="help" data-help="ana.groups.help">i</button></div>
      <div class="control"><div class="checks" id="ana-groups"></div></div>
    </div>
    <div class="field">
      <div class="label" data-help="ana.exclude.help"><label for="ana-exclude" data-i18n="ana.exclude"></label><button type="button" class="help" data-help="ana.exclude.help">i</button></div>
      <div class="control"><select id="ana-exclude" multiple></select></div>
    </div>
    <div class="field">
      <div class="label" data-help="ana.comparisons.help"><span data-i18n="ana.comparisons"></span><button type="button" class="help" data-help="ana.comparisons.help">i</button></div>
      <div class="control"><div class="checks" id="comparisons"></div></div>
    </div>
    <div class="field">
      <div class="label" data-help="ana.analyses.help"><span data-i18n="ana.analyses"></span><button type="button" class="help" data-help="ana.analyses.help">i</button></div>
      <div class="control"><div class="checks" id="analyses"></div></div>
    </div>
    <div id="form-3"></div>
  </section>

  <section class="panel step hidden" data-step="4">
    <h2 data-i18n="step.4"></h2>
    <p class="muted" data-i18n="step.4.help"></p>
    <div class="field">
      <div class="label" data-help="style.groups.help"><span data-i18n="style.groups"></span><button type="button" class="help" data-help="style.groups.help">i</button></div>
      <div class="control"><div id="style-rows"></div><div><button type="button" class="btn" id="style-reset" data-i18n="style.reset"></button></div></div>
    </div>
    <div id="form-4"></div>
  </section>

  <section class="panel step hidden" data-step="5">
    <h2 data-i18n="step.5"></h2>
    <p class="muted" data-i18n="step.5.help"></p>
    <div class="field">
      <div class="label" data-help="gnps.library.help"><label for="gnps-library" data-i18n="gnps.library"></label><button type="button" class="help" data-help="gnps.library.help">i</button></div>
      <div class="control"><input type="file" id="gnps-library" accept=".tsv,text/tab-separated-values"></div>
    </div>
    <div class="field">
      <div class="label" data-help="gnps.network.help"><label for="gnps-network" data-i18n="gnps.network"></label><button type="button" class="help" data-help="gnps.network.help">i</button></div>
      <div class="control"><input type="file" id="gnps-network" accept=".graphml"></div>
    </div>
    <div id="gnps-info"></div>
    <div id="form-5"></div>
  </section>

  <div class="panel actions">
    <button type="button" class="btn" id="back-btn" data-i18n="nav.back"></button>
    <button type="button" class="btn" id="next-btn" data-i18n="nav.next"></button>
    <span class="spacer"></span>
    <button type="button" class="btn primary" id="run-btn" data-i18n="btn.run" disabled></button>
    <button type="button" class="help" data-help="btn.run.help">i</button>
  </div>
  <div class="panel"><div id="status" class="muted"></div><div class="progress"><div id="run-bar"></div></div></div>

  <section class="panel hidden" id="results">
    <div class="results-head">
      <h2 data-i18n="results.title"></h2>
      <button type="button" class="btn" id="download-btn" data-i18n="btn.download" disabled></button>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="panels"></div>
  </section>
  <footer class="muted"><span data-i18n="app.footer"></span> 2026-10-15 (9f869e3)</footer>
</main>
<div id="tooltip" role="tooltip"></div>

<script type="text/plain" id="worker-src">const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.28.3/full/";
const PY_FILES = {"src/__init__.py": "\"\"\"Metabolomics analysis toolkit.\n\nPublic functions are re-exported here for convenient imports such as:\n\n    from src import plot_pca, plot_hca, volcano_plot\n\"\"\"\n\nfrom .gnps import annotate_features, load_gnps_library_matches, load_gnps_network, parse_feature_names\nfrom .hca import plot_hca\nfrom .heatmap import plot_heatmap_with_hca\nfrom .norm_summary import plot_norm_summary, plot_sample_norm_summary\nfrom .pca import (\n    draw_confidence_ellipse,\n    pca_importances,\n    perform_pca,\n    plot_pca,\n    remove_zero_columns,\n)\nfrom .plsda import (\n    acc_r2_q2_by_n_components,\n    permutation_test_plsda,\n    plot_acc_r2_q2_for_pls,\n    plot_pls,\n    plot_pls_3D,\n    plsda_vip_table,\n)\nfrom .preprocessing import (\n    load_metaboanalyst_csv,\n    prepare_pairwise_analysis,\n    preprocess_like_metaboanalyst,\n    select_metabolomics_rows,\n)\nfrom .venn import plot_upset_sets, plot_venn2_sets, plot_venn3_sets, upset_intersection_counts\nfrom .volcano_plot import volcano_plot\n\n__all__ = [\n    \"acc_r2_q2_by_n_components\",\n    \"annotate_features\",\n    \"draw_confidence_ellipse\",\n    \"load_gnps_library_matches\",\n    \"load_gnps_network\",\n    \"load_metaboanalyst_csv\",\n    \"parse_feature_names\",\n    \"pca_importances\",\n    \"perform_pca\",\n    \"permutation_test_plsda\",\n    \"plot_acc_r2_q2_for_pls\",\n    \"plot_hca\",\n    \"plot_heatmap_with_hca\",\n    \"plot_norm_summary\",\n    \"plot_pca\",\n    \"plot_pls\",\n    \"plot_pls_3D\",\n    \"plot_sample_norm_summary\",\n    \"plot_upset_sets\",\n    \"plot_venn2_sets\",\n    \"plot_venn3_sets\",\n    \"plsda_vip_table\",\n    \"prepare_pairwise_analysis\",\n    \"preprocess_like_metaboanalyst\",\n    \"remove_zero_columns\",\n    \"select_metabolomics_rows\",\n    \"upset_intersection_counts\",\n    \"volcano_plot\",\n]\n", "src/gnps.py": "\"\"\"Link statistically important features to GNPS2 (FBMN) library annotations and molecular networks.\n\nFeatures are expected to be named as in the MZmine \"export for statistics\" file: ``ID/mzmz/RTmin``\n(e.g. ``2088/868.5485mz/9.03min``). The ID is the MZmine row ID, which GNPS2 reports as ``#Scan#`` in\n``merged_results_with_gnps.tsv`` and as the node id in the network ``.graphml``.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport io\nimport re\nimport xml.etree.ElementTree as ET\n\nimport numpy as np\nimport pandas as pd\n\nFEATURE_PATTERN = re.compile(r\"^(?P<feature_id>\\d+)/(?P<mz>[\\d.]+)mz/(?P<rt>[\\d.]+)min$\")\nGRAPHML_NS = \"{http://graphml.graphdrawing.org/xmlns}\"\n\nLIBRARY_COLUMNS = {\n    \"Compound_Name\": \"anotacao\",\n    \"Adduct\": \"aduto\",\n    \"MQScore\": \"cosine\",\n    \"SharedPeaks\": \"picos_em_comum\",\n    \"MZErrorPPM\": \"erro_ppm\",\n    \"LibraryName\": \"biblioteca\",\n    \"LibraryQualityString\": \"qualidade_biblioteca\",\n    \"SpectrumID\": \"spectrum_id\",\n    \"molecular_formula\": \"formula\",\n    \"Smiles\": \"smiles\",\n    \"InChIKey\": \"inchikey\",\n    \"npclassifier_pathway\": \"npclassifier_pathway\",\n    \"npclassifier_superclass\": \"npclassifier_superclass\",\n    \"npclassifier_class\": \"npclassifier_class\",\n}\n\n\ndef parse_feature_names(names) -> pd.DataFrame:\n    \"\"\"Split ``ID/mz/RT`` feature names into ``feature_id``, ``mz`` and ``rt`` (NaN when the name differs).\"\"\"\n    names = pd.Series(list(names), dtype=\"string\")\n    parsed = names.str.extract(FEATURE_PATTERN)\n    out = pd.DataFrame({\"feature\": names.astype(str)})\n    out[\"feature_id\"] = pd.to_numeric(parsed[\"feature_id\"], errors=\"coerce\").astype(\"Int64\")\n    out[\"mz\"] = pd.to_numeric(parsed[\"mz\"], errors=\"coerce\")\n    out[\"rt\"] = pd.to_numeric(parsed[\"rt\"], errors=\"coerce\")\n    return out\n\n\ndef _as_buffer(source):\n    return io.BytesIO(source) if isinstance(source, (bytes, bytearray)) else source\n\n\ndef load_gnps_library_matches(source) -> pd.DataFrame:\n    \"\"\"Read ``merged_results_with_gnps.tsv`` (path or bytes); keeps the best match (highest cosine) per scan.\"\"\"\n    table = pd.read_csv(_as_buffer(source), sep=\"\\t\")\n    if \"#Scan#\" not in table.columns:\n        raise ValueError(\"Arquivo GNPS2 sem a coluna '#Scan#' (esperado: merged_results_with_gnps.tsv).\")\n    table = table.sort_values(\"MQScore\", ascending=False).drop_duplicates(\"#Scan#\")\n    if \"Compound_Name\" in table.columns:\n        unnamed = table[\"Compound_Name\"].isna() | table[\"Compound_Name\"].astype(str).str.strip().eq(\"\")\n        fallback = table.get(\"SpectrumID\", pd.Series(\"\", index=table.index)).astype(str)\n        table.loc[unnamed, \"Compound_Name\"] = \"(sem nome na biblioteca) \" + fallback[unnamed]\n    keep = {col: new for col, new in LIBRARY_COLUMNS.items() if col in table.columns}\n    out = table[[\"#Scan#\", \"SpecMZ\", *keep]].rename(columns={\"#Scan#\": \"feature_id\", \"SpecMZ\": \"lib_query_mz\", **keep})\n    out[\"feature_id\"] = out[\"feature_id\"].astype(\"Int64\")\n    return out.reset_index(drop=True)\n\n\ndef load_gnps_network(source) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"Read a GNPS2 network ``.graphml`` (path or bytes) into node and edge tables.\"\"\"\n    root = ET.parse(_as_buffer(source)).getroot()\n    keys = {key.get(\"id\"): key.get(\"attr.name\") for key in root.iter(f\"{GRAPHML_NS}key\")}\n\n    def attributes(element):\n        return {keys.get(data.get(\"key\"), data.get(\"key\")): data.text for data in element.iter(f\"{GRAPHML_NS}data\")}\n\n    nodes = pd.DataFrame([{\"feature_id\": node.get(\"id\"), **attributes(node)} for node in root.iter(f\"{GRAPHML_NS}node\")])\n    edges = pd.DataFrame(\n        [{\"source\": edge.get(\"source\"), \"target\": edge.get(\"target\"), **attributes(edge)}\n         for edge in root.iter(f\"{GRAPHML_NS}edge\")]\n    )\n    if nodes.empty:\n        raise ValueError(\"Nenhum no encontrado no arquivo .graphml.\")\n\n    nodes[\"feature_id\"] = pd.to_numeric(nodes[\"feature_id\"], errors=\"coerce\").astype(\"Int64\")\n    for col in (\"mz\", \"rt\", \"component\"):\n        if col in nodes.columns:\n            nodes[col] = pd.to_numeric(nodes[col], errors=\"coerce\")\n    nodes[\"component\"] = nodes.get(\"component\", pd.Series(-1, index=nodes.index)).fillna(-1).astype(int)\n\n    if not edges.empty:\n        for col in (\"source\", \"target\"):\n            edges[col] = pd.to_numeric(edges[col], errors=\"coerce\").astype(\"Int64\")\n        edges[\"score\"] = pd.to_numeric(edges.get(\"score\"), errors=\"coerce\")\n        edges[\"deltamz\"] = pd.to_numeric(edges.get(\"deltamz\"), errors=\"coerce\")\n        edges = edges[edges[\"source\"] != edges[\"target\"]]  # remove self-loops\n    else:\n        edges = pd.DataFrame(columns=[\"source\", \"target\", \"score\", \"deltamz\"])\n    return nodes, edges\n\n\ndef _match_features_to_nodes(features, nodes, mz_tol_ppm, rt_tol, min_id_agreement=0.9):\n    \"\"\"Map each feature to a network node.\n\n    If the IDs agree with the network (same m/z and RT for >= ``min_id_agreement`` of the shared IDs), the\n    statistics file and the network come from the same MZmine feature list and only IDs are used: features\n    absent from the network simply have no MS2. Otherwise (e.g. MZmine was re-run) every feature is matched\n    to the closest node within the m/z and RT tolerances.\n    \"\"\"\n    by_id = nodes.drop_duplicates(\"feature_id\").set_index(\"feature_id\")[[\"mz\", \"rt\"]]\n    shared = features[features[\"feature_id\"].isin(by_id.index)]\n    if not shared.empty:\n        node = by_id.loc[shared[\"feature_id\"].astype(int)]\n        agree = ((node[\"mz\"].to_numpy() - shared[\"mz\"].to_numpy()).__abs__() / shared[\"mz\"].to_numpy() * 1e6\n                 <= mz_tol_ppm) & ((node[\"rt\"].to_numpy() - shared[\"rt\"].to_numpy()).__abs__() <= rt_tol)\n        if np.nanmean(agree) >= min_id_agreement:\n            in_network = features[\"feature_id\"].isin(by_id.index)\n            node_ids = features[\"feature_id\"].where(in_network).astype(\"Int64\").array\n            methods = np.where(in_network, \"ID\", \"sem MS2 na rede\").tolist()\n            return node_ids, methods\n\n    node_ids, methods = [], []\n    for row in features.itertuples(index=False):\n        if pd.isna(row.mz) or pd.isna(row.rt):\n            node_ids.append(pd.NA)\n            methods.append(\"sem MS2 na rede\")\n            continue\n        ppm = (nodes[\"mz\"] - row.mz).abs() / row.mz * 1e6\n        drt = (nodes[\"rt\"] - row.rt).abs()\n        candidates = (ppm <= mz_tol_ppm) & (drt <= rt_tol)\n        if not candidates.any():\n            node_ids.append(pd.NA)\n            methods.append(\"sem MS2 na rede\")\n        else:\n            best = (drt[candidates] / rt_tol + ppm[candidates] / mz_tol_ppm).idxmin()\n            node_ids.append(nodes.loc[best, \"feature_id\"])\n            methods.append(\"m/z + RT\")\n    return pd.array(node_ids, dtype=\"Int64\"), methods\n\n\ndef _format_hit(name, score=None, deltamz=None, max_len=70):\n    name = str(name)\n    name = name if len(name) <= max_len else name[: max_len - 3] + \"...\"\n    details = []\n    if score is not None and pd.notna(score):\n        details.append(f\"cos {score:.2f}\")\n    if deltamz is not None and pd.notna(deltamz):\n        details.append(f\"dm/z {deltamz:+.3f}\")\n    return f\"{name} ({', '.join(details)})\" if details else name\n\n\ndef annotate_features(\n    features: pd.DataFrame,\n    library: pd.DataFrame | None = None,\n    nodes: pd.DataFrame | None = None,\n    edges: pd.DataFrame | None = None,\n    *,\n    feature_col=\"variables\",\n    min_cosine=0.7,\n    min_shared_peaks=6,\n    min_edge_score=0.7,\n    mz_tol_ppm=10.0,\n    rt_tol=0.1,\n    max_listed=5,\n) -> pd.DataFrame:\n    \"\"\"Add GNPS2 library annotation and molecular-network context to a feature table.\n\n    Returns the input table plus annotation columns and ``nivel_evidencia``:\n    ``biblioteca`` (direct spectral match), ``vizinho anotado`` (cosine neighbour of an annotated node),\n    ``familia molecular`` (same network component as an annotated node), ``sem anotacao`` or ``sem MS2 na rede``.\n    \"\"\"\n    out = features.reset_index(drop=True).copy()\n    parsed = parse_feature_names(out[feature_col])\n    for col in (\"feature_id\", \"mz\", \"rt\"):\n        out[col] = parsed[col].to_numpy()\n\n    if nodes is not None:\n        out[\"no_rede\"], out[\"ligacao\"] = _match_features_to_nodes(parsed, nodes, mz_tol_ppm, rt_tol)\n    else:\n        out[\"no_rede\"], out[\"ligacao\"] = parsed[\"feature_id\"].array, \"ID\"\n\n    # Filtered library matches, keyed by node id\n    lib = None\n    if library is not None and not library.empty:\n        lib = library.copy()\n        if \"cosine\" in lib.columns:\n            lib = lib[lib[\"cosine\"] >= min_cosine]\n        if \"picos_em_comum\" in lib.columns:\n            lib = lib[lib[\"picos_em_comum\"] >= min_shared_peaks]\n        lib = lib.drop(columns=[\"lib_query_mz\"], errors=\"ignore\").rename(columns={\"feature_id\": \"no_rede\"})\n        out = out.merge(lib, on=\"no_rede\", how=\"left\")\n    annotated_names = (\n        dict(zip(lib[\"no_rede\"].astype(int), lib[\"anotacao\"].astype(str))) if lib is not None else {}\n    )\n\n    if nodes is not None:\n        node_info = nodes.set_index(\"feature_id\")\n        sizes = nodes.loc[nodes[\"component\"] >= 0, \"component\"].value_counts()\n        out[\"componente\"] = out[\"no_rede\"].map(node_info[\"component\"]).astype(\"Int64\")\n        out[\"tamanho_componente\"] = out[\"componente\"].map(sizes).fillna(1).astype(\"Int64\")\n        out.loc[out[\"no_rede\"].isna(), \"tamanho_componente\"] = pd.NA\n\n        # neighbours (both directions) with edge score\n        links = pd.concat(\n            [edges.rename(columns={\"source\": \"a\", \"target\": \"b\"}),\n             edges.rename(columns={\"source\": \"b\", \"target\": \"a\"}).assign(deltamz=lambda d: -d[\"deltamz\"])],\n            ignore_index=True,\n        )\n        links = links[links[\"score\"] >= min_edge_score]\n        links = links[links[\"b\"].isin(list(annotated_names))]\n        neighbours = {\n            int(node): \"; \".join(\n                _format_hit(annotated_names[int(row.b)], row.score, row.deltamz)\n                for row in group.sort_values(\"score\", ascending=False).head(max_listed).itertuples()\n            )\n            for node, group in links.groupby(\"a\")\n        }\n        out[\"vizinhos_anotados\"] = out[\"no_rede\"].map(lambda n: neighbours.get(int(n), \"\") if pd.notna(n) else \"\")\n\n        annotated_nodes = nodes[nodes[\"feature_id\"].isin(list(annotated_names)) & (nodes[\"component\"] >= 0)]\n        family = {\n            int(comp): group[\"feature_id\"].astype(int).tolist()\n            for comp, group in annotated_nodes.groupby(\"component\")\n        }\n\n        def family_names(row):\n            if pd.isna(row[\"componente\"]) or row[\"componente\"] < 0:\n                return \"\"\n            members = [m for m in family.get(int(row[\"componente\"]), []) if m != row[\"no_rede\"]]\n            unique = list(dict.fromkeys(annotated_names[m] for m in members))\n            text = \"; \".join(_format_hit(name) for name in unique[:max_listed])\n            return text + (f\" (+{len(unique) - max_listed})\" if len(unique) > max_listed else \"\")\n\n        out[\"anotados_na_familia\"] = out.apply(family_names, axis=1)\n        in_network = out[\"no_rede\"].notna()\n    else:\n        out[\"vizinhos_anotados\"] = \"\"\n        out[\"anotados_na_familia\"] = \"\"\n        in_network = pd.Series(True, index=out.index)\n\n    has_library = out[\"anotacao\"].notna() if \"anotacao\" in out.columns else pd.Series(False, index=out.index)\n    out[\"nivel_evidencia\"] = np.select(\n        [has_library, out[\"vizinhos_anotados\"].ne(\"\"), out[\"anotados_na_familia\"].ne(\"\"), in_network],\n        [\"biblioteca\", \"vizinho anotado\", \"familia molecular\", \"sem anotacao\"],\n        default=\"sem MS2 na rede\",\n    )\n    return out\n", "src/hca.py": "from __future__ import annotations\n\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport pandas as pd\nfrom scipy.cluster.hierarchy import dendrogram, linkage\nfrom sklearn.preprocessing import StandardScaler\n\n\ndef _metadata_columns(df: pd.DataFrame, non_numeric_columns: list[str] | None) -> list[str]:\n    if non_numeric_columns is None:\n        return []\n    return [col for col in non_numeric_columns if col in df.columns]\n\n\ndef _prepare_hca_matrix(\n    df: pd.DataFrame,\n    non_numeric_columns: list[str] | None,\n    *,\n    standard_scaler: bool,\n    metaboanalyst_transforms: bool,\n) -> pd.DataFrame:\n    \"\"\"Prepare the numeric matrix used for hierarchical clustering.\"\"\"\n    X = df.drop(columns=_metadata_columns(df, non_numeric_columns), errors=\"ignore\")\n    X = X.select_dtypes(include=[np.number]).replace([np.inf, -np.inf], np.nan)\n    X = X.dropna(axis=1, how=\"all\")\n    if X.empty:\n        raise ValueError(\"No numeric variables available for HCA.\")\n    if X.isna().any().any():\n        X = X.fillna(X.median(numeric_only=True))\n    X = X.dropna(axis=1, how=\"any\")\n\n    if metaboanalyst_transforms:\n        min_value = X.min().min()\n        offset = 1.0 if min_value >= 0 else abs(min_value) + 1.0\n        X = np.log2(X + offset)\n        std = X.std(axis=0, ddof=1)\n        keep = std > 0\n        X = X.loc[:, keep]\n        std = std.loc[keep]\n        X = (X - X.mean(axis=0)) / np.sqrt(std)\n    else:\n        keep = X.std(axis=0, ddof=1) > 0\n        X = X.loc[:, keep]\n        if standard_scaler:\n            X = pd.DataFrame(\n                StandardScaler().fit_transform(X),\n                columns=X.columns,\n                index=X.index,\n            )\n\n    if X.shape[1] < 1:\n        raise ValueError(\"HCA needs at least one non-constant numeric variable.\")\n    return X\n\n\ndef _make_linkage(X: pd.DataFrame, method: str, metric: str, optimal_ordering: bool):\n    \"\"\"Build the SciPy linkage matrix after validating the method/metric pair.\"\"\"\n    if method == \"ward\" and metric != \"euclidean\":\n        raise ValueError(\"Ward linkage is only valid with euclidean distance.\")\n    return linkage(X.to_numpy(dtype=float), method=method, metric=metric, optimal_ordering=optimal_ordering)\n\n\ndef _label_values(df: pd.DataFrame, label_col: str | None):\n    if label_col is None:\n        return [str(idx) for idx in df.index]\n    return df[label_col].astype(str).tolist()\n\n\ndef _color_leaf_labels(ax, df: pd.DataFrame, label_col: str | None, group_col: str | None, colors):\n    if group_col is None or group_col not in df.columns:\n        return\n\n    labels = _label_values(df, label_col)\n    label_to_group = dict(zip(labels, df[group_col].tolist()))\n    unique_groups = list(pd.unique(df[group_col]))\n    default_colors = [\n        \"tab:orange\",\n        \"tab:green\",\n        \"tab:red\",\n        \"tab:purple\",\n        \"tab:brown\",\n        \"tab:pink\",\n        \"tab:gray\",\n        \"tab:olive\",\n        \"tab:cyan\",\n        \"tab:blue\",\n    ]\n\n    for tick_label in ax.get_yticklabels():\n        group = label_to_group.get(tick_label.get_text())\n        if isinstance(colors, dict):\n            tick_label.set_color(colors.get(group, \"black\"))\n        elif isinstance(colors, list):\n            tick_label.set_color(colors[unique_groups.index(group) % len(colors)])\n        else:\n            tick_label.set_color(default_colors[unique_groups.index(group) % len(default_colors)])\n        tick_label.set_size(9)\n        tick_label.set_rotation(0)\n\n\ndef _style_leaf_labels_black(ax):\n    for tick_label in ax.get_yticklabels():\n        tick_label.set_color(\"black\")\n        tick_label.set_size(9)\n        tick_label.set_rotation(0)\n\n\ndef plot_hca(\n    df,\n    label_col=\"samples\",\n    group_col=\"groups\",\n    non_numeric_columns=[\"samples\", \"groups\"],\n    title=None,\n    colors=None,\n    method=\"ward\",\n    metric=\"euclidean\",\n    standard_scaler=True,\n    figsize=(7, 11),\n    save_name=None,\n    show=True,\n    metaboanalyst_transforms=False,\n    color_threshold=None,\n    optimal_ordering=False,\n    color_mode=\"group_labels\",\n    branch_color=\"black\",\n    label_color_mode=\"auto\",\n):\n    \"\"\"Plot hierarchical clustering from the full numeric matrix.\n\n    Parameters\n    ----------\n    color_mode : {\"group_labels\", \"threshold\"}\n        ``group_labels`` keeps branch color fixed and colors only leaf labels by\n        sample group. ``threshold`` lets the dendrogram color branches according\n        to ``color_threshold`` and leaves labels black.\n    branch_color : str\n        Branch color used when ``color_mode='group_labels'``.\n    label_color_mode : {\"auto\", \"group\", \"black\"}\n        Controls how leaf labels are colored. ``group`` colors labels by\n        ``group_col`` without changing the dendrogram order. ``black`` keeps all\n        labels black. ``auto`` uses group colors with ``color_mode='group_labels'``\n        and black labels with ``color_mode='threshold'``.\n    \"\"\"\n    if color_mode not in {\"group_labels\", \"threshold\"}:\n        raise ValueError(\"color_mode must be 'group_labels' or 'threshold'.\")\n    if label_color_mode not in {\"auto\", \"group\", \"black\"}:\n        raise ValueError(\"label_color_mode must be 'auto', 'group', or 'black'.\")\n\n    X = _prepare_hca_matrix(\n        df,\n        non_numeric_columns,\n        standard_scaler=standard_scaler,\n        metaboanalyst_transforms=metaboanalyst_transforms,\n    )\n    linked = _make_linkage(X, method=method, metric=metric, optimal_ordering=optimal_ordering)\n\n    fig, ax = plt.subplots(1, figsize=figsize)\n    dendrogram_kwargs = dict(\n        labels=_label_values(df, label_col),\n        leaf_rotation=90,\n        ax=ax,\n        orientation=\"left\",\n        color_threshold=color_threshold,\n    )\n    if color_mode == \"group_labels\":\n        dendrogram_kwargs[\"link_color_func\"] = lambda _: branch_color\n\n    dendrogram(linked, **dendrogram_kwargs)\n\n    if label_color_mode == \"auto\":\n        label_color_mode = \"group\" if color_mode == \"group_labels\" else \"black\"\n\n    if label_color_mode == \"group\":\n        _color_leaf_labels(ax, df, label_col, group_col, colors)\n    else:\n        _style_leaf_labels_black(ax)\n\n    ax.set_title(title or \"HCA\", weight=\"bold\", fontsize=14)\n    ax.set_xlabel(\"Distance\", weight=\"bold\", fontsize=12)\n\n    if save_name:\n        fig.savefig(save_name, dpi=500, bbox_inches=\"tight\", transparent=True)\n    elif show:\n        plt.show()\n\n    return linked\n", "src/heatmap.py": "from __future__ import annotations\n\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport pandas as pd\nimport seaborn as sns\nfrom sklearn.preprocessing import StandardScaler\n\n\ndef _metadata_columns(df: pd.DataFrame, non_numeric_columns: list[str] | None) -> list[str]:\n    if non_numeric_columns is None:\n        return []\n    return [col for col in non_numeric_columns if col in df.columns]\n\n\ndef _prepare_heatmap_matrix(\n    df: pd.DataFrame,\n    *,\n    features: list[str] | None,\n    non_numeric_columns: list[str] | None,\n    standard_scaler: bool,\n    z_score: int | None,\n) -> tuple[pd.DataFrame, list[str]]:\n    \"\"\"Prepare the numeric matrix used in the clustered heatmap.\"\"\"\n    metadata = _metadata_columns(df, non_numeric_columns)\n    numeric = df.drop(columns=metadata, errors=\"ignore\").select_dtypes(include=[np.number]).copy()\n    numeric = numeric.replace([np.inf, -np.inf], np.nan)\n    numeric = numeric.dropna(axis=1, how=\"all\")\n\n    if features is not None:\n        available = [feature for feature in features if feature in numeric.columns]\n        if not available:\n            raise ValueError(\"None of the requested heatmap features are available.\")\n        numeric = numeric.loc[:, available]\n\n    if numeric.empty:\n        raise ValueError(\"No numeric variables available for heatmap.\")\n\n    if numeric.isna().any().any():\n        numeric = numeric.fillna(numeric.median(numeric_only=True))\n    numeric = numeric.dropna(axis=1, how=\"any\")\n\n    keep = numeric.std(axis=0, ddof=1) > 0\n    numeric = numeric.loc[:, keep]\n    if numeric.empty:\n        raise ValueError(\"Heatmap needs at least one non-constant numeric variable.\")\n\n    if standard_scaler and z_score is None:\n        numeric = pd.DataFrame(\n            StandardScaler().fit_transform(numeric),\n            columns=numeric.columns,\n            index=df.index,\n        )\n\n    return numeric, list(numeric.columns)\n\n\ndef _row_color_series(\n    df: pd.DataFrame,\n    *,\n    sample_labels: list[str],\n    group_col: str | None,\n    colors,\n):\n    \"\"\"Create the optional row-color annotation based on sample groups.\"\"\"\n    if group_col is None or group_col not in df.columns:\n        return None, None\n\n    group_labels = df[group_col].tolist()\n    groups_unique = list(pd.unique(df[group_col]))\n    if isinstance(colors, dict):\n        palette = colors\n    elif isinstance(colors, list):\n        palette = {group: colors[i % len(colors)] for i, group in enumerate(groups_unique)}\n    else:\n        default_palette = sns.color_palette(\"tab10\", len(groups_unique))\n        palette = {group: default_palette[i] for i, group in enumerate(groups_unique)}\n\n    row_colors = pd.Series(group_labels, index=sample_labels).map(palette)\n    return row_colors, palette\n\n\ndef plot_heatmap_with_hca(\n    df,\n    features=None,\n    group_col=\"groups\",\n    label_col=\"samples\",\n    non_numeric_columns=None,\n    colors=None,\n    save_name=None,\n    show=True,\n    figsize=(12, 8),\n    standard_scaler=True,\n    method=\"ward\",\n    metric=\"euclidean\",\n    cmap=\"RdBu_r\",\n    title=\"Heatmap with Hierarchical Clustering\",\n    col_cluster=True,\n    row_cluster=True,\n    z_score=None,\n    xticklabels=True,\n    yticklabels=True,\n    xticklabels_fontsize=7,\n    yticklabels_fontsize=9,\n):\n    \"\"\"Generate a clustered heatmap from a cleaned numeric matrix.\"\"\"\n    if non_numeric_columns is None:\n        non_numeric_columns = [label_col, group_col]\n\n    X_scaled, used_features = _prepare_heatmap_matrix(\n        df,\n        features=features,\n        non_numeric_columns=non_numeric_columns,\n        standard_scaler=standard_scaler,\n        z_score=z_score,\n    )\n\n    sample_labels = df[label_col].astype(str).tolist() if label_col in df.columns else [str(idx) for idx in df.index]\n    X_scaled.index = sample_labels\n\n    row_colors, palette = _row_color_series(\n        df,\n        sample_labels=sample_labels,\n        group_col=group_col,\n        colors=colors,\n    )\n\n    g = sns.clustermap(\n        X_scaled[used_features],\n        method=method,\n        metric=metric,\n        cmap=cmap,\n        figsize=figsize,\n        row_colors=row_colors,\n        col_cluster=col_cluster,\n        row_cluster=row_cluster,\n        z_score=z_score,\n        xticklabels=xticklabels,\n        yticklabels=yticklabels,\n        linewidths=0,\n        dendrogram_ratio=(0.15, 0.15),\n    )\n\n    g.ax_heatmap.set_xlabel(\"Features\", fontsize=11, fontweight=\"bold\")\n    g.ax_heatmap.set_ylabel(\"Samples\", fontsize=11, fontweight=\"bold\")\n    plt.setp(g.ax_heatmap.get_xticklabels(), rotation=90, fontsize=xticklabels_fontsize)\n    plt.setp(g.ax_heatmap.get_yticklabels(), rotation=0, fontsize=yticklabels_fontsize)\n\n    if palette:\n        groups_unique = list(pd.unique(df[group_col]))\n        handles = [\n            plt.Line2D([0], [0], marker=\"s\", color=\"w\", markerfacecolor=palette[group], markersize=10, label=group)\n            for group in groups_unique\n        ]\n        g.ax_col_dendrogram.legend(\n            handles=handles,\n            title=group_col,\n            loc=\"upper left\",\n            bbox_to_anchor=(1.01, 1),\n            frameon=True,\n            fontsize=9,\n        )\n\n    if title:\n        g.fig.suptitle(title, fontsize=13, fontweight=\"bold\", y=1.02)\n\n    if save_name is not None:\n        g.fig.savefig(save_name, dpi=600, bbox_inches=\"tight\", transparent=True)\n\n    if show:\n        plt.show()\n\n    return g\n", "src/messages.py": "\"\"\"Textos mostrados pelo motor do pipeline (src/pipeline.py), em portugues e ingles.\"\"\"\n\nfrom __future__ import annotations\n\nimport html\n\nLANGUAGES = (\"pt\", \"en\")\n\nMESSAGES = {\n    \"pt\": {\n        \"tab_pre\": \"Dados normalizados\",\n        \"tab_pca\": \"PCA\",\n        \"tab_hca\": \"HCA\",\n        \"tab_heatmap\": \"Heatmap\",\n        \"tab_plsda\": \"PLS-DA\",\n        \"tab_volcano\": \"Volcano\",\n        \"tab_venn\": \"Venn / UpSet\",\n        \"tab_gnps\": \"GNPS2\",\n        \"tab_summary\": \"Resumo\",\n        \"not_selected\": \"<i>An\u00e1lise n\u00e3o selecionada no passo 3.</i>\",\n        \"error_in\": \"Erro em {section}:\",\n        \"file\": \"<b>Arquivo:</b> {name}\",\n        \"note_reused\": \"Usando o pr\u00e9-processamento j\u00e1 aplicado (par\u00e2metros iguais).\",\n        \"note_changed\": \"Os par\u00e2metros mudaram desde o \u00faltimo 'Aplicar pr\u00e9-processamento'; \"\n                        \"o pr\u00e9-processamento foi refeito com os par\u00e2metros atuais.\",\n        \"warning\": \"Aviso: {text}\",\n        \"h_stages\": \"Features em cada etapa\",\n        \"h_params\": \"Par\u00e2metros aplicados\",\n        \"h_feature_view\": \"Vis\u00e3o por feature (antes \u00d7 depois da normaliza\u00e7\u00e3o)\",\n        \"h_sample_view\": \"Vis\u00e3o por amostra (antes \u00d7 depois da normaliza\u00e7\u00e3o)\",\n        \"h_preview\": \"Dados normalizados (primeiras 10 amostras e 10 features)\",\n        \"h_samples_per_group\": \"Amostras por grupo\",\n        \"col_pre\": \"pr\u00e9-processamento\",\n        \"col_bio\": \"an\u00e1lises biol\u00f3gicas\",\n        \"err_no_pre_groups\": \"Selecione pelo menos um grupo para o pr\u00e9-processamento.\",\n        \"err_no_ana_groups\": \"Selecione pelo menos um grupo para as an\u00e1lises (passo 3).\",\n        \"err_no_comparisons\": \"Nenhuma compara\u00e7\u00e3o 2 a 2 selecionada no passo 3.\",\n        \"err_pick_ref\": \"Escolha a refer\u00eancia da normaliza\u00e7\u00e3o por amostra (passo 2).\",\n        \"err_pick_factor_row\": \"Escolha a linha ATTRIBUTE_* com os fatores por amostra (passo 2).\",\n        \"h_pca_top\": \"Top 15 features por import\u00e2ncia na PCA\",\n        \"hca_title_qc\": \"HCA - Controle anal\u00edtico (todas as amostras pr\u00e9-processadas)\",\n        \"hca_title_bio\": \"HCA - Biol\u00f3gico (grupos selecionados)\",\n        \"heatmap_title\": \"Heatmap biol\u00f3gico com HCA (top {n} vari\u00e1veis)\",\n        \"status_plsda\": \"PLS-DA {name} ({index}/{total})\",\n        \"h_plsda\": \"PLS-DA: {name}\",\n        \"plsda_perf_title\": \"Desempenho do PLS-DA - {name}\",\n        \"plsda_title\": \"PLS-DA - {name}\",\n        \"perm_floor\": \"<span style='color:#666'>p = {p} em {metrics} \u00e9 o <b>menor valor poss\u00edvel</b> com {n} \"\n                      \"permuta\u00e7\u00f5es (1/(n+1)): nenhum modelo com r\u00f3tulos embaralhados igualou o modelo real. \"\n                      \"Leia como p &lt; {p}.</span>\",\n        \"perm_pass\": \"<b style='color:#27ae60'>Modelo significativamente melhor que o acaso \"\n                     \"(p &lt; 0,05 em R2, Q2 e acur\u00e1cia).</b>\",\n        \"perm_fail\": \"<b style='color:#d35400'>Aten\u00e7\u00e3o: o modelo n\u00e3o passou em todos os crit\u00e9rios do teste de \"\n                     \"permuta\u00e7\u00e3o (p &lt; 0,05); interprete o VIP com cautela.</b>\",\n        \"vip_count\": \"<b>Features com VIP &ge; {threshold}:</b> {n}\",\n        \"h_volcano\": \"Volcano: {name}\",\n        \"volcano_counts\": \"<b>Features testadas:</b> {tested} &nbsp; <b>Significativas:</b> {significant}\",\n        \"venn_needs\": \"<i>Venn/UpSet precisa que PLS-DA e Volcano tenham sido executados com sucesso.</i>\",\n        \"h_venn_pair\": \"PLS-DA \u00d7 Volcano: {name}\",\n        \"venn_pair_title\": \"PLS-DA \u00d7 volcano - {name}\",\n        \"h_venn_summary\": \"Resumo por compara\u00e7\u00e3o\",\n        \"h_venn_across\": \"Features importantes em ambas as t\u00e9cnicas, entre compara\u00e7\u00f5es\",\n        \"venn3_title\": \"Features importantes em PLS-DA e volcano nos pares de grupos\",\n        \"upset_title\": \"UpSet - features importantes em ambas as t\u00e9cnicas por compara\u00e7\u00e3o\",\n        \"venn_final\": \"<b>Features importantes em PLS-DA e volcano em todas as compara\u00e7\u00f5es:</b> {n}\",\n        \"gnps_none\": \"<i>Nenhum arquivo GNPS2 selecionado (passo 5).</i>\",\n        \"gnps_mode_both\": \"importantes no PLS-DA e no Volcano\",\n        \"gnps_mode_either\": \"importantes no PLS-DA ou no Volcano\",\n        \"gnps_mode_all\": \"todas as features testadas\",\n        \"gnps_features\": \"<b>Features:</b> {mode}. <b>Liga\u00e7\u00e3o:</b> {links}\",\n        \"gnps_id_mismatch\": \"<b style='color:#d35400'>Os IDs n\u00e3o batem com a rede (MZmine rodado de novo?); \"\n                            \"a liga\u00e7\u00e3o foi feita por m/z e RT. Confira as anota\u00e7\u00f5es.</b>\",\n        \"h_gnps_summary\": \"Resumo por compara\u00e7\u00e3o\",\n        \"gnps_summary_help\": \"<span style='color:#666'>biblioteca = match espectral direto; vizinho anotado = \"\n                             \"ligado na rede a um n\u00f3 anotado (prov\u00e1vel an\u00e1logo); fam\u00edlia molecular = mesmo \"\n                             \"cluster de um n\u00f3 anotado.</span>\",\n        \"h_gnps_comparison\": \"{name}: {n} de {total} features com alguma anota\u00e7\u00e3o\",\n        \"gnps_full_table\": \"<span style='color:#666'>A tabela completa (SMILES, InChIKey, f\u00f3rmula, \"\n                           \"biblioteca...) est\u00e1 na aba 'GNPS2 anotacoes' do Excel.</span>\",\n        \"err_gnps_needs\": \"A anota\u00e7\u00e3o precisa dos resultados de PLS-DA e/ou Volcano (passo 3).\",\n        \"err_gnps_both\": \"O modo 'PLS-DA e Volcano' precisa dos dois; selecione-os no passo 3 ou mude o modo.\",\n        \"gnps_info_library\": \"{n} features com anota\u00e7\u00e3o de biblioteca\",\n        \"gnps_info_network\": \"rede com {nodes} n\u00f3s, {edges} arestas e {families} fam\u00edlias moleculares\",\n        \"sum_file\": \"<b>Arquivo:</b> {name}\",\n        \"sum_samples\": \"<b>Amostras analisadas:</b> {n} ({groups})\",\n        \"sum_features\": \"<b>Features ap\u00f3s o pr\u00e9-processamento:</b> {n} (removidas: {missing} por ausentes, \"\n                        \"{variance} pelo filtro de vari\u00e2ncia)\",\n        \"sum_shared\": \"<b>Features em comum (PLS-DA e volcano, todas as compara\u00e7\u00f5es):</b> {n}\",\n        \"sum_gnps_lib\": \"<b>Features importantes com anota\u00e7\u00e3o de biblioteca GNPS2:</b> {n}\",\n        \"sum_errors\": \"<b>Erros:</b> {sections}\",\n    },\n    \"en\": {\n        \"tab_pre\": \"Normalized data\",\n        \"tab_pca\": \"PCA\",\n        \"tab_hca\": \"HCA\",\n        \"tab_heatmap\": \"Heatmap\",\n        \"tab_plsda\": \"PLS-DA\",\n        \"tab_volcano\": \"Volcano\",\n        \"tab_venn\": \"Venn / UpSet\",\n        \"tab_gnps\": \"GNPS2\",\n        \"tab_summary\": \"Summary\",\n        \"not_selected\": \"<i>Analysis not selected in step 3.</i>\",\n        \"error_in\": \"Error in {section}:\",\n        \"file\": \"<b>File:</b> {name}\",\n        \"note_reused\": \"Using the pre-processing already applied (same parameters).\",\n        \"note_changed\": \"The parameters changed since the last 'Apply pre-processing'; \"\n                        \"the pre-processing was redone with the current parameters.\",\n        \"warning\": \"Warning: {text}\",\n        \"h_stages\": \"Features at each step\",\n        \"h_params\": \"Applied parameters\",\n        \"h_feature_view\": \"Feature view (before \u00d7 after normalization)\",\n        \"h_sample_view\": \"Sample view (before \u00d7 after normalization)\",\n        \"h_preview\": \"Normalized data (first 10 samples and 10 features)\",\n        \"h_samples_per_group\": \"Samples per group\",\n        \"col_pre\": \"pre-processing\",\n        \"col_bio\": \"biological analyses\",\n        \"err_no_pre_groups\": \"Select at least one group for the pre-processing.\",\n        \"err_no_ana_groups\": \"Select at least one group for the analyses (step 3).\",\n        \"err_no_comparisons\": \"No pairwise comparison selected in step 3.\",\n        \"err_pick_ref\": \"Choose the reference for the sample normalization (step 2).\",\n        \"err_pick_factor_row\": \"Choose the ATTRIBUTE_* row with the sample factors (step 2).\",\n        \"h_pca_top\": \"Top 15 features by PCA importance\",\n        \"hca_title_qc\": \"HCA - Analytical control (all pre-processed samples)\",\n        \"hca_title_bio\": \"HCA - Biological (selected groups)\",\n        \"heatmap_title\": \"Biological heatmap with HCA (top {n} variables)\",\n        \"status_plsda\": \"PLS-DA {name} ({index}/{total})\",\n        \"h_plsda\": \"PLS-DA: {name}\",\n        \"plsda_perf_title\": \"PLS-DA performance - {name}\",\n        \"plsda_title\": \"PLS-DA - {name}\",\n        \"perm_floor\": \"<span style='color:#666'>p = {p} for {metrics} is the <b>smallest possible value</b> with \"\n                      \"{n} permutations (1/(n+1)): no model with shuffled labels matched the real model. \"\n                      \"Read it as p &lt; {p}.</span>\",\n        \"perm_pass\": \"<b style='color:#27ae60'>Model significantly better than chance \"\n                     \"(p &lt; 0.05 for R2, Q2 and accuracy).</b>\",\n        \"perm_fail\": \"<b style='color:#d35400'>Caution: the model did not pass every permutation-test criterion \"\n                     \"(p &lt; 0.05); interpret the VIP with care.</b>\",\n        \"vip_count\": \"<b>Features with VIP &ge; {threshold}:</b> {n}\",\n        \"h_volcano\": \"Volcano: {name}\",\n        \"volcano_counts\": \"<b>Features tested:</b> {tested} &nbsp; <b>Significant:</b> {significant}\",\n        \"venn_needs\": \"<i>Venn/UpSet needs PLS-DA and Volcano to have run successfully.</i>\",\n        \"h_venn_pair\": \"PLS-DA \u00d7 Volcano: {name}\",\n        \"venn_pair_title\": \"PLS-DA \u00d7 volcano - {name}\",\n        \"h_venn_summary\": \"Summary per comparison\",\n        \"h_venn_across\": \"Features important in both techniques, across comparisons\",\n        \"venn3_title\": \"Features important in PLS-DA and volcano across group pairs\",\n        \"upset_title\": \"UpSet - features important in both techniques per comparison\",\n        \"venn_final\": \"<b>Features important in PLS-DA and volcano in every comparison:</b> {n}\",\n        \"gnps_none\": \"<i>No GNPS2 file selected (step 5).</i>\",\n        \"gnps_mode_both\": \"important in PLS-DA and in Volcano\",\n        \"gnps_mode_either\": \"important in PLS-DA or in Volcano\",\n        \"gnps_mode_all\": \"all tested features\",\n        \"gnps_features\": \"<b>Features:</b> {mode}. <b>Link:</b> {links}\",\n        \"gnps_id_mismatch\": \"<b style='color:#d35400'>The IDs do not match the network (MZmine run again?); \"\n                            \"features were linked by m/z and RT. Check the annotations.</b>\",\n        \"h_gnps_summary\": \"Summary per comparison\",\n        \"gnps_summary_help\": \"<span style='color:#666'>library = direct spectral match; annotated neighbor = \"\n                             \"linked in the network to an annotated node (likely analog); molecular family = \"\n                             \"same cluster as an annotated node.</span>\",\n        \"h_gnps_comparison\": \"{name}: {n} of {total} features with some annotation\",\n        \"gnps_full_table\": \"<span style='color:#666'>The full table (SMILES, InChIKey, formula, library...) is in \"\n                           \"the 'GNPS2 anotacoes' sheet of the Excel file.</span>\",\n        \"err_gnps_needs\": \"The annotation needs PLS-DA and/or Volcano results (step 3).\",\n        \"err_gnps_both\": \"The 'PLS-DA and Volcano' mode needs both; select them in step 3 or change the mode.\",\n        \"gnps_info_library\": \"{n} features with a library annotation\",\n        \"gnps_info_network\": \"network with {nodes} nodes, {edges} edges and {families} molecular families\",\n        \"sum_file\": \"<b>File:</b> {name}\",\n        \"sum_samples\": \"<b>Samples analyzed:</b> {n} ({groups})\",\n        \"sum_features\": \"<b>Features after pre-processing:</b> {n} (removed: {missing} for missing values, \"\n                        \"{variance} by the variance filter)\",\n        \"sum_shared\": \"<b>Features shared (PLS-DA and volcano, every comparison):</b> {n}\",\n        \"sum_gnps_lib\": \"<b>Important features with a GNPS2 library annotation:</b> {n}\",\n        \"sum_errors\": \"<b>Errors:</b> {sections}\",\n    },\n}\n\n\ndef t(lang, key, escape=True, **values):\n    \"\"\"Texto ``key`` no idioma ``lang`` (portugues se o idioma ou a chave nao existirem).\"\"\"\n    table = MESSAGES.get(lang, MESSAGES[\"pt\"])\n    text = table.get(key, MESSAGES[\"pt\"][key])\n    if not values:\n        return text\n    if escape:\n        values = {name: html.escape(str(value)) for name, value in values.items()}\n    return text.format(**values)\n", "src/norm_summary.py": "\"\"\"Visao geral da normalizacao, como PlotNormSummary e PlotSampleNormSummary do MetaboAnalyst.\"\"\"\n\nfrom __future__ import annotations\n\nimport matplotlib.pyplot as plt\nimport numpy as np\nfrom scipy.stats import gaussian_kde\n\n_TITLES = (\"Antes da normalizacao\", \"Depois da normalizacao\")\n\n\ndef _matrix(df, metadata_columns):\n    metadata = [col for col in metadata_columns if col in df.columns]\n    return df.drop(columns=metadata).select_dtypes(include=[np.number])\n\n\ndef _horizontal_boxplot(ax, data, labels):\n    try:\n        ax.boxplot(data, orientation=\"horizontal\", showfliers=False)\n    except TypeError:  # matplotlib < 3.10\n        ax.boxplot(data, vert=False, showfliers=False)\n    ax.set_yticks(range(1, len(labels) + 1))\n    ax.set_yticklabels([str(label)[:25] for label in labels], fontsize=5)\n\n\ndef _density(ax, values, xlabel):\n    values = np.asarray(values, dtype=float)\n    values = values[np.isfinite(values)]\n    if values.size < 2 or np.ptp(values) == 0:\n        ax.text(0.5, 0.5, \"sem variacao\", ha=\"center\", va=\"center\", transform=ax.transAxes)\n    else:\n        grid = np.linspace(values.min(), values.max(), 256)\n        density = gaussian_kde(values)(grid)\n        ax.plot(grid, density, color=\"#3182bd\")\n        ax.fill_between(grid, density, color=\"#9ecae1\", alpha=0.5)\n    ax.set_xlabel(xlabel)\n    ax.set_ylabel(\"Densidade\")\n\n\ndef _figure(pairs, density_label, show):\n    fig, axes = plt.subplots(2, 2, figsize=(11, 9), gridspec_kw={\"height_ratios\": [3, 1]})\n    for col, ((data, labels, density_values), title) in enumerate(zip(pairs, _TITLES)):\n        _horizontal_boxplot(axes[0, col], data, labels)\n        axes[0, col].set_title(title, fontweight=\"bold\")\n        _density(axes[1, col], density_values, density_label)\n    fig.tight_layout()\n    if show:\n        plt.show()\n    return fig\n\n\ndef plot_norm_summary(before, after, *, metadata_columns=(\"samples\", \"groups\"), n_features=50,\n                      random_state=0, show=True):\n    \"\"\"Visao por feature: boxplots de ate ``n_features`` features sorteadas e densidade de todos os valores.\"\"\"\n    Xb, Xa = _matrix(before, metadata_columns), _matrix(after, metadata_columns)\n    shared = [col for col in Xa.columns if col in Xb.columns]\n    if len(shared) > n_features:\n        rng = np.random.default_rng(random_state)\n        shared = [shared[i] for i in sorted(rng.choice(len(shared), n_features, replace=False))]\n    pairs = [([X[c].dropna().to_numpy() for c in shared], shared, X.to_numpy().ravel()) for X in (Xb, Xa)]\n    return _figure(pairs, \"Intensidade\", show)\n\n\ndef plot_sample_norm_summary(before, after, *, label_col=\"samples\", metadata_columns=(\"samples\", \"groups\"),\n                             n_samples=50, random_state=0, show=True):\n    \"\"\"Visao por amostra: boxplot de cada amostra e densidade das medias das amostras.\"\"\"\n    Xb, Xa = _matrix(before, metadata_columns), _matrix(after, metadata_columns)\n    labels_b = before[label_col].astype(str).to_numpy() if label_col in before else Xb.index.astype(str)\n    labels_a = after[label_col].astype(str).to_numpy() if label_col in after else Xa.index.astype(str)\n    rows = np.arange(min(len(Xb), len(Xa)))\n    if rows.size > n_samples:\n        rows = np.sort(np.random.default_rng(random_state).choice(rows, n_samples, replace=False))\n    pairs = [\n        ([X.iloc[i].dropna().to_numpy() for i in rows], [labels[i] for i in rows], X.mean(axis=1).to_numpy())\n        for X, labels in ((Xb, labels_b), (Xa, labels_a))\n    ]\n    return _figure(pairs, \"Media da amostra\", show)\n", "src/normalization.py": "\"\"\"Traducao para Python das etapas de pre-processamento do MetaboAnalystR.\n\nCada funcao cita a funcao R equivalente (xia-lab/MetaboAnalystR, branch master:\ngeneral_proc_utils.R, util_missing.R, general_misc_utils.R e general_norm_utils.R).\nTodas recebem um DataFrame com amostras nas linhas e features nas colunas.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nfrom scipy.stats import rankdata\n\nIMPUTE_METHODS = (\"exclude\", \"lod\", \"colmin\", \"mean\", \"median\")\nLOD_GROUP_FALLBACK = 1e-6\n\n\ndef remove_missing_by_percent(X, percent=0.5, groups=None):\n    \"\"\"RemoveMissingByPercent: mantem a feature se a fracao de ausentes for < percent.\n\n    Com ``groups``, mantem a feature se algum grupo ficar abaixo do limite (grpWise=TRUE).\n    \"\"\"\n    missing = X.isna()\n    if groups is None:\n        keep = missing.mean(axis=0) < percent\n    else:\n        keep = (missing.groupby(np.asarray(groups)).mean() < percent).any(axis=0)\n    return X.loc[:, keep], keep\n\n\ndef _replace_by_lod(col):\n    \"\"\".replace.by.lod: NA e zero viram 1/5 do menor valor positivo da feature.\"\"\"\n    positive = col[col > 0]\n    lod = positive.min() / 5 if len(positive) else np.inf\n    return col.mask(col.isna() | (col == 0), lod)\n\n\ndef _replace_by_group_lod(col):\n    \"\"\"ReplaceMissingByLoD.grp (safe_lod): como o LoD, com reserva quando o grupo nao tem positivo.\"\"\"\n    values = col.to_numpy(dtype=float)\n    finite = np.isfinite(values)\n    positive = values[finite & (values > 0)]\n    lod = positive.min() / 5 if positive.size else LOD_GROUP_FALLBACK\n    return col.mask(~finite | (values == 0), lod)\n\n\n_COLUMN_FILLS = {\n    \"colmin\": lambda col: col.fillna(col.min() / 2),\n    \"mean\": lambda col: col.fillna(col.mean()),\n    \"median\": lambda col: col.fillna(col.median()),\n}\n\n\ndef _apply_by_group(X, groups, func):\n    out = X.copy()\n    groups = np.asarray(groups)\n    for group in pd.unique(groups):\n        rows = groups == group\n        out.loc[rows] = X.loc[rows].apply(func, axis=0)\n    return out\n\n\ndef impute_missing(X, method=\"lod\", *, groups=None, group_wise=False):\n    \"\"\"ImputeMissingVar (my.impute.missing), apenas os metodos deterministicos.\n\n    group_wise equivale a grpLod (metodo ``lod``) ou grpMeasure (``colmin``, ``mean``, ``median``).\n    \"\"\"\n    if method not in IMPUTE_METHODS:\n        raise ValueError(f\"Unknown imputation method {method!r}. Use one of {IMPUTE_METHODS}.\")\n    if method == \"exclude\":\n        return X.loc[:, X.notna().all(axis=0)].copy()\n    if group_wise and groups is None:\n        raise ValueError(\"group_wise imputation requires groups.\")\n    if method == \"lod\":\n        if group_wise:\n            return _apply_by_group(X, groups, _replace_by_group_lod)\n        return X.apply(_replace_by_lod, axis=0)\n    func = _COLUMN_FILLS[method]\n    return _apply_by_group(X, groups, func) if group_wise else X.apply(func, axis=0)\n\n\nFEATURE_FILTERS = (\"none\", \"iqr\", \"sd\", \"mad\", \"rsd\", \"nrsd\", \"mean\", \"median\")\nMAD_CONSTANT = 1.4826  # constante padrao de mad() no R\nMAX_FEATURES = 10000  # .get.max.allow\n\n\ndef empirical_filter_cutoff(n_features):\n    \"\"\".computeEmpiricalFilterCutoff: % de features removidas conforme o tamanho dos dados.\"\"\"\n    if n_features < 250:\n        return 5\n    if n_features < 500:\n        return 10\n    if n_features < 1000:\n        return 25\n    if n_features * 0.6 > MAX_FEATURES:\n        return round(100 * (n_features - MAX_FEATURES) / n_features)\n    return 40\n\n\ndef _mad(X):\n    return (X - X.median(axis=0)).abs().median(axis=0) * MAD_CONSTANT\n\n\ndef feature_filter_values(X, method):\n    \"\"\"Valor usado no ranking de PerformFeatureFilter.\"\"\"\n    if method == \"iqr\":\n        return X.quantile(0.75, axis=0) - X.quantile(0.25, axis=0)\n    if method == \"sd\":\n        return X.std(axis=0, ddof=1)\n    if method == \"mad\":\n        return _mad(X)\n    if method == \"rsd\":\n        return (X.std(axis=0, ddof=1) / X.mean(axis=0)).abs()\n    if method == \"nrsd\":\n        return (_mad(X) / X.median(axis=0)).abs()\n    if method == \"mean\":\n        return X.mean(axis=0)\n    if method == \"median\":\n        return X.median(axis=0)\n    raise ValueError(f\"Unknown filter {method!r}. Use one of {FEATURE_FILTERS}.\")\n\n\ndef _rank_ties_random(values, rng):\n    \"\"\"rank(values, ties.method='random', na.last=TRUE).\"\"\"\n    values = np.asarray(values, dtype=float)\n    is_nan = np.isnan(values)\n    order = np.lexsort((rng.random(values.size), np.where(is_nan, 0.0, values), is_nan))\n    ranks = np.empty(values.size, dtype=float)\n    ranks[order] = np.arange(1, values.size + 1)\n    return ranks\n\n\ndef perform_feature_filter(X, method, cutoff, *, random_state=0):\n    \"\"\"PerformFeatureFilter: remove os ``cutoff``% de features com menor valor do filtro.\"\"\"\n    if method == \"none\":\n        return X.copy(), pd.Series(np.nan, index=X.columns)\n    values = feature_filter_values(X, method)\n    ranks = _rank_ties_random(-values.to_numpy(dtype=float), np.random.default_rng(random_state))\n    keep = ranks <= X.shape[1] * (1 - cutoff / 100)\n    return X.loc[:, keep], values\n\n\ndef _normalized_labels(values):\n    return pd.Series(values).astype(str).str.strip().str.lower().to_numpy()\n\n\ndef find_qc_samples(groups, samples):\n    \"\"\"FilterVariable: QC = grupo 'qc'; se nao houver, nomes que comecam com 'qc'.\"\"\"\n    by_group = _normalized_labels(groups) == \"qc\"\n    if by_group.any():\n        return by_group\n    return np.char.startswith(_normalized_labels(samples).astype(str), \"qc\")\n\n\ndef find_blank_samples(groups, samples):\n    \"\"\"FilterVariable (blank.subtraction): grupo 'blank' OU nome que comeca com 'blank'.\"\"\"\n    by_group = _normalized_labels(groups) == \"blank\"\n    by_name = np.char.startswith(_normalized_labels(samples).astype(str), \"blank\")\n    return by_group | by_name\n\n\ndef qc_rsd_filter(X, is_qc, threshold=0.20):\n    \"\"\"FilterVariable(qc.filter='T'): mantem features com |DP/media| dos QC < threshold.\"\"\"\n    is_qc = np.asarray(is_qc, dtype=bool)\n    if is_qc.sum() < 2:\n        raise ValueError(\"QC RSD filtering requires at least 2 QC samples (group 'qc' or names starting with QC).\")\n    qc = X.loc[is_qc]\n    rsd = (qc.std(axis=0, ddof=1) / qc.mean(axis=0)).abs()\n    keep = (rsd < threshold) & np.isfinite(rsd)\n    return X.loc[:, keep], rsd\n\n\ndef _lin2(x1, y1, x2, y2, x):\n    return y1 + (y2 - y1) * (x - x1) / (x2 - x1)\n\n\ndef ede(x, y, index):\n    \"\"\"ede (Extreme Distance Estimator): (j1, j2, chi) com posicoes 1-based, como no R.\"\"\"\n    x = np.asarray(x, dtype=float)\n    y = np.asarray(y, dtype=float)\n    if index == 1:\n        y = -y\n    n = x.size\n    if n < 4:\n        return np.nan, np.nan, np.nan\n    lf = y - _lin2(x[0], y[0], x[-1], y[-1], x)\n    if np.isnan(lf).all():\n        return np.nan, np.nan, np.nan\n    j1 = int(np.nanargmin(lf)) + 1\n    j2 = int(np.nanargmax(lf)) + 1\n    chi = np.nan if j2 < j1 else 0.5 * (x[j1 - 1] + x[j2 - 1])\n    return j1, j2, chi\n\n\ndef bede(x, y, index):\n    \"\"\"bede (Bisection EDE): devolve iplast, o ultimo ponto de inflexao valido.\"\"\"\n    x2 = np.asarray(x, dtype=float)\n    y2 = np.asarray(y, dtype=float)\n    j1, j2, chi = ede(x2, y2, index)\n    iplast = chi\n    while not np.isnan(chi):\n        if j2 >= j1 + 3:\n            x2 = x2[j1 - 1:j2]\n            y2 = y2[j1 - 1:j2]\n            j1, j2, chi = ede(x2, y2, index)\n            if np.isnan(chi):\n                break\n            iplast = chi\n        else:\n            break\n    return iplast\n\n\ndef blank_feature_filter(X, is_blank, threshold=10.0):\n    \"\"\"blankfeatureFiltering + remocao das amostras blank (FilterVariable, blank.subtraction=T).\n\n    O limiar e estimado pelo ponto de inflexao (bede) da razao media(blank)/media(amostras)\n    ordenada; ``threshold`` so e usado quando a estimativa automatica nao e possivel.\n    \"\"\"\n    is_blank = np.asarray(is_blank, dtype=bool)\n    if not is_blank.any() or is_blank.all():\n        raise ValueError(\"Blank subtraction requires blank samples (group 'blank' or names starting with BLANK) \"\n                         \"and non-blank samples.\")\n    blank_mean = X.loc[is_blank].mean(axis=0)\n    sample_mean = X.loc[~is_blank].mean(axis=0)\n    ratio = (blank_mean / sample_mean).to_numpy(dtype=float)\n    sorted_ratio = np.sort(ratio[~np.isnan(ratio)])[::-1]  # sort() do R descarta NA\n\n    inflection = bede(np.arange(1, sorted_ratio.size + 1), sorted_ratio, 1) if sorted_ratio.size else np.nan\n    if not np.isnan(inflection):\n        used = float(np.round(sorted_ratio[int(np.ceil(inflection)) - 1], 1) / 5)\n    else:\n        position = int(sorted_ratio.size * 0.2)  # indice fracionario do R e truncado\n        used = float(np.round(sorted_ratio[position - 1])) if position >= 1 else float(threshold)\n\n    with np.errstate(divide=\"ignore\", invalid=\"ignore\"):\n        keep = np.where(\n            sample_mean.isna(), False,\n            np.where(blank_mean.isna(), True, (sample_mean / blank_mean) > used),\n        )\n    return X.loc[~is_blank, keep.astype(bool)], used\n\n\nROW_NORMS = (\"none\", \"SumNorm\", \"MedianNorm\", \"SamplePQN\", \"GroupPQN\", \"CompNorm\", \"QuantileNorm\", \"SpecNorm\")\n\n\ndef constant_columns(X):\n    variances = X.var(axis=0, skipna=True)\n    return (variances == 0) | variances.isna()\n\n\ndef _median_norm(row):\n    \"\"\"MedianNorm, com a reserva da mediana dos valores nao-zero.\"\"\"\n    median = row.median()\n    if not np.isfinite(median) or median == 0:\n        nonzero = row[np.isfinite(row) & (row != 0)]\n        median = nonzero.median() if len(nonzero) else np.nan\n        if not np.isfinite(median) or median == 0:\n            return row\n    return row / median\n\n\ndef _prob_norm(row, reference):\n    \"\"\"ProbNorm: divide pela mediana dos quocientes finitos e positivos.\"\"\"\n    quotients = (row / reference).to_numpy(dtype=float)\n    quotients = quotients[np.isfinite(quotients) & (quotients > 0)]\n    return row if quotients.size == 0 else row / np.median(quotients)\n\n\ndef _pqn_reference_warning(reference, what):\n    \"\"\"AddPqnRefWarning.\"\"\"\n    values = np.asarray(reference, dtype=float)\n    n = values.size\n    bad = int((~np.isfinite(values) | (values <= 0)).sum())\n    if n == 0 or bad == 0:\n        return None\n    if bad == n:\n        return (f\"Todas as features da {what} sao zero ou ausentes: nenhuma amostra foi escalonada. \"\n                \"Filtre features vazias ou escolha outra referencia.\")\n    if bad * 5 >= n:\n        return (f\"{bad} de {n} features ({round(100 * bad / n)}%) da {what} sao zero ou ausentes; \"\n                f\"a normalizacao usa apenas as {n - bad} restantes.\")\n    return None\n\n\ndef quantile_normalize(X):\n    \"\"\"preprocessCore::normalize.quantiles aplicado as amostras (empates como no preprocessCore).\"\"\"\n    values = X.to_numpy(dtype=float)\n    target = np.sort(values, axis=1).mean(axis=0)\n    out = np.empty_like(values)\n    for i, row in enumerate(values):\n        ranks = rankdata(row)  # media dos postos nos empates\n        lower = np.floor(ranks).astype(int)\n        normalized = target[lower - 1]\n        tied = (ranks - lower) > 0.4\n        normalized[tied] = 0.5 * (target[lower[tied] - 1] + target[lower[tied]])\n        out[i] = normalized\n    return pd.DataFrame(out, index=X.index, columns=X.columns)\n\n\ndef row_normalize(X, method=\"none\", *, ref=None, groups=None, sample_factors=None):\n    \"\"\"Normalization(rowNorm=...): normalizacao por amostra. Devolve (matriz, avisos).\"\"\"\n    warnings = []\n    if method == \"none\":\n        return X.copy(), warnings\n    if method == \"SumNorm\":\n        return X.div(X.sum(axis=1), axis=0) * 1000, warnings\n    if method == \"MedianNorm\":\n        return X.apply(_median_norm, axis=1), warnings\n    if method in (\"SamplePQN\", \"GroupPQN\"):\n        if method == \"SamplePQN\":\n            if ref not in X.index:\n                raise ValueError(f\"Reference sample {ref!r} not found.\")\n            reference, what = X.loc[ref], f\"amostra de referencia '{ref}'\"\n        else:\n            in_group = np.asarray(groups) == ref\n            if groups is None or not in_group.any():\n                raise ValueError(f\"Reference group {ref!r} not found.\")\n            reference, what = X.loc[in_group].mean(axis=0), f\"grupo de referencia '{ref}'\"\n        warning = _pqn_reference_warning(reference, what)\n        if warning:\n            warnings.append(warning)\n        return X.apply(lambda row: _prob_norm(row, reference), axis=1), warnings\n    if method == \"CompNorm\":\n        if ref not in X.columns:\n            raise ValueError(f\"Reference feature {ref!r} not found (it may have been removed by a filter).\")\n        return (X.div(X[ref], axis=0) * 1000).drop(columns=[ref]), warnings\n    if method == \"QuantileNorm\":\n        out = quantile_normalize(X)\n        constant = constant_columns(out)\n        if constant.any():\n            warnings.append(f\"Apos a normalizacao por quantis, {int(constant.sum())} features constantes foram removidas.\")\n            out = out.loc[:, ~constant]\n        return out, warnings\n    if method == \"SpecNorm\":\n        if sample_factors is None:\n            warnings.append(\"Nenhum fator por amostra informado; todos os fatores foram considerados 1.\")\n            return X.copy(), warnings\n        if not isinstance(sample_factors, pd.Series):\n            sample_factors = pd.Series(list(sample_factors), index=X.index)\n        factors = pd.to_numeric(sample_factors, errors=\"coerce\")\n        factors.index = factors.index.astype(str)\n        factors = factors.reindex(X.index.astype(str))\n        if factors.isna().any() or (factors == 0).any():\n            raise ValueError(\"Sample factors must be numeric and non-zero for every sample.\")\n        return X.div(factors.to_numpy(), axis=0), warnings\n    raise ValueError(f\"Unknown sample normalization {method!r}. Use one of {ROW_NORMS}.\")\n\n\ndef clean_data(X, remove_na=True, remove_neg=True, remove_const=True):\n    \"\"\"CleanData: Inf -> 2*max, -Inf -> min/2, NA -> min/2, <=0 -> min/2, remove constantes.\"\"\"\n    values = X.to_numpy(dtype=float, copy=True)\n    with np.errstate(invalid=\"ignore\"):\n        for mask_func, fill in (\n            (np.isposinf, lambda v: np.nanmax(v) * 2),\n            (np.isneginf, lambda v: np.nanmin(v) / 2),\n        ):\n            mask = mask_func(values)\n            if mask.any():\n                values[mask] = np.nan\n                values[mask] = fill(values)\n        if remove_na and np.isnan(values).any():\n            values[np.isnan(values)] = np.nanmin(values) / 2\n        if remove_neg:\n            mask = values <= 0\n            if mask.any():\n                values[mask] = np.nan\n                values[mask] = np.nanmin(values) / 2\n    out = pd.DataFrame(values, index=X.index, columns=X.columns)\n    if remove_const:\n        out = out.loc[:, ~constant_columns(out)]\n    return out\n\n\nTRANS_NORMS = (\"none\", \"LogNorm\", \"Log2Norm\", \"SrNorm\", \"CrNorm\")\nSCALE_NORMS = (\"none\", \"MeanCenter\", \"AutoNorm\", \"ParetoNorm\", \"RangeNorm\")\n_GENERALIZED = {\"LogNorm\": np.log10, \"Log2Norm\": np.log2, \"SrNorm\": np.sqrt}\n\n\ndef transform(X, method=\"none\"):\n    \"\"\"Normalization(transNorm=...): log/raiz generalizados (tolerantes a zero) ou raiz cubica.\"\"\"\n    if method == \"none\":\n        return X.copy()\n    values = X.to_numpy(dtype=float)\n    if method in _GENERALIZED:\n        nonzero = np.abs(values[(values != 0) & ~np.isnan(values)])\n        min_val = nonzero.min() / 10\n        out = _GENERALIZED[method]((values + np.sqrt(values ** 2 + min_val ** 2)) / 2)\n    elif method == \"CrNorm\":\n        out = np.abs(values) ** (1 / 3)\n        out[values < 0] = -out[values < 0]\n    else:\n        raise ValueError(f\"Unknown transformation {method!r}. Use one of {TRANS_NORMS}.\")\n    return pd.DataFrame(out, index=X.index, columns=X.columns)\n\n\ndef scale(X, method=\"none\"):\n    \"\"\"Normalization(scaleNorm=...): MeanCenter, AutoNorm, ParetoNorm ou RangeNorm, por feature.\"\"\"\n    if method == \"none\":\n        return X.copy()\n    centered = X - X.mean(axis=0)\n    if method == \"MeanCenter\":\n        return centered\n    sd = X.std(axis=0, ddof=1)\n    if method == \"AutoNorm\":\n        return centered / sd\n    if method == \"ParetoNorm\":\n        return centered / np.sqrt(sd)\n    if method == \"RangeNorm\":\n        value_range = X.max(axis=0) - X.min(axis=0)\n        out = centered / value_range\n        flat = value_range == 0\n        out.loc[:, flat] = X.loc[:, flat]\n        return out\n    raise ValueError(f\"Unknown scaling {method!r}. Use one of {SCALE_NORMS}.\")\n", "src/pca.py": "from __future__ import annotations\n\nimport matplotlib.cm as cm\nimport matplotlib.colors as mcolors\nimport matplotlib.pyplot as plt\nimport matplotlib.transforms as transforms\nimport numpy as np\nimport pandas as pd\nfrom matplotlib.patches import Ellipse\nfrom pandas.api.types import is_bool_dtype, is_numeric_dtype\nfrom scipy.stats import chi2\nfrom sklearn.decomposition import PCA\nfrom sklearn.preprocessing import StandardScaler\n\n\ndef _metadata_columns(df: pd.DataFrame, non_numeric_columns: list[str] | None) -> list[str]:\n    if non_numeric_columns is None:\n        return []\n    return [col for col in non_numeric_columns if col in df.columns]\n\n\ndef _numeric_data(\n    df: pd.DataFrame,\n    non_numeric_columns: list[str] | None = None,\n    *,\n    min_non_zero: int | None = None,\n) -> pd.DataFrame:\n    data = df.drop(columns=_metadata_columns(df, non_numeric_columns), errors=\"ignore\")\n    data = data.select_dtypes(include=[np.number]).copy()\n\n    if data.empty:\n        raise ValueError(\"No numeric variables available for PCA.\")\n\n    if min_non_zero is not None:\n        keep = (data != 0).sum(axis=0) >= min_non_zero\n        data = data.loc[:, keep]\n\n    data = data.replace([np.inf, -np.inf], np.nan)\n    data = data.dropna(axis=1, how=\"all\")\n    if data.isna().any().any():\n        data = data.fillna(data.median(numeric_only=True))\n    data = data.dropna(axis=1, how=\"any\")\n\n    constant = data.std(axis=0, ddof=1) == 0\n    data = data.loc[:, ~constant]\n\n    if data.shape[1] < 2:\n        raise ValueError(\"PCA needs at least two non-constant numeric variables.\")\n\n    return data\n\n\ndef remove_zero_columns(\n    df_merge: pd.DataFrame,\n    non_numeric_columns: list[str] = [\"samples\", \"groups\"],\n    min_non_zero: int = 3,\n) -> pd.DataFrame:\n    \"\"\"Remove numeric variables observed in fewer than ``min_non_zero`` samples.\"\"\"\n    metadata = _metadata_columns(df_merge, non_numeric_columns)\n    numeric = df_merge.drop(columns=metadata, errors=\"ignore\").select_dtypes(include=[np.number])\n    numeric = numeric.dropna(axis=1, how=\"all\")\n    keep_numeric = numeric.columns[(numeric != 0).sum(axis=0) >= min_non_zero]\n    return df_merge[metadata + list(keep_numeric)]\n\n\ndef perform_pca(\n    df: pd.DataFrame,\n    non_numeric_columns: list[str] = [\"samples\", \"groups\"],\n    standard_scaler: bool = True,\n    n_components: int = 2,\n    min_non_zero: int | None = None,\n):\n    \"\"\"Fit PCA on the numeric matrix and return ``(pca, scores)``.\n\n    Constant variables are removed before PCA because they carry no variance and can\n    make scaling/importance interpretation misleading.\n    \"\"\"\n    data = _numeric_data(df, non_numeric_columns, min_non_zero=min_non_zero)\n    X = data.to_numpy(dtype=float)\n\n    if standard_scaler:\n        X = StandardScaler().fit_transform(X)\n\n    max_components = min(n_components, X.shape[0], X.shape[1])\n    if max_components < n_components:\n        raise ValueError(\n            f\"Cannot compute {n_components} PCA components with \"\n            f\"{X.shape[0]} samples and {X.shape[1]} variables.\"\n        )\n\n    pca = PCA(n_components=n_components)\n    principal_components = pca.fit_transform(X)\n    pca.feature_names_in_ = np.array(data.columns, dtype=object)\n    return pca, principal_components\n\n\ndef _as_matplotlib_color(color):\n    arr = np.asarray(color)\n    if arr.ndim == 2 and arr.shape[0] == 1:\n        return tuple(arr[0])\n    return color\n\n\ndef draw_confidence_ellipse(\n    principal_components,\n    ax,\n    color=\"black\",\n    n_std: float | None = None,\n    fill: bool = True,\n    edgecolor=\"none\",\n    alpha: float = 0.3,\n    confidence: float | None = 0.95,\n    ellipse_type: str = \"prediction\",\n    **kwargs,\n):\n    \"\"\"Draw a statistically calibrated 2D ellipse around 2D scores.\n\n    ``ellipse_type=\"prediction\"`` draws the contour expected to contain\n    ``confidence`` of a bivariate normal cloud. ``ellipse_type=\"mean\"`` draws a\n    confidence ellipse for the group mean.\n\n    If ``confidence`` is ``None``, the legacy ``n_std`` multiplier is used.\n    \"\"\"\n    points = np.asarray(principal_components, dtype=float)\n    if points.ndim != 2 or points.shape[1] != 2:\n        raise ValueError(\"draw_confidence_ellipse expects an array with shape (n, 2).\")\n    if points.shape[0] < 3:\n        return None\n\n    cov = np.cov(points, rowvar=False)\n    if not np.all(np.isfinite(cov)):\n        return None\n\n    if ellipse_type not in {\"prediction\", \"mean\"}:\n        raise ValueError(\"ellipse_type must be 'prediction' or 'mean'.\")\n    if ellipse_type == \"mean\":\n        cov = cov / points.shape[0]\n\n    eigvals, eigvecs = np.linalg.eigh(cov)\n    eigvals = np.clip(eigvals, 0, None)\n    order = eigvals.argsort()[::-1]\n    eigvals = eigvals[order]\n    eigvecs = eigvecs[:, order]\n\n    if confidence is not None:\n        scale = np.sqrt(chi2.ppf(confidence, df=2))\n    else:\n        scale = 1.0 if n_std is None else float(n_std)\n\n    width, height = 2 * scale * np.sqrt(eigvals)\n    angle = np.degrees(np.arctan2(eigvecs[1, 0], eigvecs[0, 0]))\n    mean = points.mean(axis=0)\n    color = _as_matplotlib_color(color)\n\n    ellipse = Ellipse(\n        xy=mean,\n        width=width,\n        height=height,\n        angle=angle,\n        fill=fill,\n        facecolor=color if fill else \"none\",\n        alpha=alpha,\n        edgecolor=edgecolor if edgecolor != \"none\" else color,\n        **kwargs,\n    )\n
