 ellipse.set_transform(transforms.IdentityTransform() + ax.transData)\n    ax.add_patch(ellipse)\n    return ellipse\n\n\ndef _group_style(option, index, group, default=None):\n    \"\"\"Resolve a per-group style given as a list (by group order) or a dict (by group name).\"\"\"\n    if isinstance(option, dict):\n        return option.get(group, default)\n    if isinstance(option, (list, tuple)) and option:\n        return option[index % len(option)]\n    return default\n\n\ndef annotate_points(ax, x, y, labels, fontsize=7):\n    \"\"\"Write a small label next to each point (sample names on score plots).\"\"\"\n    for xi, yi, label in zip(x, y, labels):\n        ax.annotate(str(label), (xi, yi), xytext=(4, 4), textcoords=\"offset points\", fontsize=fontsize, alpha=0.9)\n\n\ndef _auto_limits(values: pd.Series | np.ndarray) -> tuple[float, float]:\n    values = np.asarray(values, dtype=float)\n    vmin = np.nanmin(values)\n    vmax = np.nanmax(values)\n    span = vmax - vmin\n    pad = span * 0.1 if span > 0 else max(abs(vmax), 1.0) * 0.1\n    return vmin - pad, vmax + pad\n\n\ndef plot_pca(\n    df,\n    hue_col=\"groups\",\n    non_numeric_columns=[\"samples\", \"groups\"],\n    label_col=\"samples\",\n    colors=None,\n    invert_axis=False,\n    save_name=None,\n    show=True,\n    title=\"auto\",\n    ax=None,\n    grid=True,\n    figsize=(7, 5),\n    standard_scaler=True,\n    draw_ellipse=True,\n    draw_ellipse_all_data=False,\n    legend_title=None,\n    xlims=\"auto\",\n    ylims=\"auto\",\n    bbox_to_anchor=None,\n    symbols=[\"o\", \"v\", \"^\", \"s\", \"D\", \"P\"],\n    ellipse_confidence=0.95,\n    min_non_zero=3,\n    show_labels=False,\n    marker_size=None,\n    alpha=0.75,\n):\n    \"\"\"Plot the first two principal components for the input table.\n\n    ``colors`` and ``symbols`` accept a list (by group order) or a dict (group -> value).\n    ``show_labels`` writes the ``label_col`` value next to each point.\n    \"\"\"\n    df_filtered = remove_zero_columns(\n        df,\n        non_numeric_columns=non_numeric_columns,\n        min_non_zero=min_non_zero,\n    )\n    pca, principal_components = perform_pca(\n        df_filtered,\n        non_numeric_columns,\n        standard_scaler=standard_scaler,\n        n_components=2,\n    )\n\n    df_pca = pd.DataFrame(principal_components, columns=[\"PC1\", \"PC2\"], index=df_filtered.index)\n\n    if invert_axis:\n        df_pca[[\"PC1\", \"PC2\"]] = -df_pca[[\"PC1\", \"PC2\"]]\n\n    if hue_col is not None and hue_col in df_filtered.columns:\n        df_pca[hue_col] = df_filtered[hue_col].to_numpy()\n    if label_col is not None and label_col in df_filtered.columns:\n        df_pca[label_col] = df_filtered[label_col].to_numpy()\n\n    if ax is None:\n        fig, ax = plt.subplots(1, figsize=figsize)\n    else:\n        fig = ax.get_figure()\n\n    if hue_col is not None and hue_col in df_pca.columns:\n        hue_values = df_pca[hue_col]\n        numeric_hue = is_numeric_dtype(hue_values) and not is_bool_dtype(hue_values)\n\n        if numeric_hue:\n            cmap = cm.get_cmap(\"viridis\", 10)\n            norm = mcolors.Normalize(vmin=hue_values.min(), vmax=hue_values.max())\n            for _, row in df_pca.iterrows():\n                color = cmap(norm(row[hue_col]))\n                ax.scatter(row[\"PC1\"], row[\"PC2\"], color=color, alpha=alpha, edgecolors=color, s=marker_size)\n            cbar = plt.colorbar(cm.ScalarMappable(norm=norm, cmap=cmap), ax=ax)\n            cbar.set_label(hue_col, fontsize=12, weight=\"bold\")\n        else:\n            for i, group in enumerate(hue_values.unique()):\n                df_group = df_pca[df_pca[hue_col] == group]\n                color = _group_style(colors, i, group)\n\n                label = group if not is_bool_dtype(hue_values) else {True: \"Yes\", False: \"No\"}[group]\n                scatter = ax.scatter(\n                    df_group[\"PC1\"],\n                    df_group[\"PC2\"],\n                    label=label,\n                    color=color,\n                    alpha=alpha,\n                    edgecolors=color,\n                    marker=_group_style(symbols, i, group, default=\"o\"),\n                    s=marker_size,\n                )\n                if draw_ellipse and len(df_group) > 2:\n                    draw_confidence_ellipse(\n                        df_group[[\"PC1\", \"PC2\"]].values,\n                        ax,\n                        color=scatter.get_facecolor(),\n                        confidence=ellipse_confidence,\n                        linestyle=\"--\",\n                        lw=1,\n                    )\n\n            if is_bool_dtype(hue_values) and legend_title is None:\n                legend_title = hue_col\n            legend1 = ax.legend(title=legend_title, loc=\"best\", fontsize=10, bbox_to_anchor=bbox_to_anchor)\n            if legend1 is not None:\n                legend1.get_title().set_fontweight(\"bold\")\n                ax.add_artist(legend1)\n    else:\n        color = colors[0] if isinstance(colors, list) and colors else None\n        if isinstance(colors, dict) and colors:\n            color = next(iter(colors.values()))\n        ax.scatter(df_pca[\"PC1\"], df_pca[\"PC2\"], color=color, alpha=alpha, edgecolors=color, s=marker_size)\n\n    if show_labels and label_col is not None and label_col in df_pca.columns:\n        annotate_points(ax, df_pca[\"PC1\"], df_pca[\"PC2\"], df_pca[label_col])\n\n    if draw_ellipse_all_data:\n        draw_confidence_ellipse(\n            df_pca[[\"PC1\", \"PC2\"]].values,\n            ax,\n            edgecolor=\"red\",\n            linestyle=\"--\",\n            fill=False,\n            alpha=1,\n            confidence=ellipse_confidence,\n        )\n        ax.plot([], [], linestyle=\"--\", lw=1, color=\"red\", label=f\"{ellipse_confidence:.0%} ellipse\")\n\n    if title == \"auto\":\n        ax.set_title(\"PCA\", weight=\"bold\", fontsize=14)\n    elif title:\n        ax.set_title(title, weight=\"bold\", fontsize=14)\n\n    ax.grid(grid, color=\"gray\", alpha=0.1)\n    ax.axhline(0, color=\"black\", linestyle=\"--\", lw=1)\n    ax.axvline(0, color=\"black\", linestyle=\"--\", lw=1)\n    ax.set_xlabel(f\"PC1 ({pca.explained_variance_ratio_[0] * 100:.2f}%)\", weight=\"bold\", fontsize=12)\n    ax.set_ylabel(f\"PC2 ({pca.explained_variance_ratio_[1] * 100:.2f}%)\", weight=\"bold\", fontsize=12)\n\n    if xlims == \"auto\":\n        xlims = _auto_limits(df_pca[\"PC1\"])\n    if ylims == \"auto\":\n        ylims = _auto_limits(df_pca[\"PC2\"])\n    if xlims is not None:\n        ax.set_xlim(*xlims)\n    if ylims is not None:\n        ax.set_ylim(*ylims)\n\n    ax.tick_params(axis=\"x\", labelsize=11)\n    ax.tick_params(axis=\"y\", labelsize=11)\n    for label in ax.get_xticklabels() + ax.get_yticklabels():\n        label.set_weight(\"bold\")\n\n    if save_name:\n        fig.savefig(save_name, dpi=800, bbox_inches=\"tight\", transparent=True)\n    elif show:\n        plt.show()\n\n    result_cols = [\"PC1\", \"PC2\"]\n    if label_col is not None and label_col in df_pca.columns:\n        result_cols.insert(0, label_col)\n    if hue_col is not None and hue_col in df_pca.columns:\n        insert_at = 1 if label_col is not None else 0\n        result_cols.insert(insert_at, hue_col)\n    return pca, df_pca[result_cols]\n\n\ndef pca_importances(\n    pca,\n    features=None,\n    n=10,\n    color=(179 / 255.0, 153 / 255.0, 185 / 255.0, 1),\n    save_name=None,\n    show=True,\n    weight_by_variance=True,\n):\n    \"\"\"Rank variables by PCA loading magnitude, optionally weighted by explained variance.\"\"\"\n    loadings = np.asarray(pca.components_)\n    if features is None:\n        features = getattr(pca, \"feature_names_in_\", np.arange(loadings.shape[1]))\n\n    if weight_by_variance:\n        weights = np.asarray(pca.explained_variance_ratio_)[:, None]\n        importance = np.sum(np.abs(loadings) * weights, axis=0)\n    else:\n        importance = np.sum(np.abs(loadings), axis=0)\n\n    sorted_idx = np.argsort(importance)[::-1]\n    top_vars = np.array(features, dtype=object)[sorted_idx]\n    top_importances = importance[sorted_idx]\n\n    df_importance_pca = pd.DataFrame({\"mass\": top_vars, \"importance\": top_importances})\n\n    fig, ax = plt.subplots(1, figsize=(7, 5))\n    labels = [f\"{float(mass):.3f}\" if _is_float_like(mass) else str(mass) for mass in df_importance_pca[\"mass\"][:n]]\n    ax.barh(labels, df_importance_pca[\"importance\"][:n], color=color, edgecolor=\"black\", linewidth=1)\n    ax.invert_yaxis()\n\n    ax.tick_params(axis=\"x\", labelsize=11)\n    ax.tick_params(axis=\"y\", labelsize=11)\n    for label in ax.get_xticklabels() + ax.get_yticklabels():\n        label.set_weight(\"bold\")\n\n    ax.set_title(\"PCA Importances\", weight=\"bold\", fontsize=14)\n    ax.set_ylabel(\"Variables\", weight=\"bold\", fontsize=12)\n    ax.set_xlabel(\"Variance-weighted loading importance\" if weight_by_variance else \"Loading importance\", weight=\"bold\", fontsize=12)\n\n    if save_name is not None:\n        fig.savefig(save_name, dpi=600, bbox_inches=\"tight\", transparent=True)\n    elif show:\n        plt.show()\n\n    return df_importance_pca\n\n\ndef _is_float_like(value) -> bool:\n    try:\n        float(value)\n        return True\n    except (TypeError, ValueError):\n        return False\n", "src/pipeline.py": "\"\"\"Motor do pipeline de metabolomica, sem interface grafica.\n\nUsado pela interface do notebook (src/interface.py) e pela pagina HTML (web/), para que as duas\nproduzam os mesmos resultados. Cada etapa escreve o que mostra (titulos, textos, tabelas e\nfiguras) em um ``Reporter``.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport base64\nimport io\nimport math\nimport os\nimport re\nimport traceback\nimport zipfile\nfrom contextlib import contextmanager\nfrom dataclasses import dataclass, field, fields\nfrom itertools import combinations\n\nimport matplotlib.pyplot as plt\nimport pandas as pd\n\nfrom .gnps import annotate_features, load_gnps_library_matches, load_gnps_network\nfrom .hca import plot_hca\nfrom .heatmap import plot_heatmap_with_hca\nfrom .messages import t\nfrom .norm_summary import plot_norm_summary, plot_sample_norm_summary\nfrom .pca import pca_importances, plot_pca\nfrom .plsda import (\n    acc_r2_q2_by_n_components,\n    permutation_test_plsda,\n    plot_acc_r2_q2_for_pls,\n    plot_pls,\n    plsda_vip_table,\n)\nfrom .preprocessing import (\n    load_metaboanalyst_csv,\n    prepare_pairwise_analysis,\n    preprocess_like_metaboanalyst,\n    select_metabolomics_rows,\n)\nfrom .venn import plot_upset_sets, plot_venn2_sets, plot_venn3_sets\nfrom .volcano_plot import volcano_plot\n\nMETADATA_COLUMNS = [\"samples\", \"groups\"]\nGROUP_ROW_CANDIDATES = (\"ATTRIBUTE_group\", \"ATTRIBUTE_type\", \"ATTRIBUTE_time\")\nSTEP_KEYS = (\"pre\", \"pca\", \"hca\", \"heatmap\", \"plsda\", \"volcano\", \"venn\", \"gnps\", \"summary\")\nANALYSIS_KEYS = (\"pca\", \"hca\", \"heatmap\", \"plsda\", \"volcano\", \"venn\", \"gnps\")\nEVIDENCE_ORDER = [\"biblioteca\", \"vizinho anotado\", \"familia molecular\", \"sem anotacao\", \"sem MS2 na rede\"]\nGNPS_COLUMNS = [\n    \"comparacao\", \"variables\", \"feature_id\", \"mz\", \"rt\", \"vip\", \"log2_fold_change\", \"p_value\", \"adjusted_p_value\",\n    \"maior_em\", \"nivel_evidencia\", \"anotacao\", \"aduto\", \"cosine\", \"picos_em_comum\", \"erro_ppm\",\n    \"npclassifier_pathway\", \"npclassifier_superclass\", \"npclassifier_class\", \"formula\", \"smiles\", \"inchikey\",\n    \"biblioteca\", \"qualidade_biblioteca\", \"spectrum_id\", \"componente\", \"tamanho_componente\",\n    \"vizinhos_anotados\", \"anotados_na_familia\", \"ligacao\",\n]\nDEFAULT_COLORS = [\"#1f77b4\", \"#ff7f0e\", \"#2ca02c\", \"#d62728\", \"#9467bd\",\n                  \"#8c564b\", \"#e377c2\", \"#7f7f7f\", \"#bcbd22\", \"#17becf\"]\nDEFAULT_MARKERS = [\"o\", \"v\", \"^\", \"s\", \"D\", \"P\"]  # mesma sequencia usada antes no plot_pca\n\n\n# ----------------------------------------------------------------------------- parametros e estado\n@dataclass\nclass PipelineParams:\n    \"\"\"Todos os parametros escolhidos pelo usuario (passos 2 a 5).\"\"\"\n\n    lang: str = \"pt\"\n    pre_groups: list | None = None  # None = todos os grupos\n    pre_samples_exclude: list = field(default_factory=list)\n    preprocessing: dict = field(default_factory=dict)  # argumentos de preprocess_like_metaboanalyst\n    ana_groups: list | None = None  # None = todos menos 'qc'\n    ana_samples_exclude: list = field(default_factory=list)\n    comparisons: list | None = None  # None = todos os pares de ana_groups\n    analyses: list = field(default_factory=lambda: list(ANALYSIS_KEYS))\n    pca_ellipse: bool = True\n    heatmap_top: int = 100\n    vip_threshold: float = 1.0\n    plsda_max_components: int = 5\n    n_permutations: int = 1000\n    p_threshold: float = 0.05\n    fdr: bool = True\n    fc_threshold: float = 2.0  # escala linear (2 = dobro)\n    equal_var: bool = True\n    colors: dict | None = None\n    symbols: dict | None = None\n    marker_size: float = 40\n    alpha: float = 0.75\n    show_labels: bool = False\n    short_names: bool = True\n    volcano_group_colors: bool = True\n    gnps_mode: str = \"both\"\n    gnps_min_cosine: float = 0.7\n    gnps_min_peaks: int = 6\n    gnps_min_edge: float = 0.7\n    gnps_ppm: float = 10.0\n    gnps_rt: float = 0.1\n\n    @classmethod\n    def from_dict(cls, data):\n        unknown = set(data) - {item.name for item in fields(cls)}\n        if unknown:\n            raise ValueError(f\"Unknown parameters: {sorted(unknown)}\")\n        params = cls(**data)\n        if params.comparisons is not None:\n            params.comparisons = [tuple(pair) for pair in params.comparisons]\n        return params\n\n\n@dataclass\nclass PipelineState:\n    \"\"\"Dados carregados, resultados da ultima execucao e cache do pre-processamento.\"\"\"\n\n    df_raw: pd.DataFrame\n    raw_input: pd.DataFrame\n    source_name: str = \"\"\n    gnps_sources: tuple = (None, None)  # (anotacoes .tsv, rede .graphml): caminho, bytes ou None\n    results: dict = field(default_factory=dict)\n    pre_cache: tuple | None = None\n    progress: object = None  # funcao opcional que recebe mensagens de andamento\n\n    @property\n    def groups(self):\n        return list(pd.unique(self.df_raw[\"groups\"]))\n\n    @property\n    def samples(self):\n        return self.df_raw[\"samples\"].astype(str).tolist()\n\n    @property\n    def features(self):\n        return [col for col in self.df_raw.columns if col not in METADATA_COLUMNS]\n\n\ndef _buffer(source):\n    return io.BytesIO(source) if isinstance(source, (bytes, bytearray)) else source\n\n\ndef load_state(source, group_row=None, source_name=\"\"):\n    df, raw = load_metaboanalyst_csv(_buffer(source), group_row=group_row)\n    return PipelineState(df_raw=df, raw_input=raw, source_name=source_name)\n\n\ndef csv_attribute_rows(source):\n    \"\"\"Linhas ATTRIBUTE_* da primeira coluna do CSV.\"\"\"\n    first_column = pd.read_csv(_buffer(source), usecols=[0]).iloc[:, 0].astype(str)\n    return [row for row in first_column if row.startswith(\"ATTRIBUTE_\")]\n\n\ndef numeric_attribute_rows(raw):\n    return [row for row in raw.index if str(row).startswith(\"ATTRIBUTE_\")\n            and pd.to_numeric(raw.loc[row], errors=\"coerce\").notna().all()]\n\n\ndef default_style(groups):\n    colors = {g: DEFAULT_COLORS[i % len(DEFAULT_COLORS)] for i, g in enumerate(groups)}\n    symbols = {g: DEFAULT_MARKERS[i % len(DEFAULT_MARKERS)] for i, g in enumerate(groups)}\n    return colors, symbols\n\n\ndef short_names(names):\n    \"\"\"Remove o prefixo e o sufixo comuns aos nomes (ex.: '20260916_A91.mzML' -> 'A91').\n\n    O corte respeita separadores ('_', '-', '.', espaco) para nao partir um codigo ao meio.\n    \"\"\"\n    names = [str(name) for name in names]\n    if len(names) < 2:\n        return dict(zip(names, names))\n    separators = \"_-. \"\n    prefix = os.path.commonprefix(names)\n    prefix = prefix[: max(prefix.rfind(sep) for sep in separators) + 1]\n    suffix = os.path.commonprefix([name[::-1] for name in names])[::-1]\n    cuts = [suffix.find(sep) for sep in separators if sep in suffix]\n    suffix = suffix[min(cuts):] if cuts else \"\"\n    short = [name[len(prefix): len(name) - len(suffix)] for name in names]\n    if any(not name for name in short) or len(set(short)) != len(set(names)):\n        return dict(zip(names, names))\n    return dict(zip(names, short))\n\n\ndef read_gnps(library_source=None, network_source=None):\n    library = load_gnps_library_matches(library_source) if library_source is not None else None\n    network = load_gnps_network(network_source) if network_source is not None else None\n    return library, network\n\n\ndef gnps_info(library, network, lang=\"pt\"):\n    parts = []\n    if library is not None:\n        parts.append(t(lang, \"gnps_info_library\", n=len(library)))\n    if network is not None:\n        nodes, edges = network\n        families = nodes.loc[nodes[\"component\"] >= 0, \"component\"].nunique()\n        parts.append(t(lang, \"gnps_info_network\", nodes=len(nodes), edges=len(edges), families=families))\n    return \"; \".join(parts)\n\n\n# ----------------------------------------------------------------------------- saida\nclass Reporter:\n    \"\"\"Destino do que cada etapa mostra. As subclasses decidem como exibir.\"\"\"\n\n    def heading(self, text, level=3):\n        pass\n\n    def text(self, html):\n        pass\n\n    def warning(self, text):\n        self.text(f\"<span style='color:#d35400'>{text}</span>\")\n\n    def error(self, text, details=\"\"):\n        pass\n\n    def table(self, df, max_rows=None, index=True):\n        pass\n\n    def figure(self, fig):\n        pass\n\n\ndef _table_html(df, max_rows=None, index=True):\n    shown = df if max_rows is None else df.head(max_rows)\n    return shown.to_html(classes=\"table\", border=0, index=index, na_rep=\"\",\n                         float_format=lambda value: f\"{value:.4g}\")\n\n\ndef _png(fig, dpi):\n    buffer = io.BytesIO()\n    fig.savefig(buffer, format=\"png\", dpi=dpi, bbox_inches=\"tight\")\n    return buffer.getvalue()\n\n\nclass ListReporter(Reporter):\n    \"\"\"Guarda os itens em listas simples (JSON); usado nos testes e na pagina web.\"\"\"\n\n    def __init__(self, figure_dpi=110, export_dpi=None, prefix=\"figura\"):\n        self.figure_dpi = figure_dpi\n        self.export_dpi = export_dpi\n        self.prefix = prefix\n        self.items = []\n        self.exports = []\n\n    def heading(self, text, level=3):\n        self.items.append({\"type\": \"heading\", \"level\": level, \"text\": text})\n\n    def text(self, html):\n        self.items.append({\"type\": \"html\", \"html\": html})\n\n    def error(self, text, details=\"\"):\n        self.items.append({\"type\": \"error\", \"text\": text, \"details\": details})\n\n    def table(self, df, max_rows=None, index=True):\n        self.items.append({\"type\": \"table\", \"html\": _table_html(df, max_rows, index), \"rows\": int(len(df))})\n\n    def figure(self, fig):\n        png = base64.b64encode(_png(fig, self.figure_dpi)).decode(\"ascii\")\n        self.items.append({\"type\": \"figure\", \"png\": png})\n        if self.export_dpi:\n            self.exports.append((f\"{self.prefix}_{len(self.exports) + 1:02d}.png\", _png(fig, self.export_dpi)))\n\n\n@contextmanager\ndef capture_figures(reporter):\n    \"\"\"Durante o bloco, cada ``plt.show()`` entrega as figuras abertas ao reporter e as fecha.\"\"\"\n    original_show = plt.show\n\n    def show(*args, **kwargs):\n        for number in plt.get_fignums():\n            fig = plt.figure(number)\n            reporter.figure(fig)\n            plt.close(fig)\n\n    plt.show = show\n    try:\n        yield\n    finally:\n        plt.show = original_show\n\n\ndef _notify(state, message):\n    if state.progress is not None:\n        state.progress(message)\n\n\n# ----------------------------------------------------------------------------- ajudas das etapas\ndef plot_style(state, params):\n    colors, symbols = default_style(state.groups)\n    colors.update(params.colors or {})\n    symbols.update(params.symbols or {})\n    return {\"colors\": colors, \"symbols\": symbols, \"marker_size\": params.marker_size,\n            \"alpha\": params.alpha, \"show_labels\": params.show_labels}\n\n\ndef for_plot(state, params, df):\n    \"\"\"Copia da tabela com os nomes das amostras encurtados (apenas para os graficos).\"\"\"\n    if not params.short_names:\n        return df\n    mapping = short_names(state.df_raw[\"samples\"])\n    plotted = df.copy()\n    plotted[\"samples\"] = plotted[\"samples\"].astype(str).map(mapping).fillna(plotted[\"samples\"])\n    return plotted\n\n\ndef resolve_ana_groups(state, params):\n    if params.ana_groups is not None:\n        return list(params.ana_groups)\n    return [group for group in state.groups if group != \"qc\"]\n\n\ndef resolve_comparisons(state, params):\n    if params.comparisons is not None:\n        return [tuple(pair) for pair in params.comparisons]\n    return list(combinations(resolve_ana_groups(state, params), 2))\n\n\ndef preprocessing_kwargs(state, params):\n    kwargs = dict(params.preprocessing)\n    method = kwargs.get(\"row_norm\", \"none\")\n    if method in (\"SamplePQN\", \"GroupPQN\", \"CompNorm\") and kwargs.get(\"row_norm_ref\") is None:\n        raise ValueError(t(params.lang, \"err_pick_ref\"))\n    if method == \"SpecNorm\":\n        row = kwargs.get(\"row_norm_ref\")\n        if row is None:\n            raise ValueError(t(params.lang, \"err_pick_factor_row\"))\n        factors = pd.to_numeric(state.raw_input.loc[row], errors=\"coerce\")\n        factors.index = factors.index.astype(str)\n        kwargs[\"sample_factors\"] = factors\n    kwargs[\"metadata_columns\"] = METADATA_COLUMNS\n    return kwargs\n\n\ndef compute_preprocessing(state, params):\n    \"\"\"Roda o pre-processamento ou reaproveita o ultimo. Devolve (resultado, reaproveitado, mudou).\"\"\"\n    pre_groups = list(params.pre_groups) if params.pre_groups is not None else state.groups\n    if not pre_groups:\n        raise ValueError(t(params.lang, \"err_no_pre_groups\"))\n    kwargs = preprocessing_kwargs(state, params)\n    # sample_factors e definido pela linha escolhida (row_norm_ref), que ja entra na chave\n    key = repr((state.source_name, pre_groups, list(params.pre_samples_exclude),\n                sorted((k, v) for k, v in kwargs.items() if k not in (\"metadata_columns\", \"sample_factors\"))))\n    if state.pre_cache is not None and state.pre_cache[0] == key:\n        return state.pre_cache[1], True, False\n    changed = state.pre_cache is not None\n    df_pre_input = select_metabolomics_rows(\n        state.df_raw, groups_to_include=pre_groups, samples_to_exclude=list(params.pre_samples_exclude),\n    )\n    result = preprocess_like_metaboanalyst(df_pre_input, **kwargs)\n    state.pre_cache = (key, result)\n    return result, False, changed\n\n\ndef show_preprocessing(state, params, pre, reporter, note=\"\"):\n    lang = params.lang\n    reporter.text(t(lang, \"file\", name=state.source_name))\n    if note:\n        reporter.warning(note)\n    for message in pre[\"warnings\"]:\n        reporter.warning(t(lang, \"warning\", text=message))\n    reporter.heading(t(lang, \"h_stages\"), 4)\n    reporter.table(pre[\"report\"], index=False)\n    reporter.heading(t(lang, \"h_params\"), 4)\n    reporter.table(pd.Series(pre[\"params\"], name=\"valor\").to_frame())\n    reporter.heading(t(lang, \"h_feature_view\"), 4)\n    plot_norm_summary(pre[\"df_prenorm\"], pre[\"df_norm\"])\n    reporter.heading(t(lang, \"h_sample_view\"), 4)\n    plot_sample_norm_summary(for_plot(state, params, pre[\"df_prenorm\"]), for_plot(state, params, pre[\"df_norm\"]))\n    reporter.heading(t(lang, \"h_preview\"), 4)\n    reporter.table(pre[\"df_norm\"].iloc[:10, :12], index=False)\n\n\ndef pairwise(state, params):\n    \"\"\"Prepara (uma vez por execucao) os conjuntos de dados de cada comparacao 2 a 2.\"\"\"\n    r = state.results\n    if \"pairwise_comparisons\" not in r:\n        comparisons = resolve_comparisons(state, params)\n        if not comparisons:\n            raise ValueError(t(params.lang, \"err_no_comparisons\"))\n        _, _, comparisons, datasets = prepare_pairwise_analysis(\n            r[\"df_biological\"], group_col=\"groups\", comparisons_to_run=comparisons,\n        )\n        rownorm = r[\"df_biological_rownorm\"]\n        r.update(\n            pairwise_comparisons=comparisons,\n            pairwise_datasets=datasets,\n            pairwise_rownorm_datasets={\n                (a, b): rownorm[rownorm[\"groups\"].isin([a, b])].reset_index(drop=True) for a, b in comparisons\n            },\n        )\n    return r[\"pairwise_comparisons\"]\n\n\n# ----------------------------------------------------------------------------- etapas\ndef step_preprocessing(state, params, reporter):\n    lang, r = params.lang, state.results\n    pre, reused, changed = compute_preprocessing(state, params)\n    note = t(lang, \"note_reused\") if reused else (t(lang, \"note_changed\") if changed else \"\")\n    df_norm, df_rownorm = pre[\"df_norm\"], pre[\"df_rownorm\"]\n\n    ana_groups = resolve_ana_groups(state, params)\n    if not ana_groups:\n        raise ValueError(t(lang, \"err_no_ana_groups\"))\n    selection = dict(groups_to_include=[g for g in ana_groups if g in set(df_norm[\"groups\"])],\n                     samples_to_exclude=list(params.ana_samples_exclude))\n    r.update(\n        df_all_scaled=df_norm,\n        df_all_rownorm=df_rownorm,\n        df_prenorm=pre[\"df_prenorm\"],\n        df_biological=select_metabolomics_rows(df_norm, **selection),\n        df_biological_rownorm=select_metabolomics_rows(df_rownorm, **selection),\n        preprocessing_report=pre[\"report\"],\n        feature_report=pre[\"feature_report\"],\n        preprocessing_params=pre[\"params\"],\n        ana_groups=ana_groups,\n    )\n\n    show_preprocessing(state, params, pre, reporter, note)\n    counts = pd.DataFrame({\n        t(lang, \"col_pre\"): df_norm[\"groups\"].value_counts(),\n        t(lang, \"col_bio\"): r[\"df_biological\"][\"groups\"].value_counts(),\n    }).fillna(0).astype(int)\n    reporter.heading(t(lang, \"h_samples_per_group\"), 4)\n    reporter.table(counts)\n\n\ndef step_pca(state, params, reporter):\n    r = state.results\n    pca_model, df_pca = plot_pca(\n        for_plot(state, params, r[\"df_all_scaled\"]),\n        hue_col=\"groups\",\n        label_col=\"samples\",\n        standard_scaler=False,\n        draw_ellipse=params.pca_ellipse,\n        draw_ellipse_all_data=False,\n        **plot_style(state, params),\n    )\n    importance = pca_importances(pca_model, show=True)\n    r.update(pca_model=pca_model, df_pca=df_pca, pca_importance=importance)\n    reporter.heading(t(params.lang, \"h_pca_top\"), 4)\n    reporter.table(importance.head(15))\n\n\ndef step_hca(state, params, reporter):\n    r, colors = state.results, plot_style(state, params)[\"colors\"]\n    plot_hca(\n        for_plot(state, params, r[\"df_all_scaled\"]), label_col=\"samples\", group_col=\"groups\",\n        standard_scaler=False, title=t(params.lang, \"hca_title_qc\", escape=False),\n        color_mode=\"group_labels\", branch_color=\"black\", colors=colors,\n    )\n    plot_hca(\n        for_plot(state, params, r[\"df_biological\"]), label_col=\"samples\", group_col=\"groups\",\n        standard_scaler=False, title=t(params.lang, \"hca_title_bio\", escape=False),\n        color_mode=\"threshold\", color_threshold=None, label_color_mode=\"group\", colors=colors,\n    )\n\n\ndef step_heatmap(state, params, reporter):\n    df_bio = for_plot(state, params, state.results[\"df_biological\"])\n    numeric = df_bio.drop(columns=METADATA_COLUMNS, errors=\"ignore\").select_dtypes(include=\"number\")\n    top_n = min(params.heatmap_top, numeric.shape[1])\n    top_features = numeric.var(axis=0, skipna=True).sort_values(ascending=False).head(top_n).index.tolist()\n    plot_heatmap_with_hca(\n        df_bio, features=top_features, group_col=\"groups\", label_col=\"samples\", standard_scaler=False,\n        method=\"ward\", metric=\"euclidean\", title=t(params.lang, \"heatmap_title\", escape=False, n=top_n),\n        xticklabels=False, yticklabels=True, colors=plot_style(state, params)[\"colors\"],\n    )\n\n\ndef step_plsda(state, params, reporter):\n    lang = params.lang\n    comparisons = pairwise(state, params)\n    n_perm = params.n_permutations\n    style = plot_style(state, params)\n    results = {}\n    for index, (group_a, group_b) in enumerate(comparisons, start=1):\n        name = f\"{group_a} vs {group_b}\"\n        _notify(state, t(lang, \"status_plsda\", escape=False, name=name, index=index, total=len(comparisons)))\n        df_pair = state.results[\"pairwise_datasets\"][(group_a, group_b)]\n        reporter.heading(t(lang, \"h_plsda\", name=name))\n\n        max_comp = params.plsda_max_components\n        acc, r2, q2 = acc_r2_q2_by_n_components(df_pair, group_col=\"groups\", standard_scaler=False,\n                                                max_components=max_comp)\n        performance = plot_acc_r2_q2_for_pls(acc, r2, q2, max_components=max_comp,\n                                             title=t(lang, \"plsda_perf_title\", escape=False, name=name))\n        _, scores = plot_pls(for_plot(state, params, df_pair), group_col=\"groups\", standard_scaler=False,\n                             n_components=2, title=t(lang, \"plsda_title\", escape=False, name=name), **style)\n        vip_df, _ = plsda_vip_table(df_pair, group_col=\"groups\", n_components=2,\n                                    vip_threshold=params.vip_threshold)\n\n        permutation = None\n        if n_perm > 0:\n            permutation = permutation_test_plsda(df_pair, group_col=\"groups\", standard_scaler=False,\n                                                 n_components=2, n_permutations=n_perm, random_state=42)\n            reporter.table(permutation, index=False)\n            p_floor = 1 / (n_perm + 1)\n            at_floor = [metric for metric in (\"r2\", \"q2\", \"acc\")\n                        if permutation[f\"pvalue_{metric}\"].iloc[0] <= p_floor + 1e-12]\n            if at_floor:\n                reporter.text(t(lang, \"perm_floor\", p=f\"{p_floor:.4f}\",\n                                metrics=\", \".join(m.upper() for m in at_floor), n=n_perm))\n            passed = (permutation[[\"pvalue_r2\", \"pvalue_q2\", \"pvalue_acc\"]] < 0.05).all(axis=1).iloc[0]\n            reporter.text(t(lang, \"perm_pass\") if passed else t(lang, \"perm_fail\"))\n\n        important = set(vip_df.loc[vip_df[\"plsda_important\"], \"variables\"])\n        reporter.text(t(lang, \"vip_count\", threshold=params.vip_threshold, n=len(important)))\n        reporter.table(vip_df, max_rows=20, index=False)\n        results[name] = {\"groups\": (group_a, group_b), \"df\": df_pair, \"performance\": performance,\n                         \"scores\": scores, \"vip\": vip_df, \"important_features\": important,\n                         \"permutation\": permutation}\n    state.results[\"pairwise_plsda_results\"] = results\n\n\ndef step_volcano(state, params, reporter):\n    lang = params.lang\n    comparisons = pairwise(state, params)\n    group_colors = plot_style(state, params)[\"colors\"] if params.volcano_group_colors else None\n    results = {}\n    for group_a, group_b in comparisons:\n        name = f\"{group_a} vs {group_b}\"\n        reporter.heading(t(lang, \"h_volcano\", name=name))\n        table = volcano_plot(\n            state.results[\"pairwise_datasets\"][(group_a, group_b)],\n            group_col=\"groups\",\n            groups=(group_a, group_b),\n            threshold=params.p_threshold,\n            fdr_correction=params.fdr,\n            fold_change_df=state.results[\"pairwise_rownorm_datasets\"][(group_a, group_b)],\n            equal_var=params.equal_var,\n            fold_change_threshold=math.log2(params.fc_threshold),  # FC linear -> corte em |log2 FC|\n            colors=(group_colors[group_a], group_colors[group_b], \"#B0B0B0\") if group_colors\n            else (\"blue\", \"red\", \"gray\"),\n            marker_size=params.marker_size,\n        )\n        important = set(table.loc[table[\"significant\"], \"variables\"])\n        reporter.text(t(lang, \"volcano_counts\", tested=len(table), significant=len(important)))\n        reporter.table(table, max_rows=20, index=False)\n        results[name] = {\"groups\": (group_a, group_b), \"results\": table, \"important_features\": important}\n    state.results[\"pairwise_volcano_results\"] = results\n\n\ndef step_venn(state, params, reporter):\n    lang = params.lang\n    plsda = state.results.get(\"pairwise_plsda_results\")\n    volcano = state.results.get(\"pairwise_volcano_results\")\n    if plsda is None or volcano is None:\n        reporter.text(t(lang, \"venn_needs\"))\n        return\n\n    shared, summary = {}, []\n    for name in plsda:\n        pls_features = plsda[name][\"important_features\"]\n        volcano_features = volcano[name][\"important_features\"]\n        shared[name] = pls_features & volcano_features\n        reporter.heading(t(lang, \"h_venn_pair\", name=name))\n        plot_venn2_sets(pls_features, volcano_features, \"PLS-DA\", \"Volcano\",\n                        t(lang, \"venn_pair_title\", escape=False, name=name))\n        summary.append({\"comparacao\": name, \"plsda_importantes\": len(pls_features),\n                        \"volcano_importantes\": len(volcano_features), \"em_ambos\": len(shared[name])})\n\n    summary = pd.DataFrame(summary)\n    reporter.heading(t(lang, \"h_venn_summary\"))\n    reporter.table(summary, index=False)\n\n    if len(shared) >= 2:\n        reporter.heading(t(lang, \"h_venn_across\"))\n        if len(shared) == 3:\n            plot_venn3_sets(shared, t(lang, \"venn3_title\", escape=False))\n        upset = plot_upset_sets(shared, t(lang, \"upset_title\", escape=False))\n        reporter.table(upset.drop(columns=\"features\", errors=\"ignore\"), index=False)\n    final = sorted(set.intersection(*shared.values())) if shared else []\n    reporter.text(t(lang, \"venn_final\", n=len(final)))\n    if final:\n        reporter.table(pd.DataFrame({\"variables\": final}), index=False)\n    state.results.update(pairwise_shared_features=shared, pairwise_overlap_summary=summary,\n                         final_shared_features=final)\n\n\ndef gnps_feature_table(state, params):\n    \"\"\"Uma linha por (comparacao, feature) com VIP e estatisticas do volcano, filtrada pelo modo escolhido.\"\"\"\n    plsda = state.results.get(\"pairwise_plsda_results\", {})\n    volcano = state.results.get(\"pairwise_volcano_results\", {})\n    mode = params.gnps_mode\n    if not plsda and not volcano:\n        raise ValueError(t(params.lang, \"err_gnps_needs\"))\n    if mode == \"both\" and not (plsda and volcano):\n        raise ValueError(t(params.lang, \"err_gnps_both\"))\n\n    tables = []\n    for name in dict.fromkeys([*plsda, *volcano]):\n        vip = plsda[name][\"vip\"][[\"variables\", \"vip\", \"plsda_important\"]] if name in plsda else None\n        vol = (volcano[name][\"results\"][[\"variables\", \"log2_fold_change\", \"p_value\", \"adjusted_p_value\",\n                                         \"significant\", \"maior_em\"]] if name in volcano else None)\n        table = vip.merge(vol, on=\"variables\", how=\"outer\") if vip is not None and vol is not None else (\n            vip if vip is not None else vol)\n        pls_flag = table.get(\"plsda_important\", pd.Series(False, index=table.index)).fillna(False).astype(bool)\n        vol_flag = table.get(\"significant\", pd.Series(False, index=table.index)).fillna(False).astype(bool)\n        keep = {\"both\": pls_flag & vol_flag, \"either\": pls_flag | vol_flag}.get(mode, pd.Series(True, index=table.index))\n        tables.append(table[keep].assign(comparacao=name))\n    return pd.concat(tables, ignore_index=True)\n\n\ndef step_gnps(state, params, reporter):\n    lang = params.lang\n    library_source, network_source = state.gnps_sources\n    if library_source is None and network_source is None:\n        reporter.text(t(lang, \"gnps_none\"))\n        return\n    library, network = read_gnps(library_source, network_source)\n    nodes, edges = network if network is not None else (None, None)\n    features = gnps_feature_table(state, params)\n    annotated = annotate_features(\n        features, library, nodes, edges,\n        min_cosine=params.gnps_min_cosine, min_shared_peaks=params.gnps_min_peaks,\n        min_edge_score=params.gnps_min_edge, mz_tol_ppm=params.gnps_ppm, rt_tol=params.gnps_rt,\n    )\n    annotated[\"nivel_evidencia\"] = pd.Categorical(annotated[\"nivel_evidencia\"], EVIDENCE_ORDER, ordered=True)\n    sort_cols = [\"comparacao\", \"nivel_evidencia\"] + ([\"vip\"] if \"vip\" in annotated.columns else [])\n    annotated = annotated.sort_values(sort_cols, ascending=[True, True] + [False] * (len(sort_cols) - 2))\n    annotated = annotated[[c for c in GNPS_COLUMNS if c in annotated.columns]].reset_index(drop=True)\n    annotated[\"nivel_evidencia\"] = annotated[\"nivel_evidencia\"].astype(str)\n\n    summary = (annotated.groupby([\"comparacao\", \"nivel_evidencia\"]).size().unstack(fill_value=0)\n               .reindex(columns=EVIDENCE_ORDER, fill_value=0))\n    summary.insert(0, \"features\", summary.sum(axis=1))\n    summary = summary.reset_index()\n    state.results.update(gnps_annotations=annotated, gnps_summary=summary)\n\n    links = annotated[\"ligacao\"].value_counts().to_dict()\n    reporter.text(t(lang, \"gnps_features\", mode=t(lang, f\"gnps_mode_{params.gnps_mode}\"),\n                    links=\", \".join(f\"{k}: {v}\" for k, v in links.items())))\n    if links.get(\"m/z + RT\"):\n        reporter.text(t(lang, \"gnps_id_mismatch\"))\n    reporter.heading(t(lang, \"h_gnps_summary\"), 4)\n    reporter.text(t(lang, \"gnps_summary_help\"))\n    reporter.table(summary, index=False)\n\n    shown = [\"variables\", \"vip\", \"log2_fold_change\", \"adjusted_p_value\", \"maior_em\", \"nivel_evidencia\",\n             \"anotacao\", \"aduto\", \"cosine\", \"npclassifier_class\", \"vizinhos_anotados\", \"anotados_na_familia\"]\n    for name, group in annotated.groupby(\"comparacao\", sort=False):\n        informative = group[group[\"nivel_evidencia\"].isin(EVIDENCE_ORDER[:3])]\n        reporter.heading(t(lang, \"h_gnps_comparison\", name=name, n=len(informative), total=len(group)))\n        if not informative.empty:\n            reporter.table(informative[[c for c in shown if c in informative.columns]], max_rows=50, index=False)\n    reporter.text(t(lang, \"gnps_full_table\"))\n\n\ndef step_summary(state, params, reporter):\n    lang, r = params.lang, state.results\n    pre_params = r.get(\"preprocessing_params\", {})\n    lines = [t(lang, \"sum_file\", name=state.source_name)]\n    if \"df_biological\" in r:\n        lines.append(t(lang, \"sum_samples\", n=len(r[\"df_biological\"]), groups=\", \".join(r.get(\"ana_groups\", []))))\n        lines.append(t(lang, \"sum_features\", n=r[\"df_all_scaled\"].shape[1] - len(METADATA_COLUMNS),\n                       missing=pre_params.get(\"features_removidas_filtro_ausentes\", 0),\n                       variance=pre_params.get(\"features_removidas_filtro_variancia\", 0)))\n    if \"pairwise_overlap_summary\" in r:\n        lines.append(t(lang, \"sum_shared\", n=len(r[\"final_shared_features\"])))\n    if \"gnps_summary\" in r:\n        annotated = r[\"gnps_annotations\"]\n        n_lib = annotated.loc[annotated[\"nivel_evidencia\"] == \"biblioteca\", \"variables\"].nunique()\n        lines.append(t(lang, \"sum_gnps_lib\", n=n_lib))\n    if r.get(\"erros\"):\n        lines.append(f\"<span style='color:#c0392b'>{t(lang, 'sum_errors', sections=', '.join(r['erros']))}</span>\")\n    reporter.text(\"<ul>\" + \"\".join(f\"<li>{line}</li>\" for line in lines) + \"</ul>\")\n    if \"pairwise_overlap_summary\" in r:\n        reporter.table(r[\"pairwise_overlap_summary\"], index=False)\n\n\nSTEP_FUNCTIONS = {\n    \"pre\": step_preprocessing,\n    \"pca\": step_pca,\n    \"hca\": step_hca,\n    \"heatmap\": step_heatmap,\n    \"plsda\": step_plsda,\n    \"volcano\": step_volcano,\n    \"venn\": step_venn,\n    \"gnps\": step_gnps,\n    \"summary\": step_summary,\n}\n\n\ndef run_step(state, params, key, reporter):\n    \"\"\"Roda uma etapa capturando as figuras. Erros vao para results['erros']. Devolve True se deu certo.\"\"\"\n    with capture_figures(reporter):\n        try:\n            STEP_FUNCTIONS[key](state, params, reporter)\n            return True\n        except Exception as exc:\n            section = t(params.lang, f\"tab_{key}\", escape=False)\n            reporter.error(f\"{t(params.lang, 'error_in', escape=False, section=section)} {exc}\",\n                           traceback.format_exc())\n            state.results.setdefault(\"erros\", {})[section] = str(exc)\n            return False\n\n\ndef run_pipeline(state, params, reporter_for, progress=None):\n    \"\"\"Roda todas as etapas em ordem; ``reporter_for(key)`` devolve o Reporter de cada aba.\"\"\"\n    state.results = {}\n    for index, key in enumerate(STEP_KEYS):\n        reporter = reporter_for(key)\n        if progress is not None:\n            progress(key, index)\n        if key in ANALYSIS_KEYS and key not in params.analyses:\n            reporter.text(t(params.lang, \"not_selected\"))\n            continue\n        if not run_step(state, params, key, reporter) and key == \"pre\":\n            break\n    return state.results\n\n\n# ----------------------------------------------------------------------------- exportacao\ndef _sheet_name(name, used):\n    base = re.sub(r\"[\\[\\]\\*\\?/\\\\:]\", \"_\", name)[:31]\n    candidate, index = base, 2\n    while candidate in used:\n        suffix = f\"_{index}\"\n        candidate, index = base[: 31 - len(suffix)] + suffix, index + 1\n    used.add(candidate)\n    return candidate\n\n\ndef export_excel(results, target):\n    \"\"\"Grava as tabelas dos resultados em um Excel (caminho ou buffer). Devolve ``target``.\"\"\"\n    used = set()\n    with pd.ExcelWriter(target, engine=\"openpyxl\") as writer:\n        def write(name, frame, index=False):\n            frame.to_excel(writer, sheet_name=_sheet_name(name, used), index=index)\n\n        write(\"preprocessamento\", results[\"preprocessing_report\"])\n        write(\"parametros\", pd.Series(results[\"preprocessing_params\"], name=\"valor\").to_frame(), index=True)\n        write(\"features\", results[\"feature_report\"])\n        if \"pca_importance\" in results:\n            write(\"pca_importancia\", results[\"pca_importance\"], index=True)\n        for name, item in results.get(\"pairwise_plsda_results\", {}).items():\n            write(f\"VIP {name}\", item[\"vip\"])\n        for name, item in results.get(\"pairwise_volcano_results\", {}).items():\n            write(f\"volcano {name}\", item[\"results\"])\n        if \"pairwise_overlap_summary\" in results:\n            write(\"resumo_intersecoes\", results[\"pairwise_overlap_summary\"])\n            write(\"features_em_comum\", pd.DataFrame({\"variables\": results[\"final_shared_features\"]}))\n        if \"gnps_annotations\" in results:\n            write(\"GNPS2 resumo\", results[\"gnps_summary\"])\n            write(\"GNPS2 anotacoes\", results[\"gnps_annotations\"])\n    return target\n\n\ndef export_zip(results, figures):\n    \"\"\"Zip com figuras/*.png, resultados.xlsx e dados_normalizados.csv.\"\"\"\n    buffer = io.BytesIO()\n    with zipfile.ZipFile(buffer, \"w\", zipfile.ZIP_DEFLATED) as archive:\n        for name, data in figures:\n            archive.writestr(f\"figuras/{name}\", data)\n        if \"preprocessing_report\" in results:\n            excel = io.BytesIO()\n            export_excel(results, excel)\n            archive.writestr(\"resultados.xlsx\", excel.getvalue())\n        if \"df_all_scaled\" in results:\n            archive.writestr(\"dados_normalizados.csv\", results[\"df_all_scaled\"].to_csv(index=False))\n    return buffer.getvalue()\n", "src/plsda.py": "from __future__ import annotations\n\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport pandas as pd\nfrom sklearn.cross_decomposition import PLSRegression\nfrom sklearn.metrics import accuracy_score, r2_score\nfrom sklearn.model_selection import LeaveOneOut\nfrom sklearn.preprocessing import StandardScaler\n\ntry:\n    from .pca import _group_style, annotate_points, draw_confidence_ellipse\nexcept ImportError:  # pragma: no cover - supports direct script-style imports\n    from pca import _group_style, annotate_points, draw_confidence_ellipse\n\n\ndef _metadata_columns(df: pd.DataFrame, non_numeric_columns: list[str] | None) -> list[str]:\n    if non_numeric_columns is None:\n        return []\n    return [col for col in non_numeric_columns if col in df.columns]\n\n\ndef _raw_X_y(df, group_col, non_numeric_columns):\n    \"\"\"Extract a cleaned numeric matrix and class labels for PLS-DA.\"\"\"\n    X_df = df.drop(columns=_metadata_columns(df, non_numeric_columns), errors=\"ignore\")\n    X_df = X_df.select_dtypes(include=[np.number]).replace([np.inf, -np.inf], np.nan)\n    X_df = X_df.dropna(axis=1, how=\"all\")\n    if X_df.empty:\n        raise ValueError(\"No numeric variables available for PLS-DA.\")\n    if X_df.isna().any().any():\n        X_df = X_df.fillna(X_df.median(numeric_only=True))\n    X_df = X_df.dropna(axis=1, how=\"any\")\n    keep = X_df.std(axis=0, ddof=1) > 0\n    X_df = X_df.loc[:, keep]\n    if X_df.shape[1] < 1:\n        raise ValueError(\"PLS-DA needs at least one non-constant numeric variable.\")\n\n    groups = list(pd.unique(df[group_col]))\n    y_class = np.array([groups.index(value) for value in df[group_col].to_numpy()])\n    if len(groups) < 2:\n        raise ValueError(\"PLS-DA needs at least two groups.\")\n    return X_df.to_numpy(dtype=float), y_class, groups, list(X_df.columns)\n\n\ndef _encode_y(y_class: np.ndarray, n_classes: int):\n    if n_classes == 2:\n        return y_class.astype(float)\n    Y = np.zeros((len(y_class), n_classes), dtype=float)\n    Y[np.arange(len(y_class)), y_class] = 1.0\n    return Y\n\n\ndef _max_components(X: np.ndarray, requested: int) -> int:\n    max_allowed = min(X.shape[0] - 1, X.shape[1])\n    if max_allowed < 1:\n        raise ValueError(\"Not enough samples/features for PLS-DA.\")\n    return min(requested, max_allowed)\n\n\ndef _fit_pls(X_train, y_train, n_classes, n_components, standard_scaler):\n    \"\"\"Fit one PLS model, optionally scaling X inside the training fold.\"\"\"\n    X_fit = X_train\n    scaler = None\n    if standard_scaler:\n        scaler = StandardScaler()\n        X_fit = scaler.fit_transform(X_train)\n\n    n_comp = _max_components(X_fit, n_components)\n    pls = PLSRegression(n_components=n_comp)\n    pls.fit(X_fit, _encode_y(y_train, n_classes))\n    return scaler, pls\n\n\ndef _predict_scores(scaler, pls, X):\n    X_pred = scaler.transform(X) if scaler is not None else X\n    return pls.predict(X_pred)\n\n\ndef _scores_to_class(scores, n_classes):\n    scores = np.asarray(scores)\n    if n_classes == 2:\n        return (scores.ravel() > 0.5).astype(int)\n    return np.argmax(scores, axis=1)\n\n\ndef _continuous_r2(y_true_class, y_pred_scores, n_classes):\n    y_true_encoded = _encode_y(np.asarray(y_true_class), n_classes)\n    y_pred_scores = np.asarray(y_pred_scores)\n    if n_classes == 2:\n        return r2_score(y_true_encoded, y_pred_scores.ravel())\n    return r2_score(y_true_encoded, y_pred_scores, multioutput=\"variance_weighted\")\n\n\ndef _loo_evaluate(X, y_class, n_classes, n_components, standard_scaler):\n    \"\"\"Evaluate the model with leave-one-out cross-validation.\"\"\"\n    loo = LeaveOneOut()\n    y_true = []\n    pred_scores = []\n\n    for train_idx, test_idx in loo.split(X):\n        scaler, pls = _fit_pls(\n            X[train_idx],\n            y_class[train_idx],\n            n_classes,\n            n_components=n_components,\n            standard_scaler=standard_scaler,\n        )\n        pred = _predict_scores(scaler, pls, X[test_idx])\n        y_true.append(y_class[test_idx][0])\n        pred_scores.append(np.asarray(pred).reshape(1, -1)[0])\n\n    y_true = np.asarray(y_true)\n    pred_scores = np.asarray(pred_scores)\n    pred_class = _scores_to_class(pred_scores, n_classes)\n    q2 = _continuous_r2(y_true, pred_scores, n_classes)\n    acc = accuracy_score(y_true, pred_class)\n    return q2, acc, y_true, pred_scores\n\n\ndef _x_variance_explained(X_scaled, pls):\n    X_centered = X_scaled - np.mean(X_scaled, axis=0)\n    ss_total = np.sum(X_centered**2)\n    if ss_total == 0:\n        return np.zeros(pls.x_scores_.shape[1])\n\n    explained = []\n    X_hat = np.zeros_like(X_centered)\n    prev_rss = np.sum((X_centered - X_hat) ** 2)\n    for i in range(pls.x_scores_.shape[1]):\n        t = pls.x_scores_[:, [i]]\n        p = pls.x_loadings_[:, [i]].T\n        X_hat += t @ p\n        rss = np.sum((X_centered - X_hat) ** 2)\n        explained.append(max((prev_rss - rss) / ss_total, 0.0))\n        prev_rss = rss\n    return np.asarray(explained)\n\n\ndef acc_r2_q2_by_n_components(\n    df,\n    group_col=\"groups\",\n    non_numeric_columns=[\"samples\", \"groups\"],\n    standard_scaler=True,\n    max_components=5,\n):\n    \"\"\"Compute accuracy, R2 and Q2 across a range of component counts.\"\"\"\n    X, y_class, groups, _ = _raw_X_y(df, group_col, non_numeric_columns)\n    n_classes = len(groups)\n\n    r2_values = []\n    q2_values = []\n    acc_values = []\n    for n in range(1, max_components + 1):\n        scaler, pls = _fit_pls(X, y_class, n_classes, n_components=n, standard_scaler=standard_scaler)\n        pred_full = _predict_scores(scaler, pls, X)\n        r2_values.append(_continuous_r2(y_class, pred_full, n_classes))\n\n        q2, acc, _, _ = _loo_evaluate(\n            X,\n            y_class,\n            n_classes,\n            n_components=n,\n            standard_scaler=standard_scaler,\n        )\n        q2_values.append(q2)\n        acc_values.append(acc)\n\n    return np.array(acc_values), np.array(r2_values), np.array(q2_values)\n\n\ndef plot_acc_r2_q2_for_pls(acc, r2, q2, max_components=5, figsize=(7, 5), save_name=None, show=True, title=None, **kwargs):\n    \"\"\"Plot the performance summary returned by ``acc_r2_q2_by_n_components``.\"\"\"\n    acc = acc[:max_components]\n    r2 = r2[:max_components]\n    q2 = q2[:max_components]\n    df = pd.DataFrame({\"Accuracy\": acc, \"R2\": r2, \"Q2\": q2})\n\n    fig, ax = plt.subplots(1, figsize=figsize)\n    df.plot.bar(ax=ax, color=[\"#add8e6\", \"#ffe4e1\", \"#e0ffff\"])\n\n    handles, labels = ax.get_legend_handles_labels()\n    new_handles = []\n    for h in handles:\n        patch = h.patches[0]\n        patch.set_edgecolor(\"black\")\n        patch.set_linewidth(1)\n        new_handles.append(patch)\n    leg = ax.legend(handles=new_handles, labels=labels, frameon=True, bbox_to_anchor=(1.05, 1))\n    leg.get_frame().set_edgecolor(\"black\")\n    leg.get_frame().set_linewidth(1)\n    leg.get_frame().set_facecolor(\"white\")\n\n    for container in ax.containers:\n        for bar in container:\n            bar.set_edgecolor(\"black\")\n            bar.set_linewidth(1)\n\n    ax.set_xticklabels([str(i + 1) for i in range(len(acc))])\n    ax.grid(axis=\"y\", linestyle=\"--\", linewidth=0.7, alpha=0.7)\n    ax.set_axisbelow(True)\n    ax.set_xticklabels(ax.get_xticklabels(), rotation=0, fontweight=\"bold\")\n    for label in ax.get_yticklabels():\n        label.set_fontweight(\"bold\")\n\n    ax.set_title(title, weight=\"bold\", fontsize=14)\n    ax.set_ylabel(\"Performance\", weight=\"bold\")\n\n    if save_name:\n        fig.savefig(save_name, dpi=600, bbox_inches=\"tight\", transparent=True)\n    elif show:\n        plt.show()\n    return df\n\n\ndef plot_pls(\n    df,\n    group_col=\"groups\",\n    non_numeric_columns=[\"samples\", \"groups\"],\n    standard_scaler=True,\n    n_components=5,\n    component1=0,\n    component2=1,\n    colors=None,\n    save_name=None,\n    show=True,\n    title=\"Scores Plot (PLS-DA)\",\n    ellipse_confidence=0.95,\n    symbols=None,\n    label_col=\"samples\",\n    show_labels=False,\n    marker_size=None,\n    alpha=0.7,\n):\n    \"\"\"Plot a 2D PLS-DA score plot.\n\n    ``colors`` and ``symbols`` accept a list (by group order) or a dict (group -> value).\n    \"\"\"\n    X, y_class, groups, _ = _raw_X_y(df, group_col, non_numeric_columns)\n    n_classes = len(groups)\n    scaler, pls = _fit_pls(X, y_class, n_classes, n_components=n_components, standard_scaler=standard_scaler)\n    X_used = scaler.transform(X) if scaler is not None else X\n\n    scores = pls.x_scores_\n    if max(component1, component2) >= scores.shape[1]:\n        raise ValueError(\"Requested component is not available in the fitted PLS-DA model.\")\n\n    explained = _x_variance_explained(X_used, pls)\n    fig, ax = plt.subplots(1, figsize=(7, 5))\n\n    for i, group in enumerate(groups):\n        idx = np.where(y_class == i)[0]\n        color = _group_style(colors, i, group)\n        marker = _group_style(symbols, i, group, default=\"o\")\n\n        scatter = ax.scatter(\n            scores[idx, component1], scores[idx, component2], color=color, label=group, edgecolors=color,\n            alpha=alpha, marker=marker, s=marker_size,\n        )\n        if len(idx) > 2:\n            draw_confidence_ellipse(\n                np.column_stack([scores[idx, component1], scores[idx, component2]]),\n                ax,\n                color=scatter.get_facecolor(),\n                confidence=ellipse_confidence,\n                linestyle=\"--\",\n                lw=1,\n            )\n\n    if show_labels and label_col in df.columns:\n        annotate_points(ax, scores[:, component1], scores[:, component2], df[label_col].to_numpy())\n\n    ax.legend()\n    ax.set_xlabel(f\"Component {component1 + 1} ({explained[component1] * 100:.2f}% X variance)\", weight=\"bold\", fontsize=12)\n    ax.set_ylabel(f\"Component {component2 + 1} ({explained[component2] * 100:.2f}% X variance)\", weight=\"bold\", fontsize=12)\n    ax.set_title(title, weight=\"bold\", fontsize=14)\n\n    ax.tick_params(axis=\"x\", labelsize=11)\n    ax.tick_params(axis=\"y\", labelsize=11)\n    for label in ax.get_xticklabels() + ax.get_yticklabels():\n        label.set_fontweight(\"bold\")\n\n    if save_name:\n        fig.savefig(save_name, dpi=600, bbox_inches=\"tight\", transparent=True)\n    elif show:\n        plt.show()\n\n    return pls, scores\n\n\ndef plot_pls_3D(\n    df,\n    group_col=\"groups\",\n    non_numeric_columns=[\"samples\", \"groups\"],\n    standard_scaler=True,\n    n_components=5,\n    component1=0,\n    component2=1,\n    component3=2,\n    colors=None,\n    save_name=None,\n    show=True,\n):\n    \"\"\"Plot a 3D PLS-DA score plot with Plotly.\"\"\"\n    import plotly.express as px  # opcional: so este grafico usa plotly\n\n    X, y_class, groups, _ = _raw_X_y(df, group_col, non_numeric_columns)\n    n_classes = len(groups)\n    scaler, pls = _fit_pls(X, y_class, n_classes, n_components=n_components, standard_scaler=standard_scaler)\n    scores = pls.x_scores_\n    if max(component1, component2, component3) >= scores.shape[1]:\n        raise ValueError(\"Requested component is not available in the fitted PLS-DA model.\")\n\n    metadata_cols = [col for col in non_numeric_columns if col in df.columns]\n    df_pls = df[metadata_cols].copy()\n    for i in range(scores.shape[1]):\n        df_pls[f\"component {i + 1}\"] = scores[:, i]\n\n    fig = px.scatter_3d(\n        df_pls,\n        x=f\"component {component1 + 1}\",\n        y=f\"component {component2 + 1}\",\n        z=f\"component {component3 + 1}\",\n        color=group_col,\n        color_discrete_sequence=colors if isinstance(colors, list) else None,\n        color_discrete_map=colors if isinstance(colors, dict) else None,\n        title=f\"PLS-DA - Componentes {component1 + 1}, {component2 + 1} e {component3 + 1}\",\n        opacity=0.8,\n    )\n\n    if save_name:\n        fig.write_html(save_name)\n    if show:\n        fig.show()\n    return fig\n\n\ndef plsda_vip_table(\n    df,\n    group_col=\"groups\",\n    non_numeric_columns=[\"samples\", \"groups\"],\n    n_components=2,\n    vip_threshold=1.0,\n    standard_scaler=False,\n):\n    \"\"\"Compute PLS-DA VIP (Variable Importance in Projection) scores for two groups.\"\"\"\n    X, y_class, groups, columns = _raw_X_y(df, group_col, non_numeric_columns)\n    if len(groups) != 2:\n        raise ValueError(\"plsda_vip_table expects exactly two groups.\")\n\n    scaler, pls = _fit_pls(X, y_class, n_classes=2, n_components=n_components, standard_scaler=standard_scaler)\n    n_comp = pls.x_scores_.shape[1]\n\n    weights = pls.x_weights_[:, :n_comp]\n    scores = pls.x_scores_[:, :n_comp]\n    y_loadings = np.asarray(pls.y_loadings_).reshape(-1)[:n_comp]\n    explained_y = np.sum(scores**2, axis=0) * (y_loadings**2)\n\n    n_features = len(columns)\n    if np.isclose(explained_y.sum(), 0):\n        vip = np.full(n_features, np.nan)\n    else:\n        vip = np.sqrt(n_features * ((weights**2) @ explained_y) / explained_y.sum())\n\n    coef = np.asarray(pls.coef_).reshape(-1)\n    if coef.size != n_features:\n        coef = np.resize(coef, n_features)\n\n    vip_df = pd.DataFrame(\n        {\n            \"variables\": columns,\n            \"vip\": vip,\n            \"abs_coef\": np.abs(coef),\n            \"plsda_important\": vip >= vip_threshold,\n        }\n    ).sort_values([\"plsda_important\", \"vip\", \"abs_coef\"], ascending=[False, False, False])\n\n    return vip_df.reset_index(drop=True), pls\n\n\ndef permutation_test_plsda(\n    df,\n    group_col=\"groups\",\n    non_numeric_columns=None,\n    n_permutations=1000,\n    n_components=2,\n    standard_scaler=True,\n    save_name=None,\n    show=True,\n    random_state=42,\n    title=None,\n):\n    \"\"\"Permutation test for PLS-DA using leakage-free LOO-CV metrics.\"\"\"\n    if non_numeric_columns is None:\n        non_numeric_columns = [\"samples\", \"groups\"]\n\n    X, y_class, groups, _ = _raw_X_y(df, group_col, non_numeric_columns)\n    n_classes = len(groups)\n\n    scaler, pls = _fit_pls(X, y_class, n_classes, n_components=n_components, standard_scaler=standard_scaler)\n    obs_pred_full = _predict_scores(scaler, pls, X)\n    obs_r2 = _continuous_r2(y_class, obs_pred_full, n_classes)\n    obs_q2, obs_acc, _, _ = _loo_evaluate(\n        X,\n        y_class,\n        n_classes,\n        n_components=n_components,\n        standard_scaler=standard_scaler,\n    )\n\n    rng = np.random.default_rng(random_state)\n    null_r2, null_q2, null_acc = [], [], []\n    for _ in range(n_permutations):\n        y_perm = rng.permutation(y_class)\n        scaler_p, pls_p = _fit_pls(X, y_perm, n_classes, n_components=n_components, standard_scaler=standard_scaler)\n        pred_full_p = _predict_scores(scaler_p, pls_p, X)\n        null_r2.append(_continuous_r2(y_perm, pred_full_p, n_classes))\n        q2_p, acc_p, _, _ = _loo_evaluate(\n            X,\n            y_perm,\n            n_classes,\n            n_components=n_components,\n            standard_scaler=standard_scaler,\n        )\n        null_q2.append(q2_p)\n        null_acc.append(acc_p)\n\n    null_r2 = np.array(null_r2)\n    null_q2 = np.array(null_q2)\n    null_acc = np.array(null_acc)\n\n    pval_r2 = (np.sum(null_r2 >= obs_r2) + 1) / (n_permutations + 1)\n    pval_q2 = (np.sum(null_q2 >= obs_q2) + 1) / (n_permutations + 1)\n    pval_acc = (np.sum(null_acc >= obs_acc) + 1) / (n_permutations + 1)\n\n    fig, axes = plt.subplots(1, 3, figsize=(14, 4))\n    for ax, null, obs, pval, label in zip(\n        axes,\n        [null_r2, null_q2, null_acc],\n        [obs_r2, obs_q2, obs_acc],\n        [pval_r2, pval_q2, pval_acc],\n        [\"R\u00b2\", \"Q\u00b2 (LOO-CV)\", \"Accuracy (LOO-CV)\"],\n    ):\n        ax.hist(null, bins=40, color=\"steelblue\", edgecolor=\"white\", alpha=0.8)\n        ax.axvline(obs, color=\"red\", linewidth=2, linestyle=\"--\", label=f\"Observed: {obs:.3f}\")\n        ax.set_title(f\"{label}\\np-value = {pval:.4f}\", fontweight=\"bold\", fontsize=11)\n        ax.set_xlabel(label, fontweight=\"bold\")\n        ax.set_ylabel(\"Frequency\", fontweight=\"bold\")\n        ax.legend(fontsize=9)\n\n    fig.suptitle(title or f\"PLS-DA Permutation Test (n = {n_permutations} permutations)\", fontsize=13, fontweight=\"bold\")\n    plt.tight_layout()\n\n    if save_name:\n        fig.savefig(save_name, dpi=300, bbox_inches=\"tight\", transparent=True)\n    if show:\n        plt.show()\n\n    return pd.DataFrame(\n        [\n            {\n                \"observed_r2\": obs_r2,\n                \"observed_q2\": obs_q2,\n                \"observed_acc\": obs_acc,\n                \"pvalue_r2\": pval_r2,\n                \"pvalue_q2\": pval_q2,\n                \"pvalue_acc\": pval_acc,\n                \"n_permutations\": n_permutations,\n                \"n_classes\": n_classes,\n            }\n        ]\n    )\n", "src/preprocessing.py": "from __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\n\nfrom .normalization import (\n    blank_feature_filter,\n    clean_data,\n    empirical_filter_cutoff,\n    find_blank_samples,\n    find_qc_samples,\n    impute_missing,\n    perform_feature_filter,\n    qc_rsd_filter,\n    remove_missing_by_percent,\n    row_normalize,\n    scale,\n    transform,\n)\n\nPREPROCESSING_STAGES = (\n    \"checagem_inicial\",\n    \"filtro_ausentes\",\n    \"imputacao\",\n    \"filtro_qc_rsd\",\n    \"blank_subtraction\",\n    \"filtro_variancia\",\n    \"filtro_abundancia\",\n    \"normalizacao\",\n)\n\n\ndef _as_optional_list(values, parameter_name):\n    \"\"\"Validate an optional list-like parameter and reject duplicate entries.\"\"\"\n    if values is None:\n        return None\n    values = list(values)\n    duplicates = [value for index, value in enumerate(values) if value in values[:index]]\n    if duplicates:\n        raise ValueError(f\"{parameter_name} contains duplicate values: {duplicates}\")\n    return values\n\n\ndef load_metaboanalyst_csv(csv_path, group_row=None):\n    \"\"\"Read a MetaboAnalyst-style CSV: features as rows, groups in an ATTRIBUTE_* row.\"\"\"\n    raw = pd.read_csv(csv_path, index_col=0)\n    raw.index = raw.index.astype(str)\n\n    if group_row is None:\n        candidates = [row for row in (\"ATTRIBUTE_group\", \"ATTRIBUTE_type\", \"ATTRIBUTE_time\") if row in raw.index]\n        if len(candidates) != 1:\n            raise ValueError(\n                \"Provide group_row: there must be exactly one of \"\n                \"ATTRIBUTE_group, ATTRIBUTE_type or ATTRIBUTE_time in the input.\"\n            )\n        group_row = candidates[0]\n    if group_row not in raw.index:\n        raise ValueError(f\"Group row {group_row!r} was not found in the input file.\")\n\n    sample_groups = raw.loc[group_row].astype(\"string\").str.strip().str.lower()\n    if sample_groups.isna().any() or sample_groups.eq(\"\").any():\n        raise ValueError(\"Some samples have no group in the selected metadata row.\")\n    metadata_rows = raw.index.to_series().str.startswith(\"ATTRIBUTE_\")\n    intensity = raw.loc[~metadata_rows].apply(pd.to_numeric, errors=\"coerce\")\n\n    df = intensity.T.copy()\n    df.insert(0, \"samples\", df.index.astype(str))\n    df.insert(1, \"groups\", sample_groups.reindex(df.index).astype(str).str.lower().to_numpy())\n    df = df.reset_index(drop=True)\n\n    return df, raw\n\n\ndef select_metabolomics_rows(\n    df,\n    *,\n    groups_to_include=None,\n    groups_to_exclude=None,\n    samples_to_include=None,\n    samples_to_exclude=None,\n    group_col=\"groups\",\n    sample_col=\"samples\",\n):\n    \"\"\"Filter a samples-as-rows table by group and/or sample name.\"\"\"\n    selected = df.copy()\n\n    groups_to_include = _as_optional_list(groups_to_include, \"groups_to_include\")\n    groups_to_exclude = _as_optional_list(groups_to_exclude or [], \"groups_to_exclude\")\n    samples_to_include = _as_optional_list(samples_to_include, \"samples_to_include\")\n    samples_to_exclude = _as_optional_list(samples_to_exclude or [], \"samples_to_exclude\")\n\n    available_groups = list(pd.unique(selected[group_col].dropna())) if group_col in selected.columns else []\n    available_samples = selected[sample_col].astype(str).tolist() if sample_col in selected.columns else []\n\n    if groups_to_include is not None:\n        missing_groups = [group for group in groups_to_include if group not in available_groups]\n        if missing_groups:\n            raise ValueError(f\"Requested groups not found: {missing_groups}. Available: {available_groups}\")\n        selected = selected[selected[group_col].isin(groups_to_include)]\n\n    if groups_to_exclude:\n        selected = selected[~selected[group_col].isin(groups_to_exclude)]\n\n    if samples_to_include is not None:\n        missing_samples = [sample for sample in samples_to_include if sample not in available_samples]\n        if missing_samples:\n            raise ValueError(f\"Requested samples not found: {missing_samples}\")\n        selected = selected[selected[sample_col].astype(str).isin(samples_to_include)]\n\n    if samples_to_exclude:\n        selected = selected[~selected[sample_col].astype(str).isin(samples_to_exclude)]\n\n    if selected.empty:\n        raise ValueError(\"The group/sample selection resulted in an empty table.\")\n\n    return selected.reset_index(drop=True)\n\n\ndef _numeric_feature_matrix(df, metadata_columns=(\"samples\", \"groups\")):\n    metadata = [col for col in metadata_columns if col in df.columns]\n    X = df.drop(columns=metadata, errors=\"ignore\").select_dtypes(include=[np.number]).copy()\n    X = X.replace([np.inf, -np.inf], np.nan)\n    if X.empty:\n        raise ValueError(\"No numeric feature was found.\")\n    return X\n\n\ndef _require_features(X, stage):\n    if X.shape[1] == 0:\n        raise ValueError(f\"All features were removed at step: {stage}.\")\n\n\ndef _with_metadata(meta, X):\n    return pd.concat([meta.loc[X.index].reset_index(drop=True), X.reset_index(drop=True)], axis=1)\n\n\ndef preprocess_like_metaboanalyst(\n    df,\n    *,\n    metadata_columns=(\"samples\", \"groups\"),\n    treat_zero_as_missing=True,\n    missing_threshold=0.50,\n    missing_group_wise=False,\n    impute_method=\"lod\",\n    impute_group_wise=False,\n    qc_filter=False,\n    qc_rsd_threshold=0.20,\n    blank_subtraction=False,\n    blank_threshold=10.0,\n    variance_filter=\"iqr\",\n    variance_cutoff=None,\n    abundance_filter=\"mean\",\n    abundance_cutoff=0,\n    row_norm=\"none\",\n    row_norm_ref=None,\n    sample_factors=None,\n    trans_norm=\"Log2Norm\",\n    scale_norm=\"AutoNorm\",\n    random_state=0,\n):\n    \"\"\"Pre-processamento na ordem do MetaboAnalyst.\n\n    checagem inicial -> filtro de ausentes -> imputacao -> filtro QC-RSD -> blank subtraction\n    -> filtro de variancia -> filtro de abundancia -> normalizacao por amostra -> transformacao\n    -> escalonamento. ``variance_cutoff=None`` usa o corte automatico do MetaboAnalyst.\n\n    Devolve um dicionario com ``df_prenorm`` (apos a filtragem), ``df_rownorm`` (apos a\n    normalizacao por amostra; usado no fold change), ``df_norm`` (final), ``report``,\n    ``feature_report``, ``params`` e ``warnings``.\n    \"\"\"\n    if not 0 <= missing_threshold <= 1:\n        raise ValueError(\"missing_threshold must be between 0 and 1.\")\n    if variance_cutoff is not None and not 0 <= variance_cutoff < 100:\n        raise ValueError(\"variance_cutoff must be in [0, 100).\")\n    if not 0 <= abundance_cutoff < 100:\n        raise ValueError(\"abundance_cutoff must be in [0, 100).\")\n\n    metadata = [col for col in metadata_columns if col in df.columns]\n    if \"samples\" not in metadata or \"groups\" not in metadata:\n        raise ValueError(\"The table needs 'samples' and 'groups' columns.\")\n    meta = df[metadata].copy()\n    meta.index = meta[\"samples\"].astype(str)\n    duplicated = meta.index[meta.index.duplicated()].tolist()\n    if duplicated:\n        raise ValueError(f\"Duplicate sample names: {duplicated}\")\n    X_raw = _numeric_feature_matrix(df, metadata_columns=metadata_columns)\n    X_raw.index = meta.index\n    warnings = []\n    removed_at = {}\n\n    def record(stage, before, after):\n        for feature in before.columns.difference(after.columns):\n            removed_at.setdefault(feature, stage)\n\n    # 0. SanityCheckData: features constantes ou sem valor\n    X0 = X_raw.loc[:, ~(X_raw.var(axis=0, skipna=True).fillna(0) == 0)]\n    record(\"checagem_inicial\", X_raw, X0)\n    _require_features(X0, \"checagem_inicial\")\n\n    # 1-2. Valores ausentes\n    def with_zero_rule(X):\n        return X.mask(X == 0) if treat_zero_as_missing else X.copy()\n\n    X1 = with_zero_rule(X0)\n    groups = meta[\"groups\"].to_numpy()\n    X2, _ = remove_missing_by_percent(X1, missing_threshold, groups if missing_group_wise else None)\n    record(\"filtro_ausentes\", X1, X2)\n    _require_features(X2, \"filtro_ausentes\")\n\n    # 3. Imputacao\n    n_missing = int(X2.isna().sum().sum())\n    X3 = impute_missing(X2, impute_method, groups=groups, group_wise=impute_group_wise)\n    record(\"imputacao\", X2, X3)\n    _require_features(X3, \"imputacao\")\n    if X3.isna().any().any():\n        raise ValueError(\"Missing values remain after imputation; choose another imputation method.\")\n\n    # 4. Filtragem (FilterVariable)\n    qc_rsd = pd.Series(np.nan, index=X3.columns)\n    X4 = X3\n    if qc_filter:\n        X4, qc_rsd = qc_rsd_filter(X3, find_qc_samples(meta[\"groups\"], meta[\"samples\"]), qc_rsd_threshold)\n    record(\"filtro_qc_rsd\", X3, X4)\n    _require_features(X4, \"filtro_qc_rsd\")\n\n    X5, blank_threshold_applied = X4, None\n    if blank_subtraction:\n        X5, blank_threshold_applied = blank_feature_filter(\n            X4, find_blank_samples(meta[\"groups\"], meta[\"samples\"]), blank_threshold\n        )\n        meta = meta.loc[X5.index]\n        groups = meta[\"groups\"].to_numpy()\n    record(\"blank_subtraction\", X4, X5)\n    _require_features(X5, \"blank_subtraction\")\n\n    if variance_filter == \"none\":\n        cutoff = 0\n    elif variance_cutoff is None:\n        cutoff = empirical_filter_cutoff(X5.shape[1])\n    else:\n        cutoff = variance_cutoff\n    X6, variance_values = perform_feature_filter(X5, variance_filter, cutoff, random_state=random_state)\n    record(\"filtro_variancia\", X5, X6)\n    _require_features(X6, \"filtro_variancia\")\n\n    if abundance_cutoff > 0:\n        X7, abundance_values = perform_feature_filter(X6, abundance_filter, abundance_cutoff,\n                                                      random_state=random_state)\n    else:\n        X7, abundance_values = X6, pd.Series(np.nan, index=X6.columns)\n    record(\"filtro_abundancia\", X6, X7)\n    _require_features(X7, \"filtro_abundancia\")\n\n    # 5-8. Normalization\n    X_row, row_warnings = row_normalize(X7, row_norm, ref=row_norm_ref, groups=groups,\n                                        sample_factors=sample_factors)\n    warnings.extend(row_warnings)\n    if trans_norm in (\"LogNorm\", \"Log2Norm\", \"SrNorm\") and (X_row < 0).any().any():\n        warnings.append(\"Ha valores negativos antes da transformacao; o log/raiz generalizado os comprime.\")\n    X_rownorm = clean_data(X_row, remove_na=True, remove_neg=True, remove_const=True)\n    X_norm = clean_data(scale(transform(X_row, trans_norm), scale_norm),\n                        remove_na=True, remove_neg=False, remove_const=True)\n    record(\"normalizacao\", X7, X_norm)\n    _require_features(X_norm, \"normalizacao\")\n\n    stage_frames = [\n        (\"entrada\", with_zero_rule(X_raw)),\n        (\"checagem_inicial\", X1),\n        (\"filtro_ausentes\", X2),\n        (\"imputacao\", X3),\n        (\"filtro_qc_rsd\", X4),\n        (\"blank_subtraction\", X5),\n        (\"filtro_variancia\", X6),\n        (\"filtro_abundancia\", X7),\n        (\"normalizacao\", X_norm),\n    ]\n    report = pd.DataFrame([\n        {\"etapa\": name, \"amostras\": X.shape[0], \"features\": X.shape[1],\n         \"valores_ausentes\": int(X.isna().sum().sum())}\n        for name, X in stage_frames\n    ])\n\n    features = X_raw.columns\n    feature_report = pd.DataFrame({\n        \"feature\": features,\n        \"missing_rate\": with_zero_rule(X_raw).isna().mean(axis=0).to_numpy(),\n        \"qc_rsd\": qc_rsd.reindex(features).to_numpy(),\n        \"valor_filtro_variancia\": variance_values.reindex(features).to_numpy(),\n        \"valor_filtro_abundancia\": abundance_values.reindex(features).to_numpy(),\n        \"removida_em\": [removed_at.get(feature, \"\") for feature in features],\n    })\n    feature_report[\"used_after_preprocessing\"] = feature_report[\"feature\"].isin(X_norm.columns)\n\n    params = {\n        \"treat_zero_as_missing\": treat_zero_as_missing,\n        \"missing_threshold\": missing_threshold,\n        \"missing_group_wise\": missing_group_wise,\n        \"impute_method\": impute_method,\n        \"impute_group_wise\": impute_group_wise,\n        \"valores_imputados\": 0 if impute_method == \"exclude\" else n_missing,\n        \"qc_filter\": qc_filter,\n        \"qc_rsd_threshold\": qc_rsd_threshold,\n        \"blank_subtraction\": blank_subtraction,\n        \"blank_threshold\": blank_threshold,\n        \"blank_threshold_applied\": blank_threshold_applied,\n        \"variance_filter\": variance_filter,\n        \"variance_cutoff\": \"auto\" if variance_cutoff is None else variance_cutoff,\n        \"variance_cutoff_applied\": cutoff,\n        \"abundance_filter\": abundance_filter,\n        \"abundance_cutoff\": abundance_cutoff,\n        \"row_norm\": row_norm,\n        \"row_norm_ref\": row_norm_ref,\n        \"trans_norm\": trans_norm,\n        \"scale_norm\": scale_norm,\n        \"random_state\": random_state,\n    }\n    for stage in PREPROCESSING_STAGES:\n        params[f\"features_removidas_{stage}\"] = sum(1 for value in removed_at.values() if value == stage)\n\n    return {\n        \"df_prenorm\": _with_metadata(meta, X7),\n        \"df_rownorm\": _with_metadata(meta, X_rownorm),\n        \"df_norm\": _with_metadata(meta, X_norm),\n        \"report\": report,\n        \"feature_report\": feature_report,\n        \"params\": params,\n        \"warnings\": warnings,\n    }\n\n\ndef prepare_pairwise_analysis(\n    df,\n    group_col=\"groups\",\n    groups_to_include=None,\n    groups_to_exclude=None,\n    comparisons_to_run=None,\n    min_samples_per_group=2,\n):\n    \"\"\"Resolve which groups/pairwise comparisons to run and split the data per pair.\"\"\"\n    if group_col not in df.columns:\n        raise ValueError(f\"Group column {group_col!r} does not exist in the table.\")\n\n    available_groups = list(pd.unique(df[group_col].dropna()))\n    if not available_groups:\n        raise ValueError(\"No group was found in the table.\")\n\n    included = _as_optional_list(groups_to_include, \"groups_to_include\")\n    excluded = _as_optional_list(groups_to_exclude or [], \"groups_to_exclude\")\n\n    if included is not None:\n        missing_included = [group for group in included if group not in available_groups]\n        if missing_included:\n            raise ValueError(f\"Requested groups not found: {missing_included}. Available: {available_groups}\")\n        overlap = [group for group in included if group in excluded]\n        if overlap:\n            raise ValueError(f\"The same groups cannot be both included and excluded: {overlap}\")\n        selected_groups = included\n    else:\n        selected_groups = [group for group in available_groups if group not in excluded]\n\n    ignored_exclusions = [group for group in excluded if group not in available_groups]\n    if ignored_exclusions:\n        print(\"Groups in groups_to_exclude that are absent (ignored):\", ignored_exclusions)\n\n    if len(selected_groups) < 2:\n        raise ValueError(f\"At least two selected groups are required. Selected: {selected_groups}\")\n\n    from itertools import combinations\n\n    if comparisons_to_run is None:\n        pairwise_comparisons = list(combinations(selected_groups, 2))\n    else:\n        pairwise_comparisons = []\n        seen_pairs = set()\n        for comparison in comparisons_to_run:\n            if not isinstance(comparison, (list, tuple)) or len(comparison) != 2:\n                raise ValueError(f\"Invalid comparison {comparison!r}; use pairs like (group_a, group_b).\")\n            group_a, group_b = comparison\n            if group_a == group_b:\n                raise ValueError(f\"A comparison cannot use the same group twice: {comparison!r}\")\n            missing_pair_groups = [group for group in (group_a, group_b) if group not in available_groups]\n            if missing_pair_groups:\n                raise ValueError(f\"Comparison groups not found: {missing_pair_groups}. Available: {available_groups}\")\n            unavailable_pair_groups = [group for group in (group_a, group_b) if group not in selected_groups]\n            if unavailable_pair_groups:\n                raise ValueError(f\"Comparison groups are not selected or were excluded: {unavailable_pair_groups}\")\n            pair_key = frozenset((group_a, group_b))\n            if pair_key in seen_pairs:\n                raise ValueError(f\"Duplicate or reversed comparison: {comparison!r}\")\n            seen_pairs.add(pair_key)\n            pairwise_comparisons.append((group_a, group_b))\n\n        if not pairwise_comparisons:\n            raise ValueError(\"comparisons_to_run cannot be an empty list.\")\n\n    df_pairwise = df[df[group_col].isin(selected_groups)].copy().reset_index(drop=True)\n    group_counts = df_pairwise[group_col].value_counts().reindex(selected_groups, fill_value=0)\n\n    for group_a, group_b in pairwise_comparisons:\n        insufficient = {\n            group: int(group_counts[group])\n            for group in (group_a, group_b)\n            if group_counts[group] < min_samples_per_group\n        }\n        if insufficient:\n            raise ValueError(\n                f\"Comparison {(group_a, group_b)!r} requires at least \"\n                f\"{min_samples_per_group} samples per group. Insufficient counts: {insufficient}\"\n            )\n\n    pairwise_datasets = {\n        (group_a, group_b): df_pairwise[df_pairwise[group_col].isin([group_a, group_b])].reset_index(drop=True)\n        for group_a, group_b in pairwise_comparisons\n    }\n\n    print(\"Available groups:\", available_groups)\n    print(\"Selected groups:\", selected_groups)\n    print(\"Sample count per group:\")\n    print(group_counts.to_string())\n    print(\"Number of pairwise comparisons:\", len(pairwise_comparisons))\n    print(\"Comparisons (order defines the fold-change sign):\", pairwise_comparisons)\n\n    return df_pairwise, selected_groups, pairwise_comparisons, pairwise_datasets\n", "src/venn.py": "from __future__ import annotations\n\nimport matplotlib.pyplot as plt\nfrom matplotlib.patches import Circle\n\n\ndef plot_venn2_sets(set_a, set_b, label_a, label_b, title, save_name=None, show=True):\n    \"\"\"Draw a proportion-free two-set Venn diagram with the set sizes annotated.\"\"\"\n    only_a = set_a - set_b\n    only_b = set_b - set_a\n    both = set_a & set_b\n\n    fig, ax = plt.subpl
