ots(figsize=(6, 4.5))\n    ax.add_patch(Circle((0.42, 0.5), 0.28, color=\"#4C78A8\", alpha=0.35, lw=2, ec=\"#4C78A8\"))\n    ax.add_patch(Circle((0.58, 0.5), 0.28, color=\"#F53918\", alpha=0.35, lw=2, ec=\"#F53918\"))\n\n    ax.text(0.31, 0.5, str(len(only_a)), ha=\"center\", va=\"center\", fontsize=13, fontweight=\"bold\")\n    ax.text(0.69, 0.5, str(len(only_b)), ha=\"center\", va=\"center\", fontsize=13, fontweight=\"bold\")\n    ax.text(0.50, 0.5, str(len(both)), ha=\"center\", va=\"center\", fontsize=13, fontweight=\"bold\")\n    ax.text(0.32, 0.18, label_a, ha=\"center\", va=\"center\", fontsize=10, fontweight=\"bold\")\n    ax.text(0.68, 0.18, label_b, ha=\"center\", va=\"center\", fontsize=10, fontweight=\"bold\")\n    ax.set_title(title, fontsize=13, fontweight=\"bold\")\n    ax.set_xlim(0, 1)\n    ax.set_ylim(0, 1)\n    ax.axis(\"off\")\n\n    if save_name:\n        fig.savefig(save_name, dpi=500, bbox_inches=\"tight\", transparent=True)\n    if show:\n        plt.show()\n\n    return {\"only_a\": only_a, \"only_b\": only_b, \"intersection\": both}\n\n\ndef plot_venn3_sets(sets_dict, title, save_name=None, show=True):\n    \"\"\"Draw a proportion-free three-set Venn diagram with the region sizes annotated.\"\"\"\n    names = list(sets_dict)\n    if len(names) != 3:\n        raise ValueError(\"plot_venn3_sets expects exactly three sets.\")\n\n    A, B, C = [sets_dict[name] for name in names]\n    counts = {\n        \"A_only\": len(A - B - C),\n        \"B_only\": len(B - A - C),\n        \"C_only\": len(C - A - B),\n        \"AB_only\": len((A & B) - C),\n        \"AC_only\": len((A & C) - B),\n        \"BC_only\": len((B & C) - A),\n        \"ABC\": len(A & B & C),\n    }\n\n    fig, ax = plt.subplots(figsize=(7, 5.5))\n    for center, color in (((0.42, 0.58), \"#4C78A8\"), ((0.58, 0.58), \"#F58518\"), ((0.50, 0.40), \"#54A24B\")):\n        ax.add_patch(Circle(center, 0.28, color=color, alpha=0.32, lw=2, ec=color))\n\n    positions = {\n        \"A_only\": (0.31, 0.62),\n        \"B_only\": (0.69, 0.62),\n        \"C_only\": (0.50, 0.24),\n        \"AB_only\": (0.50, 0.67),\n        \"AC_only\": (0.40, 0.45),\n        \"BC_only\": (0.60, 0.45),\n        \"ABC\": (0.50, 0.52),\n    }\n    for key, (xpos, ypos) in positions.items():\n        ax.text(xpos, ypos, str(counts[key]), ha=\"center\", va=\"center\", fontsize=12, fontweight=\"bold\")\n\n    ax.text(0.22, 0.86, names[0], ha=\"center\", va=\"center\", fontsize=9, fontweight=\"bold\")\n    ax.text(0.78, 0.86, names[1], ha=\"center\", va=\"center\", fontsize=9, fontweight=\"bold\")\n    ax.text(0.50, 0.08, names[2], ha=\"center\", va=\"center\", fontsize=9, fontweight=\"bold\")\n    ax.set_title(title, fontsize=13, fontweight=\"bold\")\n    ax.set_xlim(0, 1)\n    ax.set_ylim(0, 1)\n    ax.axis(\"off\")\n\n    if save_name:\n        fig.savefig(save_name, dpi=500, bbox_inches=\"tight\", transparent=True)\n    if show:\n        plt.show()\n\n    return counts\n\n\ndef upset_intersection_counts(sets_dict):\n    \"\"\"Count only the observed intersection patterns, without enumerating 2**N combinations.\"\"\"\n    import pandas as pd\n\n    names = list(sets_dict)\n    columns = [\"intersection\", \"size\", \"features\", *names]\n    if not names:\n        return pd.DataFrame(columns=columns)\n\n    observed_patterns = {}\n    for feature in set().union(*sets_dict.values()):\n        selected = tuple(name for name in names if feature in sets_dict[name])\n        if selected:\n            observed_patterns.setdefault(selected, set()).add(feature)\n\n    rows = [\n        {\n            \"intersection\": \" & \".join(selected),\n            \"size\": len(features),\n            \"features\": sorted(features),\n            **{name: name in selected for name in names},\n        }\n        for selected, features in observed_patterns.items()\n    ]\n    if not rows:\n        return pd.DataFrame(columns=columns)\n    return (\n        pd.DataFrame(rows, columns=columns)\n        .sort_values([\"size\", \"intersection\"], ascending=[False, True])\n        .reset_index(drop=True)\n    )\n\n\ndef plot_upset_sets(sets_dict, title, save_name=None, show=True):\n    \"\"\"Draw a compact UpSet plot (bar sizes + membership matrix) of the observed intersections.\"\"\"\n    import numpy as np\n\n    counts = upset_intersection_counts(sets_dict)\n    names = list(sets_dict)\n    if counts.empty:\n        print(f\"No intersections to plot in the UpSet: {title}\")\n        return counts\n\n    x = np.arange(len(counts))\n    fig = plt.figure(figsize=(max(7, 0.75 * len(counts)), 5))\n    grid = fig.add_gridspec(2, 1, height_ratios=[3, 1.4], hspace=0.05)\n    ax_bar = fig.add_subplot(grid[0])\n    ax_matrix = fig.add_subplot(grid[1], sharex=ax_bar)\n\n    ax_bar.bar(x, counts[\"size\"], color=\"#4C78A8\", edgecolor=\"black\", linewidth=0.8)\n    ax_bar.set_ylabel(\"Features\", fontweight=\"bold\")\n    ax_bar.set_title(title, fontweight=\"bold\")\n    ax_bar.grid(axis=\"y\", linestyle=\"--\", alpha=0.35)\n    ax_bar.tick_params(axis=\"x\", labelbottom=False)\n    for xpos, size in zip(x, counts[\"size\"]):\n        ax_bar.text(xpos, size, str(size), ha=\"center\", va=\"bottom\", fontsize=9, fontweight=\"bold\")\n\n    y_positions = np.arange(len(names))[::-1]\n    for xpos, row in counts.iterrows():\n        active_y = []\n        for ypos, name in zip(y_positions, names):\n            active = bool(row[name])\n            ax_matrix.scatter(xpos, ypos, s=70, color=\"black\" if active else \"#D0D0D0\", zorder=3)\n            if active:\n                active_y.append(ypos)\n        if len(active_y) > 1:\n            ax_matrix.plot([xpos, xpos], [min(active_y), max(active_y)], color=\"black\", linewidth=1.4, zorder=2)\n\n    ax_matrix.set_yticks(y_positions)\n    ax_matrix.set_yticklabels(names, fontweight=\"bold\")\n    ax_matrix.set_xticks(x)\n    ax_matrix.set_xticklabels([\"\"] * len(counts))\n    ax_matrix.set_ylim(-0.8, len(names) - 0.2)\n    ax_matrix.grid(axis=\"y\", linestyle=\":\", alpha=0.25)\n    ax_matrix.spines[[\"top\", \"right\", \"bottom\"]].set_visible(False)\n\n    if save_name:\n        fig.savefig(save_name, dpi=500, bbox_inches=\"tight\", transparent=True)\n    if show:\n        plt.show()\n\n    return counts\n", "src/volcano_plot.py": "from __future__ import annotations\n\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport pandas as pd\nimport scipy.stats as stats\nfrom adjustText import adjust_text\nfrom statsmodels.stats.multitest import multipletests\n\n\ndef _metadata_columns(df: pd.DataFrame, non_numeric_columns: list[str] | None) -> list[str]:\n    if non_numeric_columns is None:\n        return []\n    return [col for col in non_numeric_columns if col in df.columns]\n\n\ndef _safe_neg_log10(values):\n    \"\"\"Safely compute ``-log10`` while clipping zero or near-zero values.\"\"\"\n    values = np.asarray(values, dtype=float)\n    return -np.log10(np.clip(values, np.finfo(float).tiny, None))\n\n\ndef _log2_fold_change(x1, x2, *, data_are_log2: bool, pseudocount: float):\n    \"\"\"Compute log2 fold-change for either linear-scale or log2-scale data.\"\"\"\n    x1 = pd.Series(x1).dropna().astype(float)\n    x2 = pd.Series(x2).dropna().astype(float)\n    if x1.empty or x2.empty:\n        return np.nan, np.nan, np.nan\n\n    if data_are_log2:\n        mean1 = x1.mean()\n        mean2 = x2.mean()\n        return mean1 - mean2, mean1, mean2\n\n    mean1 = x1.mean()\n    mean2 = x2.mean()\n    adj1 = mean1 + pseudocount\n    adj2 = mean2 + pseudocount\n    if adj1 <= 0 or adj2 <= 0:\n        return np.nan, mean1, mean2\n    return np.log2(adj1 / adj2), mean1, mean2\n\n\ndef volcano_plot(\n    df,\n    group_col=\"groups\",\n    groups: tuple | list | None = None,\n    non_numerical_columns=[\"samples\", \"groups\"],\n    threshold=0.05,\n    save_name=None,\n    annotate=True,\n    fdr_correction=True,\n    data_are_log2=False,\n    pseudocount=1.0,\n    fold_change_df=None,\n    fold_change_threshold=2.0,\n    correction_method=\"fdr_bh\",\n    equal_var=False,\n    show=True,\n    colors=(\"blue\", \"red\", \"gray\"),\n    marker_size=None,\n    alpha=0.5,\n):\n    \"\"\"Generate a volcano plot with consistent p-value or q-value significance calls.\n\n    Set ``data_are_log2=True`` when the numeric matrix is already log2-transformed.\n    In that case the x-axis is the difference between group means on the log2 scale.\n    For linear-scale intensities, the x-axis is ``log2((mean1 + pseudocount) /\n    (mean2 + pseudocount))``.\n\n    ``fold_change_df`` (opcional) segue o MetaboAnalyst: o fold change e calculado nessa tabela\n    (dados normalizados por amostra, escala linear) como ``log2(media1 / media2)``, enquanto o\n    t-test usa ``df`` (dados totalmente normalizados).\n\n    ``fold_change_threshold`` e o corte em |log2 FC| (ex.: 1 = dobro, 2 = quatro vezes).\n\n    ``colors`` = (higher in groups[0], higher in groups[1], not significant).\n    \"\"\"\n    if groups is None:\n        groups = list(pd.unique(df[group_col]))\n    if len(groups) != 2:\n        raise ValueError(\"volcano_plot expects exactly two groups.\")\n\n    df1 = df[df[group_col] == groups[0]]\n    df2 = df[df[group_col] == groups[1]]\n    if fold_change_df is not None:\n        fc1 = fold_change_df[fold_change_df[group_col] == groups[0]]\n        fc2 = fold_change_df[fold_change_df[group_col] == groups[1]]\n    variables = (\n        df.drop(columns=_metadata_columns(df, non_numerical_columns), errors=\"ignore\")\n        .select_dtypes(include=[np.number])\n        .columns.tolist()\n    )\n\n    all_rows = []\n    for var in variables:\n        x1 = pd.to_numeric(df1[var], errors=\"coerce\").dropna()\n        x2 = pd.to_numeric(df2[var], errors=\"coerce\").dropna()\n        if len(x1) < 2 or len(x2) < 2:\n            continue\n\n        t_stat, p_value = stats.ttest_ind(x1, x2, equal_var=equal_var, nan_policy=\"omit\")\n        if not np.isfinite(p_value):\n            p_value = 1.0\n\n        if fold_change_df is None:\n            log2_fc, mean1, mean2 = _log2_fold_change(x1, x2, data_are_log2=data_are_log2, pseudocount=pseudocount)\n        elif var in fold_change_df.columns:\n            log2_fc, mean1, mean2 = _log2_fold_change(\n                pd.to_numeric(fc1[var], errors=\"coerce\"),\n                pd.to_numeric(fc2[var], errors=\"coerce\"),\n                data_are_log2=False,\n                pseudocount=0.0,\n            )\n        else:\n            continue\n        if not np.isfinite(log2_fc):\n            continue\n\n        all_rows.append(\n            {\n                \"variables\": var,\n                \"p_value\": float(p_value),\n                \"mean_group_1\": mean1,\n                \"mean_group_2\": mean2,\n                \"fold_change\": log2_fc,\n                \"log2_fold_change\": log2_fc,\n                \"-log10(p-value)\": _safe_neg_log10([p_value])[0],\n            }\n        )\n\n    df_all = pd.DataFrame(all_rows)\n    if df_all.empty:\n        raise ValueError(\"No valid numeric variables were available for volcano plotting.\")\n\n    if fdr_correction:\n        _, pvals_corrected, _, _ = multipletests(df_all[\"p_value\"].values, method=correction_method)\n        df_all[\"adjusted_p_value\"] = pvals_corrected\n    else:\n        df_all[\"adjusted_p_value\"] = df_all[\"p_value\"]\n\n    df_all[\"-log10(adjusted p-value)\"] = _safe_neg_log10(df_all[\"adjusted_p_value\"].values)\n    significance_p = df_all[\"adjusted_p_value\"] if fdr_correction else df_all[\"p_value\"]\n    df_all[\"significant\"] = (np.abs(df_all[\"log2_fold_change\"]) >= fold_change_threshold) & (significance_p < threshold)\n    df_all[\"maior_em\"] = np.where(df_all[\"log2_fold_change\"] > 0, groups[0], groups[1])\n\n    y_col = \"-log10(adjusted p-value)\" if fdr_correction else \"-log10(p-value)\"\n    df_all[\"_sort\"] = np.abs(df_all[\"log2_fold_change\"]) + df_all[y_col].fillna(0)\n    df_all = df_all.sort_values(by=[\"significant\", \"_sort\"], ascending=[False, False]).reset_index(drop=True)\n    df_all = df_all.drop(columns=[\"_sort\"])\n\n    fig, ax = plt.subplots(figsize=(8, 5))\n\n    for _, row in df_all.iterrows():\n        x = row[\"log2_fold_change\"]\n        y = row[y_col]\n        if row[\"significant\"] and x >= fold_change_threshold:\n            color = colors[0]\n        elif row[\"significant\"] and x <= -fold_change_threshold:\n            color = colors[1]\n        else:\n            color = colors[2]\n        ax.scatter(x, y, color=color, alpha=alpha, edgecolors=color, s=marker_size)\n\n    y_label = \"-log10(adjusted p-value)\" if fdr_correction else \"-log10(p-value)\"\n    ax.set_xlabel(\"log2(Fold-Change)\", fontweight=\"bold\")\n    ax.set_ylabel(y_label, fontweight=\"bold\")\n    ax.set_title(f\"{groups[0]} $vs$ {groups[1]}\", fontweight=\"bold\")\n    ax.axhline(y=-np.log10(threshold), color=\"black\", linestyle=\"--\")\n    ax.axvline(x=fold_change_threshold, color=\"black\", linestyle=\"--\")\n    ax.axvline(x=-fold_change_threshold, color=\"black\", linestyle=\"--\")\n\n    if annotate:\n        sig_df = df_all[df_all[\"significant\"]].head(10)\n        texts = []\n        for _, row in sig_df.iterrows():\n            x = row[\"log2_fold_change\"]\n            y = row[y_col]\n            ann = ax.annotate(\n                f\"{row['variables']}\",\n                xy=(x, y),\n                xytext=(x + 0.1, y + 0.1),\n                fontsize=8,\n                color=\"black\",\n                weight=\"bold\",\n                ha=\"center\",\n                va=\"bottom\",\n                bbox=dict(boxstyle=\"round,pad=0.3\", edgecolor=\"black\", facecolor=\"white\"),\n            )\n            texts.append(ann)\n\n        if texts:\n            adjust_text(texts, ax=ax, arrowprops=dict(arrowstyle=\"->\", color=\"black\"))\n\n    if save_name is not None:\n        fig.savefig(save_name, dpi=600, bbox_inches=\"tight\", transparent=True)\n    if show:\n        plt.show()\n\n    return df_all\n", "web_api.py": "\"\"\"Ponte entre a pagina HTML (Web Worker com Pyodide) e o motor ``src.pipeline``.\n\nAs funcoes recebem e devolvem tipos simples (bytes, texto, JSON em texto) para facilitar a troca\nde mensagens com o JavaScript.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\n\nfrom src.pipeline import (\n    STEP_KEYS,\n    ListReporter,\n    PipelineParams,\n    capture_figures,\n    compute_preprocessing,\n    csv_attribute_rows,\n    default_style,\n    export_zip,\n    gnps_info,\n    load_state,\n    numeric_attribute_rows,\n    read_gnps,\n    run_pipeline,\n    show_preprocessing,\n)\n\nEXPORT_DPI = 300  # 600 dpi estoura a memoria do navegador em figuras grandes\n_state = None\n_exports = []\n\n\ndef _as_bytes(data):\n    \"\"\"bytes de um arquivo vindo do JavaScript (Uint8Array) ou de Python; '' ou None = vazio.\"\"\"\n    if data is None or isinstance(data, str):\n        return b\"\"\n    if hasattr(data, \"to_bytes\"):\n        return data.to_bytes()\n    return bytes(data)\n\n\ndef _require_state():\n    if _state is None:\n        raise RuntimeError(\"No data loaded.\")\n    return _state\n\n\ndef load_csv(data, name, group_row=\"\"):\n    global _state\n    raw = _as_bytes(data)\n    try:\n        rows = csv_attribute_rows(raw)\n    except Exception:\n        rows = []\n    try:\n        state = load_state(raw, group_row=group_row or None, source_name=name)\n    except Exception as exc:\n        return json.dumps({\"ok\": False, \"error\": str(exc), \"attribute_rows\": rows})\n    _state = state\n    _exports.clear()\n    colors, symbols = default_style(state.groups)\n    counts = state.df_raw[\"groups\"].value_counts()\n    return json.dumps({\n        \"ok\": True,\n        \"name\": name,\n        \"samples\": state.samples,\n        \"groups\": state.groups,\n        \"group_counts\": {group: int(counts[group]) for group in state.groups},\n        \"features\": state.features,\n        \"attribute_rows\": rows,\n        \"numeric_attribute_rows\": numeric_attribute_rows(state.raw_input),\n        \"default_colors\": colors,\n        \"default_symbols\": symbols,\n    })\n\n\ndef load_gnps(library, network, lang=\"pt\"):\n    state = _require_state()\n    sources = (_as_bytes(library) or None, _as_bytes(network) or None)\n    try:\n        parsed = read_gnps(*sources)\n    except Exception as exc:\n        state.gnps_sources = (None, None)\n        return json.dumps({\"ok\": False, \"error\": str(exc)})\n    state.gnps_sources = sources\n    return json.dumps({\"ok\": True, \"info\": gnps_info(*parsed, lang=lang)})\n\n\ndef preprocess(params_json):\n    state = _require_state()\n    params = PipelineParams.from_dict(json.loads(params_json))\n    reporter = ListReporter()\n    with capture_figures(reporter):\n        try:\n            pre, _, _ = compute_preprocessing(state, params)\n            show_preprocessing(state, params, pre, reporter)\n            ok = True\n        except Exception as exc:\n            reporter.error(str(exc))\n            ok = False\n    return json.dumps({\"ok\": ok, \"items\": reporter.items})\n\n\ndef run(params_json, progress=None):\n    state = _require_state()\n    params = PipelineParams.from_dict(json.loads(params_json))\n    reporters = {}\n\n    def reporter_for(key):\n        reporters[key] = ListReporter(export_dpi=EXPORT_DPI, prefix=f\"{STEP_KEYS.index(key) + 1:02d}_{key}\")\n        return reporters[key]\n\n    def on_step(key, index):\n        if progress is not None:\n            progress(\"step\", key)\n\n    state.progress = (lambda message: progress(\"message\", message)) if progress is not None else None\n    try:\n        run_pipeline(state, params, reporter_for, on_step)\n    finally:\n        state.progress = None\n    _exports[:] = [item for key in STEP_KEYS if key in reporters for item in reporters[key].exports]\n    return json.dumps({\"sections\": {key: reporter.items for key, reporter in reporters.items()},\n                       \"errors\": list(state.results.get(\"erros\", {}))})\n\n\ndef export_results():\n    return export_zip(_require_state().results, list(_exports))\n"};
/* Web Worker: roda o pipeline Python (src/) no navegador com Pyodide.
   PYODIDE_URL e PY_FILES sao inseridos antes deste codigo pelo web/build.py. */
let pyodide = null;
let api = null;

function post(message) {
  self.postMessage(message);
}

async function boot() {
  post({ type: "boot", key: "loading.python" });
  importScripts(PYODIDE_URL + "pyodide.js");
  pyodide = await loadPyodide({ indexURL: PYODIDE_URL });
  post({ type: "boot", key: "loading.packages" });
  await pyodide.loadPackage(["numpy", "pandas", "scipy", "matplotlib", "scikit-learn", "statsmodels", "micropip"]);
  const micropip = pyodide.pyimport("micropip");
  await micropip.install(["openpyxl", "seaborn", "adjustText"]);
  pyodide.FS.mkdirTree("/home/pyodide/src");
  for (const [path, code] of Object.entries(PY_FILES)) {
    pyodide.FS.writeFile("/home/pyodide/" + path, code);
  }
  pyodide.runPython([
    "import os, sys",
    "os.environ['MPLBACKEND'] = 'Agg'",
    "sys.path.insert(0, '/home/pyodide')",
  ].join("\n"));
  api = pyodide.pyimport("web_api");
  post({ type: "boot", key: "loading.ready", done: true });
}

const ready = boot().catch((error) => {
  post({ type: "boot", key: "loading.error", error: String((error && error.message) || error) });
  throw error;
});

async function handle(cmd, p) {
  if (cmd === "load_csv") {
    return api.load_csv(new Uint8Array(p.data), p.name, p.groupRow || "");
  }
  if (cmd === "load_gnps") {
    return api.load_gnps(p.library ? new Uint8Array(p.library) : "", p.network ? new Uint8Array(p.network) : "", p.lang);
  }
  if (cmd === "preprocess") {
    return api.preprocess(JSON.stringify(p.params));
  }
  if (cmd === "run") {
    return api.run(JSON.stringify(p.params), (kind, value) => post({ type: "progress", kind, value }));
  }
  if (cmd === "export") {
    const proxy = api.export_results();
    const bytes = proxy.toJs();
    proxy.destroy();
    return bytes;
  }
  throw new Error("Unknown command: " + cmd);
}

self.onmessage = async (event) => {
  const { id, cmd, payload } = event.data;
  try {
    await ready;
    post({ id, result: await handle(cmd, payload || {}) });
  } catch (error) {
    post({ id, error: String((error && error.message) || error) });
  }
};
</script>
<script>
"use strict";
const STEP_KEYS = ["pre", "pca", "hca", "heatmap", "plsda", "volcano", "venn", "gnps", "summary"];
const ANALYSES = ["pca", "hca", "heatmap", "plsda", "volcano", "venn", "gnps"];
const MARKERS = ["o", "^", "v", "s", "D", "p", "h", "*", "P", "X"];
const app = { lang: "pt", step: 1, data: null, ready: false, busy: false, sections: {}, activeTab: "pre" };
const pending = {};
let nextId = 1;
let worker = null;

function $(selector) { return document.querySelector(selector); }

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children) if (child !== null && child !== undefined) node.append(child);
  return node;
}

function tr(key, vars) {
  const table = I18N[app.lang] || I18N.pt;
  let text = key in table ? table[key] : (key in I18N.pt ? I18N.pt[key] : key);
  for (const [name, value] of Object.entries(vars || {})) text = text.split("{" + name + "}").join(String(value));
  return text;
}

function i18nSpan(key) { return el("span", { "data-i18n": key, text: tr(key) }); }

function helpButton(key) { return el("button", { type: "button", class: "help", "data-help": key, text: "i" }); }

// ------------------------------------------------------------------ idioma
function applyI18n() {
  document.documentElement.lang = app.lang === "pt" ? "pt-BR" : "en";
  document.title = tr("app.title");
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = tr(node.dataset.i18n);
  for (const node of document.querySelectorAll("button.help")) node.setAttribute("aria-label", tr("help.aria"));
  updateChoiceHelp();
  renderStepper();
  renderTabs();
  if (app.data) renderDataInfo();
}

function setLanguage(lang) {
  app.lang = lang === "en" ? "en" : "pt";
  $("#lang").value = app.lang;
  try { localStorage.setItem("metabo-lang", app.lang); } catch (error) { /* armazenamento indisponivel */ }
  applyI18n();
}

// ------------------------------------------------------------------ ajuda (balao)
const tooltip = $("#tooltip");
let tipOwner = null;
let tipPinned = false;

function showTip(owner, pinned) {
  tipOwner = owner;
  tipPinned = pinned;
  tooltip.textContent = tr(owner.dataset.help);
  tooltip.style.display = "block";
  owner.setAttribute("aria-describedby", "tooltip");
  const rect = owner.getBoundingClientRect();
  const width = tooltip.offsetWidth;
  const height = tooltip.offsetHeight;
  const left = Math.min(Math.max(8, rect.left), window.innerWidth - width - 8);
  let top = rect.bottom + 8;
  if (top + height > window.innerHeight - 8) top = Math.max(8, rect.top - height - 8);
  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
}

function hideTip() {
  if (tipOwner) tipOwner.removeAttribute("aria-describedby");
  tooltip.style.display = "none";
  tipOwner = null;
  tipPinned = false;
}

document.addEventListener("mouseover", (event) => {
  const owner = event.target.closest("[data-help]");
  if (owner && !tipPinned) showTip(owner, false);
});
document.addEventListener("mouseout", (event) => {
  const owner = event.target.closest("[data-help]");
  if (owner && owner === tipOwner && !tipPinned && !owner.contains(event.relatedTarget)) hideTip();
});
document.addEventListener("focusin", (event) => {
  if (event.target.matches("button.help")) showTip(event.target, false);
});
document.addEventListener("focusout", (event) => {
  if (event.target === tipOwner && !tipPinned) hideTip();
});
document.addEventListener("click", (event) => {
  const button = event.target.closest("button.help");
  if (button) {
    if (tipOwner === button && tipPinned) hideTip();
    else showTip(button, true);
  } else if (!event.target.closest("#tooltip")) {
    hideTip();
  }
});
document.addEventListener("keydown", (event) => { if (event.key === "Escape") hideTip(); });

// ------------------------------------------------------------------ campos (SCHEMA)
function fieldById(id) { return SCHEMA.find((item) => item.id === id); }

function readValue(item) {
  const input = $("#fld-" + item.id);
  if (!input) return null;
  if (item.type === "checkbox") return input.checked;
  if (item.type === "select") return input.value || null;
  return Number(input.value);
}

function isVisible(item) {
  if (!item.showIf) return true;
  const ref = fieldById(item.showIf.field);
  if (!isVisible(ref)) return false;
  const value = readValue(ref);
  if ("in" in item.showIf) return item.showIf.in.includes(value);
  return value === item.showIf.equals;
}

function rangeText(item, value) { return value + (item.unit || ""); }

function buildField(item) {
  const id = "fld-" + item.id;
  let input;
  if (item.type === "select") {
    input = el("select", { id });
    for (const value of item.options || []) {
      input.append(el("option", { value, "data-i18n": `o.${item.id}.${value}`, text: tr(`o.${item.id}.${value}`) }));
    }
    if (item.default !== undefined) input.value = item.default;
  } else if (item.type === "checkbox") {
    input = el("input", { id, type: "checkbox" });
    input.checked = Boolean(item.default);
  } else {
    input = el("input", { id, type: item.type === "range" ? "range" : "number",
                          min: item.min, max: item.max, step: item.step_size });
    input.value = item.default;
  }
  const row = el("div", { class: "control-row" }, input);
  if (item.type === "range") {
    const output = el("output", { id: id + "-value", text: rangeText(item, input.value) });
    input.addEventListener("input", () => { output.textContent = rangeText(item, input.value); });
    row.append(output);
  }
  const control = el("div", { class: "control" }, row);
  if (item.optionHelp) control.append(el("div", { class: "choice-help muted", id: id + "-desc" }));
  input.addEventListener("change", () => { updateVisibility(); updateChoiceHelp(); });
  const label = el("div", { class: "label", "data-help": "h." + item.id },
                   el("label", { for: id, "data-i18n": "f." + item.id, text: tr("f." + item.id) }),
                   helpButton("h." + item.id));
  return el("div", { class: "field", id: "row-" + item.id }, label, control);
}

function renderForms() {
  for (let step = 2; step <= 5; step += 1) {
    const container = $("#form-" + step);
    let section = null;
    for (const item of SCHEMA.filter((field) => field.step === step)) {
      if (item.section !== section) {
        section = item.section;
        container.append(el("h3", { "data-i18n": "s." + section, text: tr("s." + section) }));
      }
      container.append(buildField(item));
    }
  }
  updateVisibility();
  updateChoiceHelp();
}

function updateVisibility() {
  for (const item of SCHEMA) $("#row-" + item.id).classList.toggle("hidden", !isVisible(item));
}

function updateChoiceHelp() {
  for (const item of SCHEMA.filter((field) => field.optionHelp)) {
    const desc = $("#fld-" + item.id + "-desc");
    if (desc) desc.textContent = tr(`d.${item.id}.${readValue(item)}`);
  }
}

function fillSourceOptions() {
  for (const item of SCHEMA.filter((field) => field.source)) {
    const select = $("#fld-" + item.id);
    select.innerHTML = "";
    for (const value of app.data[item.source] || []) select.append(el("option", { value, text: value }));
  }
}

// ------------------------------------------------------------------ listas dinamicas
function checkboxes(container, values, isChecked, label, onChange) {
  container.innerHTML = "";
  values.forEach((value, index) => {
    const id = `${container.id}-${index}`;
    const box = el("input", { type: "checkbox", id, value: typeof value === "string" ? value : JSON.stringify(value) });
    box.checked = isChecked(value);
    if (onChange) box.addEventListener("change", onChange);
    container.append(el("label", { class: "check", for: id }, box, label(value)));
  });
}

function checkedValues(selector) {
  return [...document.querySelectorAll(selector + " input[type=checkbox]")].filter((box) => box.checked).map((box) => box.value);
}

function selectedValues(selector) { return [...$(selector).selectedOptions].map((option) => option.value); }

function fillMultiSelect(selector, values) {
  const select = $(selector);
  select.innerHTML = "";
  for (const value of values) select.append(el("option", { value, text: value }));
}

function renderComparisons() {
  const groups = checkedValues("#ana-groups");
  const pairs = [];
  groups.forEach((a, i) => groups.slice(i + 1).forEach((b) => pairs.push([a, b])));
  const container = $("#comparisons");
  if (!pairs.length) {
    container.innerHTML = "";
    container.append(el("span", { class: "muted", "data-i18n": "ana.comparisons_empty", text: tr("ana.comparisons_empty") }));
    return;
  }
  checkboxes(container, pairs, () => true, (pair) => document.createTextNode(`${pair[0]} vs ${pair[1]}`));
}

function renderStyleRows(reset) {
  const container = $("#style-rows");
  const previous = {};
  if (!reset) {
    for (const row of container.querySelectorAll(".style-row")) {
      previous[row.dataset.group] = [row.querySelector("input").value, row.querySelector("select").value];
    }
  }
  container.innerHTML = "";
  for (const group of app.data.groups) {
    const [color, marker] = previous[group] || [app.data.default_colors[group], app.data.default_symbols[group]];
    const picker = el("input", { type: "color", value: color, "aria-label": group });
    const shape = el("select", { "aria-label": group });
    for (const code of MARKERS) shape.append(el("option", { value: code, "data-i18n": "m." + code, text: tr("m." + code) }));
    shape.value = marker;
    container.append(el("div", { class: "style-row", "data-group": group }, el("span", { class: "name", text: group }), picker, shape));
  }
}

function populateFromData() {
  const data = app.data;
  checkboxes($("#pre-groups"), data.groups, () => true, (group) => document.createTextNode(group));
  checkboxes($("#ana-groups"), data.groups, (group) => group !== "qc", (group) => document.createTextNode(group), renderComparisons);
  fillMultiSelect("#pre-exclude", data.samples);
  fillMultiSelect("#ana-exclude", data.samples);
  checkboxes($("#analyses"), ANALYSES, () => true, (key) => i18nSpan("a." + key));
  renderComparisons();
  renderStyleRows(true);
  fillSourceOptions();
  updateVisibility();
}

function renderDataInfo() {
  const info = $("#data-info");
  info.innerHTML = "";
  if (!app.data) return;
  const data = app.data;
  info.append(el("p", { class: "ok", text: tr("data.loaded", {
    name: data.name, samples: data.samples.length, features: data.features.length, groups: data.groups.length }) }));
  const table = el("table", { class: "table" });
  table.append(el("tr", {}, ...data.groups.map((group) => el("th", { text: group }))));
  table.append(el("tr", {}, ...data.groups.map((group) => el("td", { text: data.group_counts[group] }))));
  info.append(el("p", { class: "muted", text: tr("data.group_counts") }), el("div", { class: "table-wrap" }, table));
}

// ------------------------------------------------------------------ parametros
function setPath(target, path, value) {
  const parts = path.split(".");
  let node = target;
  for (const part of parts.slice(0, -1)) node = node[part] = node[part] || {};
  node[parts[parts.length - 1]] = value;
}

function collectParams() {
  const params = { lang: app.lang, preprocessing: {} };
  for (const item of SCHEMA) {
    if (!item.param || !isVisible(item)) continue;
    let value = readValue(item);
    if (item.scale && value !== null) value = Math.round(value * item.scale * 1e6) / 1e6;
    setPath(params, item.param, value);
  }
  params.pre_groups = checkedValues("#pre-groups");
  params.pre_samples_exclude = selectedValues("#pre-exclude");
  params.ana_groups = checkedValues("#ana-groups");
  params.ana_samples_exclude = selectedValues("#ana-exclude");
  params.comparisons = checkedValues("#comparisons").map((value) => JSON.parse(value));
  params.analyses = checkedValues("#analyses");
  params.colors = {};
  params.symbols = {};
  for (const row of document.querySelectorAll("#style-rows .style-row")) {
    params.colors[row.dataset.group] = row.querySelector("input").value;
    params.symbols[row.dataset.group] = row.querySelector("select").value;
  }
  return params;
}

// ------------------------------------------------------------------ navegacao
function renderStepper() {
  const nav = $("#stepper");
  nav.innerHTML = "";
  for (let step = 1; step <= 5; step += 1) {
    const button = el("button", { type: "button", "data-step": step, class: step === app.step ? "active" : "",
                                  disabled: step > 1 && !app.data, text: tr("step." + step) });
    button.addEventListener("click", () => goTo(step));
    nav.append(button);
  }
}

function goTo(step) {
  if (step > 1 && !app.data) return;
  app.step = Math.min(5, Math.max(1, step));
  for (const section of document.querySelectorAll("section.step")) {
    section.classList.toggle("hidden", Number(section.dataset.step) !== app.step);
  }
  $("#back-btn").disabled = app.step === 1;
  $("#next-btn").disabled = app.step === 5 || !app.data;
  renderStepper();
}

function updateButtons() {
  const canRun = app.ready && app.data && !app.busy;
  $("#apply-btn").disabled = !canRun;
  $("#run-btn").disabled = !canRun;
  $("#csv-file").disabled = app.busy;
  $("#next-btn").disabled = app.step === 5 || !app.data;
}

function setStatus(text, fraction) {
  $("#status").textContent = text;
  if (fraction !== undefined) $("#run-bar").style.width = Math.round(fraction * 100) + "%";
}

// ------------------------------------------------------------------ resultados
function renderTabs() {
  const tabs = $("#tabs");
  tabs.innerHTML = "";
  for (const key of STEP_KEYS) {
    const items = app.sections[key];
    const hasError = (items || []).some((item) => item.type === "error");
    const button = el("button", { type: "button", role: "tab", class: "tab" + (key === app.activeTab ? " active" : "") + (hasError ? " has-error" : ""),
                                  "data-tab": key, text: tr("tab." + key) });
    button.addEventListener("click", () => showTab(key));
    tabs.append(button);
  }
}

function renderItems(container, items) {
  container.innerHTML = "";
  if (!items || !items.length) {
    container.append(el("p", { class: "muted", "data-i18n": "results.empty", text: tr("results.empty") }));
    return;
  }
  for (const item of items) {
    if (item.type === "heading") {
      const heading = el(item.level >= 4 ? "h4" : "h3");
      heading.innerHTML = item.text;
      container.append(heading);
    } else if (item.type === "html") {
      const block = el("div");
      block.innerHTML = item.html;
      container.append(block);
    } else if (item.type === "table") {
      const wrap = el("div", { class: "table-wrap" });
      wrap.innerHTML = item.html;
      container.append(wrap);
    } else if (item.type === "figure") {
      container.append(el("img", { src: "data:image/png;base64," + item.png, alt: tr("results.figure"), loading: "lazy" }));
    } else if (item.type === "error") {
      const box = el("div", { class: "error" }, el("strong", { text: item.text }));
      if (item.details) box.append(el("details", {}, el("summary", { text: tr("results.details") }), el("pre", { text: item.details })));
      container.append(box);
    }
  }
}

function renderResults() {
  $("#results").classList.remove("hidden");
  const panels = $("#panels");
  panels.innerHTML = "";
  for (const key of STEP_KEYS) {
    const panel = el("div", { class: "tab-panel" + (key === app.activeTab ? "" : " hidden"), id: "panel-" + key, role: "tabpanel" });
    renderItems(panel, app.sections[key]);
    panels.append(panel);
  }
  renderTabs();
}

function showTab(key) {
  app.activeTab = key;
  for (const panel of document.querySelectorAll(".tab-panel")) panel.classList.toggle("hidden", panel.id !== "panel-" + key);
  renderTabs();
}

// ------------------------------------------------------------------ worker
function call(cmd, payload) {
  return new Promise((resolve, reject) => {
    const id = nextId++;
    pending[id] = { resolve, reject };
    worker.postMessage({ id, cmd, payload });
  });
}

function onWorkerMessage(event) {
  const message = event.data;
  if (message.type === "boot") {
    const steps = { "loading.python": 0.2, "loading.packages": 0.6, "loading.ready": 1 };
    $("#boot-bar").style.width = Math.round((steps[message.key] || 0) * 100) + "%";
    $("#boot-text").textContent = tr(message.key, { error: message.error || "" });
    $("#boot-text").setAttribute("data-i18n", message.key);
    if (message.error) {
      $("#boot-text").removeAttribute("data-i18n");
      $("#boot-text").classList.add("error");
    }
    if (message.done) {
      app.ready = true;
      $("#boot").classList.add("hidden");
      setStatus(app.data ? tr("status.loaded") : tr("status.idle"));
      updateButtons();
    }
    return;
  }
  if (message.type === "progress") {
    if (message.kind === "step") {
      const index = STEP_KEYS.indexOf(message.value);
      setStatus(tr("status.running", { step: tr("tab." + message.value) }), index / STEP_KEYS.length);
    } else {
      setStatus(tr("status.running", { step: message.value }));
    }
    return;
  }
  const request = pending[message.id];
  if (!request) return;
  delete pending[message.id];
  if (message.error) request.reject(new Error(message.error));
  else request.resolve(message.result);
}

async function busy(task) {
  app.busy = true;
  updateButtons();
  try {
    return await task();
  } catch (error) {
    setStatus(tr("status.error", { error: error.message }));
    return null;
  } finally {
    app.busy = false;
    updateButtons();
  }
}

// ------------------------------------------------------------------ acoes
async function loadCsv(groupRow) {
  const file = $("#csv-file").files[0];
  if (!file) return;
  if (!app.ready) { setStatus(tr("status.wait_python")); }
  setStatus(tr("status.loading_csv"));
  await busy(async () => {
    const data = await file.arrayBuffer();
    const info = JSON.parse(await call("load_csv", { data, name: file.name, groupRow: groupRow || "" }));
    const rowSelect = $("#group-row");
    rowSelect.innerHTML = "";
    rowSelect.append(el("option", { value: "", text: tr("data.auto") }));
    for (const row of info.attribute_rows || []) rowSelect.append(el("option", { value: row, text: row }));
    rowSelect.value = groupRow || "";
    $("#group-row-field").classList.toggle("hidden", (info.attribute_rows || []).length < 2 && info.ok);
    if (!info.ok) {
      app.data = null;
      $("#data-info").innerHTML = "";
      $("#data-info").append(el("p", { class: "error", text: tr("data.error", { error: info.error }) }));
      if ((info.attribute_rows || []).length) $("#data-info").append(el("p", { text: tr("data.need_group_row") }));
      setStatus(tr("data.error", { error: info.error }));
      renderStepper();
      return;
    }
    app.data = info;
    app.sections = {};
    $("#results").classList.add("hidden");
    $("#download-btn").disabled = true;
    populateFromData();
    renderDataInfo();
    renderStepper();
    setStatus(tr("status.loaded"), 0);
  });
}

async function loadGnps() {
  const info = $("#gnps-info");
  info.innerHTML = "";
  if (!app.data) {
    info.append(el("p", { class: "error", text: tr("gnps.need_data") }));
    return;
  }
  const library = $("#gnps-library").files[0];
  const network = $("#gnps-network").files[0];
  await busy(async () => {
    const result = JSON.parse(await call("load_gnps", {
      library: library ? await library.arrayBuffer() : null,
      network: network ? await network.arrayBuffer() : null,
      lang: app.lang,
    }));
    info.append(result.ok
      ? el("p", { class: "ok", text: tr("gnps.loaded", { info: result.info }) })
      : el("p", { class: "error", text: tr("gnps.error", { error: result.error }) }));
  });
}

async function applyPreprocessing() {
  setStatus(tr("status.applying"), 0);
  await busy(async () => {
    const result = JSON.parse(await call("preprocess", { params: collectParams() }));
    app.sections = { pre: result.items };
    app.activeTab = "pre";
    $("#download-btn").disabled = true;
    renderResults();
    setStatus(result.ok ? tr("status.applied") : tr("status.error", { error: result.items[0] ? result.items[0].text : "" }), result.ok ? 1 : 0);
    $("#results").scrollIntoView({ behavior: "smooth" });
  });
}

async function runAnalysis() {
  setStatus(tr("status.running", { step: tr("tab.pre") }), 0);
  await busy(async () => {
    const result = JSON.parse(await call("run", { params: collectParams() }));
    app.sections = result.sections;
    app.activeTab = "pre";
    renderResults();
    $("#download-btn").disabled = !result.sections.pre || result.sections.pre.some((item) => item.type === "error");
    setStatus(result.errors.length ? tr("status.done_errors", { sections: result.errors.join(", ") }) : tr("status.done"), 1);
    $("#results").scrollIntoView({ behavior: "smooth" });
  });
}

async function downloadZip() {
  setStatus(tr("status.exporting"));
  await busy(async () => {
    const bytes = await call("export", {});
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/zip" }));
    const link = el("a", { href: url, download: "resultados_metabolomica.zip" });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    setStatus(tr("status.exported"));
  });
}

// ------------------------------------------------------------------ inicio
function start() {
  let saved = "pt";
  try { saved = localStorage.getItem("metabo-lang") || "pt"; } catch (error) { /* armazenamento indisponivel */ }
  app.lang = saved === "en" ? "en" : "pt";
  $("#lang").value = app.lang;
  renderForms();
  applyI18n();
  goTo(1);
  setStatus(tr("status.idle"));

  $("#lang").addEventListener("change", (event) => setLanguage(event.target.value));
  $("#csv-file").addEventListener("change", () => loadCsv(""));
  $("#group-row").addEventListener("change", (event) => loadCsv(event.target.value));
  $("#gnps-library").addEventListener("change", loadGnps);
  $("#gnps-network").addEventListener("change", loadGnps);
  $("#style-reset").addEventListener("click", () => renderStyleRows(true));
  $("#back-btn").addEventListener("click", () => goTo(app.step - 1));
  $("#next-btn").addEventListener("click", () => goTo(app.step + 1));
  $("#apply-btn").addEventListener("click", applyPreprocessing);
  $("#run-btn").addEventListener("click", runAnalysis);
  $("#download-btn").addEventListener("click", downloadZip);

  const source = new Blob([$("#worker-src").textContent], { type: "text/javascript" });
  worker = new Worker(URL.createObjectURL(source));
  worker.onmessage = onWorkerMessage;
  worker.onerror = (event) => {
    $("#boot-text").textContent = tr("loading.error", { error: event.message || "" });
    $("#boot-text").classList.add("error");
  };
}

start();
</script>
